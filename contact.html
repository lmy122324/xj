<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系方式</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    max-width: 360px;
    width: 90%;
  }
  .card img {
    width: 220px;
    height: 220px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 8px;
  }
  .card p {
    font-size: 13px;
    color: #999;
  }
</style>
</head>
<body>
<div class="card">
  <img src="wx.jpg" alt="微信二维码">
  <h2>扫一扫添加好友</h2>
  <p>长按识别二维码</p>
</div>
</body>
</html>
