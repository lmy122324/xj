// ====== 状态 ======
let currentLevel = 'primary';
let currentMode = 'flashcard';
let words = [];
let currentIndex = 0;
let correctCount = 0;
let wrongCount = 0;
let streakCount = 0;
let answered = false;   // quiz/spelling lock
let wrongWords = JSON.parse(localStorage.getItem('vocabWrongWords') || '[]');
let roundSize = 20;

// ====== 初始化 ======
function init() {
  document.getElementById('roundSize').value = roundSize;
  loadWrongWords();
  resetRound();
}

function shuffle(arr) {
  let a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function resetRound() {
  roundSize = parseInt(document.getElementById('roundSize').value);
  let pool = VOCAB[currentLevel];
  let size = roundSize === 0 ? pool.length : Math.min(roundSize, pool.length);
  words = shuffle(pool).slice(0, size);
  currentIndex = 0;
  correctCount = 0;
  wrongCount = 0;
  streakCount = 0;
  answered = false;
  updateStats();
  render();
  document.getElementById('totalVocab').textContent = '词库: ' + pool.length + '词';
}

function setLevel(level) {
  currentLevel = level;
  document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.level-btn').forEach(b => {
    if ((level === 'primary' && b.textContent.includes('小学')) ||
        (level === 'middle' && b.textContent.includes('初中')) ||
        (level === 'high' && b.textContent.includes('高中'))) {
      b.classList.add('active');
    }
  });
  resetRound();
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.mode-tab').forEach(b => {
    if ((mode === 'flashcard' && b.textContent.includes('闪卡')) ||
        (mode === 'quiz' && b.textContent.includes('选择')) ||
        (mode === 'spelling' && b.textContent.includes('拼写'))) {
      b.classList.add('active');
    }
  });
  answered = false;
  render();
}

function updateStats() {
  document.getElementById('statTotal').textContent = correctCount + wrongCount;
  document.getElementById('statCorrect').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statStreak').textContent = streakCount;
}

// ====== 发音 ======
function speak(word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.85;
  u.pitch = 1.1;
  let btn = document.querySelector('.speak-btn');
  if (btn) btn.classList.add('speaking');
  u.onend = () => { if (btn) btn.classList.remove('speaking'); };
  u.onerror = () => { if (btn) btn.classList.remove('speaking'); };
  window.speechSynthesis.speak(u);
}

// ====== 渲染 ======
function render() {
  if (words.length === 0) {
    document.getElementById('mainArea').innerHTML = '<div style="text-align:center;color:#999;"><p style="font-size:40px;">📭</p><p>词库为空</p></div>';
    return;
  }
  if (currentIndex >= words.length) {
    showResult();
    return;
  }
  let w = words[currentIndex];
  if (currentMode === 'flashcard') renderFlashcard(w);
  else if (currentMode === 'quiz') renderQuiz(w);
  else if (currentMode === 'spelling') renderSpelling(w);
}

function renderFlashcard(w) {
  document.getElementById('mainArea').innerHTML = `
    <div class="flashcard">
      <div class="flashcard-inner" id="flashcardInner" onclick="flipCard()">
        <div class="flashcard-front">
          <button class="speak-btn" onclick="event.stopPropagation();speak('${w.en.replace(/'/g, "\\'")}')">🔊</button>
          <div class="card-word">${w.en}</div>
          <div class="card-phonetic">${w.phonetic || ''}</div>
          <div class="flash-hint">👆 点击卡片翻转查看释义</div>
        </div>
        <div class="flashcard-back">
          <div class="card-meaning">${w.cn}</div>
          <div class="card-tag">${w.en}</div>
        </div>
      </div>
    </div>
    <div class="card-actions">
      <button class="btn btn-secondary" onclick="prevCard()">👈 上一个</button>
      <button class="btn btn-primary" onclick="nextCard()">下一个 👉</button>
    </div>
  `;
}

function flipCard() {
  let inner = document.getElementById('flashcardInner');
  if (inner) inner.classList.toggle('flipped');
}

function prevCard() {
  if (currentIndex > 0) {
    currentIndex--;
    render();
  }
}

function nextCard() {
  if (currentIndex < words.length - 1) {
    currentIndex++;
    render();
  } else {
    showResult();
  }
}

// ====== 选择题 ======
function renderQuiz(w) {
  let pool = VOCAB[currentLevel];
  let options = [w];
  // pick 3 distractors from same level
  let others = pool.filter(x => x.en !== w.en);
  others = shuffle(others).slice(0, 3);
  options = shuffle(options.concat(others));

  answered = false;

  let html = `<div class="quiz-word">${w.en}</div>
    <button class="speak-btn" onclick="speak('${w.en.replace(/'/g, "\\'")}')" style="margin-bottom:16px;">🔊</button>
    <div class="quiz-options">`;
  options.forEach((opt, i) => {
    html += `<button class="quiz-option" id="opt${i}" onclick="checkQuiz('${opt.cn.replace(/'/g, "\\'")}', ${i}, '${w.cn.replace(/'/g, "\\'")}')">${String.fromCharCode(65+i)}. ${opt.cn}</button>`;
  });
  html += '</div>';
  document.getElementById('mainArea').innerHTML = html;
}

function checkQuiz(selectedCn, optIdx, correctCn) {
  if (answered) return;
  answered = true;
  let w = words[currentIndex];
  let isCorrect = selectedCn === correctCn;

  // find correct option index
  let options = document.querySelectorAll('.quiz-option');
  let correctIdx = -1;
  options.forEach((opt, i) => {
    if (opt.textContent.includes(correctCn)) correctIdx = i;
  });

  if (isCorrect) {
    document.getElementById('opt' + optIdx).classList.add('correct-answer');
    correctCount++;
    streakCount++;
    if (streakCount % 5 === 0) spawnConfetti();
  } else {
    document.getElementById('opt' + optIdx).classList.add('wrong-answer');
    if (correctIdx >= 0) document.getElementById('opt' + correctIdx).classList.add('correct-answer');
    wrongCount++;
    streakCount = 0;
    addWrongWord(w);
  }
  updateStats();

  setTimeout(() => {
    currentIndex++;
    answered = false;
    render();
  }, 1200);
}

// ====== 拼写 ======
function renderSpelling(w) {
  answered = false;
  document.getElementById('mainArea').innerHTML = `
    <div class="spell-input-area">
      <button class="speak-btn" onclick="speak('${w.en.replace(/'/g, "\\'")}')" style="margin-bottom:12px;">🔊 听发音</button>
      <div class="spell-word-cn">${w.cn}</div>
      <div class="spell-hint" style="margin-bottom:8px;font-size:13px;color:#bbb;">请输入对应的英文单词</div>
      <input type="text" class="spell-input" id="spellInput" placeholder="输入英文单词..." autocomplete="off" autocorrect="off" autocapitalize="off" onkeydown="if(event.key==='Enter')checkSpell()">
      <div class="spell-feedback" id="spellFeedback"></div>
      <button class="btn btn-primary" style="margin-top:16px;width:100%;" onclick="checkSpell()">✅ 确认</button>
    </div>
  `;
  setTimeout(() => {
    let inp = document.getElementById('spellInput');
    if (inp) inp.focus();
  }, 100);
}

function checkSpell() {
  if (answered) return;
  let inp = document.getElementById('spellInput');
  let fb = document.getElementById('spellFeedback');
  if (!inp || !fb) return;
  let userAnswer = inp.value.trim();
  if (!userAnswer) return;
  answered = true;
  let w = words[currentIndex];
  let correctAnswer = w.en.toLowerCase();
  let isCorrect = userAnswer.toLowerCase() === correctAnswer;

  if (isCorrect) {
    inp.classList.add('correct');
    fb.className = 'spell-feedback correct';
    fb.textContent = '✅ 正确！' + w.en;
    correctCount++;
    streakCount++;
    if (streakCount % 5 === 0) spawnConfetti();
  } else {
    inp.classList.add('wrong');
    fb.className = 'spell-feedback wrong';
    fb.textContent = '❌ 正确答案: ' + w.en;
    wrongCount++;
    streakCount = 0;
    addWrongWord(w);
  }
  updateStats();

  setTimeout(() => {
    currentIndex++;
    answered = false;
    render();
  }, 1500);
}

// ====== 结果页 ======
function showResult() {
  let total = correctCount + wrongCount;
  if (total === 0) { resetRound(); return; }
  let pct = Math.round(correctCount / total * 100);
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '👍' : pct >= 50 ? '💪' : '📚';
  let title = pct >= 90 ? '太棒了！' : pct >= 70 ? '做得不错！' : pct >= 50 ? '继续加油！' : '多多练习！';

  document.getElementById('mainArea').innerHTML = `
    <div class="result-overlay" style="position:relative;background:none;">
      <div class="result-card">
        <div class="result-emoji">${emoji}</div>
        <div class="result-title">${title}</div>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-value" style="color:#4caf50;">${correctCount}</div>
            <div class="result-stat-label">✓ 正确</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-value" style="color:#f44336;">${wrongCount}</div>
            <div class="result-stat-label">✗ 错误</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-value" style="color:#667eea;">${pct}%</div>
            <div class="result-stat-label">正确率</div>
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="resetRound()">🔄 再来一轮</button>
        <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="setMode('flashcard')">📖 去背单词</button>
      </div>
    </div>
  `;
  loadWrongWords();
}

// ====== 错题本 ======
function addWrongWord(w) {
  // avoid duplicates
  if (!wrongWords.find(x => x.en === w.en)) {
    wrongWords.push({ en: w.en, cn: w.cn });
  }
  saveWrongWords();
  loadWrongWords();
}

function saveWrongWords() {
  localStorage.setItem('vocabWrongWords', JSON.stringify(wrongWords));
}

function clearWrongWords() {
  wrongWords = [];
  saveWrongWords();
  loadWrongWords();
}

function loadWrongWords() {
  document.getElementById('wrongCount').textContent = wrongWords.length;
  let list = document.getElementById('wrongList');
  let section = document.getElementById('wrongSection');
  if (wrongWords.length > 0) {
    section.classList.add('show');
    list.innerHTML = wrongWords.map(w =>
      `<div class="wrong-item"><span class="en">${w.en}</span><span class="cn">${w.cn}</span><span style="cursor:pointer;color:#ccc;" onclick="removeWrong('${w.en.replace(/'/g, "\\'")}')">✕</span></div>`
    ).join('');
  } else {
    section.classList.remove('show');
  }
}

function removeWrong(en) {
  wrongWords = wrongWords.filter(x => x.en !== en);
  saveWrongWords();
  loadWrongWords();
}

// ====== 🎉 撒花 ======
function spawnConfetti() {
  let container = document.getElementById('confettiContainer');
  let colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff8c00','#a855f7','#ff69b4'];
  for (let i = 0; i < 30; i++) {
    let piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    piece.style.width = (6 + Math.random() * 10) + 'px';
    piece.style.height = (6 + Math.random() * 10) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

// ====== 键盘快捷键 ======
document.addEventListener('keydown', function(e) {
  if (currentMode === 'flashcard') {
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      flipCard();
    } else if (e.key === 'ArrowRight') {
      nextCard();
    } else if (e.key === 'ArrowLeft') {
      prevCard();
    }
  }
  if (currentMode === 'quiz' && !answered) {
    let keys = ['a','b','c','d','1','2','3','4'];
    let idx = keys.indexOf(e.key.toLowerCase());
    if (idx >= 0) {
      let optIdx = idx % 4;
      let w = words[currentIndex];
      let opt = document.getElementById('opt' + optIdx);
      if (opt) checkQuiz(opt.textContent.substring(3).trim(), optIdx, w.cn);
    }
  }
});

init();
</script>
