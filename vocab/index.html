<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>单词消消乐 - 科学背单词</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #f5f6fa;
  min-height:100vh;
  display:flex; justify-content:center; align-items:flex-start;
  padding:16px;
  -webkit-tap-highlight-color: transparent;
}
.app{
  width:100%; max-width:480px;
  background:#fff; border-radius:20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  overflow:hidden; min-height:90vh;
  display:flex; flex-direction:column;
}

/* ===== 导航栏 ===== */
.nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid #f0f0f0;
  min-height:52px;
}
.nav-title{ font-size:16px; font-weight:700; color:#333; }
.nav-back{ font-size:22px; cursor:pointer; color:#666; padding:4px; display:none; }
.nav-action{ font-size:13px; color:#667eea; cursor:pointer; font-weight:600; }

/* ===== 书选择页 ===== */
.book-page{ padding:16px 20px; flex:1; display:flex; flex-direction:column; }
.book-page h2{ font-size:18px; color:#333; margin-bottom:4px; }
.book-page .sub{ font-size:13px; color:#999; margin-bottom:16px; }
.book-list{ flex:1; overflow-y:auto; }
.book-category{ margin-bottom:20px; }
.book-cat-title{ font-size:13px; color:#aaa; font-weight:700; margin-bottom:8px; text-transform:uppercase; }
.book-item{
  display:flex; align-items:center; padding:14px 16px;
  background:#f8f9ff; border-radius:14px; margin-bottom:8px;
  cursor:pointer; transition:all 0.2s;
}
.book-item:hover{ background:#eef0ff; }
.book-item:active{ transform:scale(0.98); }
.book-icon{ font-size:28px; margin-right:12px; }
.book-info{ flex:1; }
.book-name{ font-size:15px; font-weight:600; color:#333; }
.book-desc{ font-size:12px; color:#999; margin-top:2px; }
.book-count{ font-size:12px; color:#667eea; font-weight:600; }
.book-item .arrow{ color:#ccc; font-size:18px; }

/* 上传区 */
.upload-area{
  margin-top:12px; padding:20px;
  border:2px dashed #ddd; border-radius:14px;
  text-align:center; cursor:pointer; transition:all 0.2s;
}
.upload-area:hover{ border-color:#667eea; background:#fafbff; }
.upload-area .icon{ font-size:32px; margin-bottom:8px; }
.upload-area .text{ font-size:13px; color:#999; }
.upload-area .hint{ font-size:11px; color:#ccc; margin-top:4px; }
.upload-area input{ display:none; }

/* ===== 学习页 ===== */
.learn-page{ display:none; flex:1; flex-direction:column; }
.learn-page.active{ display:flex; }

/* 进度条 */
.progress-bar-wrap{
  padding:12px 20px; background:#fafafa;
  border-bottom:1px solid #f0f0f0;
}
.progress-info{
  display:flex; justify-content:space-between;
  font-size:12px; color:#999; margin-bottom:6px;
}
.progress-bar{
  height:6px; background:#e8e8e8; border-radius:3px; overflow:hidden;
}
.progress-fill{
  height:100%; background:linear-gradient(90deg,#667eea,#764ba2);
  border-radius:3px; transition:width 0.4s;
}

/* 学习卡片 */
.card-area{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px; }
.word-card{
  width:100%; max-width:360px;
  background:#fff; border-radius:20px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.04);
  padding:32px 24px 24px;
  text-align:center;
  transition:transform 0.4s, opacity 0.4s;
  min-height:240px;
  display:flex; flex-direction:column;
  justify-content:center;
}
.word-card.flip-out{ transform:scale(0.9); opacity:0; }

.word-en{ font-size:34px; font-weight:700; color:#222; letter-spacing:1px; }
.word-phonetic{ font-size:14px; color:#aaa; margin:8px 0; }
.word-speaker{ 
  width:40px; height:40px; border-radius:50%;
  border:1.5px solid #ddd; background:#fff;
  font-size:18px; cursor:pointer; margin:0 auto 12px;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.word-speaker:hover{ border-color:#667eea; color:#667eea; }
.word-speaker.playing{ background:#667eea; border-color:#667eea; color:#fff; animation:pulse 0.8s infinite; }
@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }

/* 显示释义区域 */
.word-reveal{ display:none; margin-top:8px; }
.word-reveal.show{ display:block; }
.word-cn{ font-size:20px; color:#667eea; font-weight:600; margin-bottom:8px; }
.word-example{
  margin-top:12px; padding:12px 16px;
  background:#f8f9ff; border-radius:12px;
  text-align:left; font-size:13px; line-height:1.6;
}
.word-example .ex-en{ color:#333; }
.word-example .ex-cn{ color:#888; margin-top:4px; }
.word-pos{ font-size:12px; color:#bbb; margin-bottom:4px; }

/* 操作按钮 */
.action-row{
  display:flex; gap:12px; padding:16px 20px 24px;
  width:100%; max-width:400px;
}
.btn{
  flex:1; padding:16px 0; border-radius:14px;
  border:none; font-size:15px; font-weight:700; cursor:pointer;
  transition:all 0.2s; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.btn:active{ transform:scale(0.96); }
.btn .label{ font-size:15px; }
.btn .sub-label{ font-size:10px; opacity:0.7; font-weight:400; }

.btn-know{ background:#e8f5e9; color:#2e7d32; }
.btn-know:hover{ background:#c8e6c9; }
.btn-unsure{ background:#fff3e0; color:#e65100; }
.btn-unsure:hover{ background:#ffe0b2; }
.btn-dunno{ background:#ffebee; color:#c62828; }
.btn-dunno:hover{ background:#ffcdd2; }

/* ===== 结果页 ===== */
.result-overlay{
  position:fixed; top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center;
  z-index:100;
}
.result-card{
  background:#fff; border-radius:24px; padding:28px 24px;
  text-align:center; width:90%; max-width:360px;
}
.result-emoji{ font-size:48px; margin-bottom:8px; }
.result-title{ font-size:20px; font-weight:700; color:#333; margin-bottom:16px; }
.result-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
.result-cell{ text-align:center; }
.result-cell .val{ font-size:26px; font-weight:700; }
.result-cell .lbl{ font-size:11px; color:#999; margin-top:2px; }

/* 复习提示 */
.review-badge{
  display:inline-block; padding:4px 10px;
  background:#fff3e0; color:#e65100;
  border-radius:20px; font-size:11px; font-weight:600;
  margin-bottom:8px;
}

/* 完成页 */
.all-done{
  text-align:center; padding:40px 20px;
}
.all-done .emoji{ font-size:56px; margin-bottom:12px; }
.all-done .title{ font-size:20px; font-weight:700; color:#333; margin-bottom:8px; }
.all-done .sub{ font-size:14px; color:#888; margin-bottom:20px; }

/* 上传词库预览 */
.custom-preview{
  margin-top:8px; padding:12px; background:#fffbe6; border-radius:10px;
  font-size:12px; color:#666; display:none;
}

/* 加载弹窗 */
.loading-mask{
  position:fixed; top:0;left:0;right:0;bottom:0;
  background:rgba(255,255,255,0.8);
  display:flex; align-items:center; justify-content:center;
  z-index:200; display:none;
}
.loading-mask.show{ display:flex; }
.spinner{
  width:40px; height:40px; border:3px solid #eee;
  border-top-color:#667eea; border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{ to{transform:rotate(360deg)} }

/* Toast */
.toast{
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  background:#333; color:#fff; padding:10px 24px; border-radius:20px;
  font-size:14px; z-index:300; opacity:0; transition:opacity 0.3s;
  pointer-events:none;
}
.toast.show{ opacity:1; }

@media(max-width:400px){
  .word-en{ font-size:28px; }
  .btn{ padding:14px 0; }
  .btn .label{ font-size:13px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 导航 -->
  <div class="nav">
    <span class="nav-back" id="navBack" onclick="goBack()">←</span>
    <span class="nav-title" id="navTitle">📚 单词消消乐</span>
    <span class="nav-action" id="navAction"></span>
  </div>

  <!-- 词书选择页 -->
  <div class="book-page" id="bookPage">
    <h2>选择词书</h2>
    <div class="sub">选一本开始今天的学习吧</div>
    <div class="book-list" id="bookList"></div>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📂</div>

      <input type="file" id="fileInput" accept=".txt,.csv" onchange="handleUpload(event)">

    <div class="custom-preview" id="customPreview"></div>
  </div>

    </div>
    <div class="card-area" id="cardArea"></div>
    <div class="action-row" id="actionRow" style="display:none;">
      <button class="btn btn-dunno" onclick="answer('forgot')">
        <span class="label">不认识</span>
        <span class="sub-label">下次再来</span>
      </button>
      <button class="btn btn-unsure" onclick="answer('unsure')">

      <button class="btn btn-know" onclick="answer('known')">
        <span class="label">认识</span>
        <span class="sub-label">直接过</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-mask" id="loading"><div class="spinner"></div></div>

// ====== 学习记录 (localStorage) ======
function getStudyData() {
  try { return JSON.parse(localStorage.getItem('vocab_v2_study') || '{}'); }
  catch(e) { return {}; }
}
function saveStudyData(data) {
  localStorage.setItem('vocab_v2_study', JSON.stringify(data));
}

// ====== 艾宾浩斯间隔(天) ======
const EBBINGHAUS = [1, 2, 4, 7, 15, 30];

function getNextReviewDate(stage) {
  let days = EBBINGHAUS[Math.min(stage, EBBINGHAUS.length - 1)];
  return Date.now() + days * 86400000;
}

// ====== 页面切换 ======
function showBookPage() {
  document.getElementById('bookPage').style.display = 'flex';
  document.getElementById('learnPage').classList.remove('active');
  document.getElementById('navTitle').textContent = '📚 单词消消乐';
  document.getElementById('navBack').style.display = 'none';
  document.getElementById('navAction').textContent = '';
  document.getElementById('actionRow').style.display = 'none';
}

function showLearnPage() {
  document.getElementById('bookPage').style.display = 'none';
  document.getElementById('learnPage').classList.add('active');
  document.getElementById('navBack').style.display = 'block';
  document.getElementById('actionRow').style.display = 'flex';
}

function goBack() {
  currentBook = null;
  currentWords = [];
  currentIdx = 0;
  learned = 0;
  reviewQueue = [];
  isReviewMode = false;
  showBookPage();
}

// ====== 渲染词书列表 ======
function renderBookList() {
  let html = '';
  let cats = {};
  for (let [key, book] of Object.entries(BOOKS)) {
    if (!cats[book.cat]) cats[book.cat] = [];
    cats[book.cat].push({key, ...book});
  }
  for (let [cat, books] of Object.entries(cats)) {
    html += `<div class="book-category"><div class="book-cat-title">${cat}</div>`;
    for (let b of books) {
      let studyData = getStudyData();
      let bookData = studyData[b.key] || { learned: 0, total: b.count };
      let pct = bookData.total > 0 ? Math.round(bookData.learned / bookData.total * 100) : 0;
      html += `
        <div class="book-item" onclick="selectBook('${b.key}')">
          <span class="book-icon">${b.icon}</span>
          <div class="book-info">
            <div class="book-name">${b.name}</div>
            <div class="book-desc">${b.desc}</div>
          </div>
          <span class="book-count">${pct > 0 ? pct + '%' : b.count + '词'}</span>
          <span class="arrow">›</span>
        </div>`;
    }
    html += '</div>';
  }
  document.getElementById('bookList').innerHTML = html;

  // check custom books
  let customBooks = JSON.parse(localStorage.getItem('vocab_custom_books') || '[]');
  if (customBooks.length > 0) {
    let preview = document.getElementById('customPreview');
    preview.style.display = 'block';
    preview.innerHTML = '<b>已上传词库：</b><br>' + customBooks.map((b,i) =>
      `${b.name}（${b.words.length}词）<button onclick="deleteCustomBook(${i})" style="margin-left:8px;border:none;background:none;color:#f44336;cursor:pointer;">删除</button>`
    ).join('<br>');
  }
}

// ====== 选择词书 ======
function selectBook(bookKey) {
  let book = BOOKS[bookKey];
  if (!book) {
    // check custom
    let customBooks = JSON.parse(localStorage.getItem('vocab_custom_books') || '[]');
    let found = customBooks.find(b => b.key === bookKey);
    if (found) { book = found; }
    else return;
  }
  currentBook = bookKey;
  totalWords = book.words.length;
  currentIdx = 0;
  learned = 0;

  // build queue: new words first, then reviews
  let studyData = getStudyData();
  let bookData = studyData[bookKey] || { learned: [], reviews: {} };
  let learnedSet = new Set(bookData.learned || []);

  // words not yet fully learned
  currentWords = book.words.filter((w, i) => !learnedSet.has(i));

  // check for review due
  reviewQueue = [];
  let now = Date.now();
  let reviews = bookData.reviews || {};
  for (let [idx, review] of Object.entries(reviews)) {
    if (review.nextReview && review.nextReview <= now) {
      reviewQueue.push({ ...book.words[parseInt(idx)], _origIdx: parseInt(idx), _stage: review.stage });
    }
  }

  // shuffle new words
  currentWords = shuffleArr(currentWords);

  isReviewMode = false;
  if (reviewQueue.length > 0) {
    // Interleave reviews with new words
    reviewQueue = shuffleArr(reviewQueue);
    currentWords = [...reviewQueue, ...currentWords];
  }

  updateProgress();
  renderCard();
  showLearnPage();
  document.getElementById('navTitle').textContent = book.name || book.name_zh || '背单词';
}

// ====== 渲染单词卡片 ======
function renderCard() {
  let card = document.getElementById('cardArea');
  if (currentIdx >= currentWords.length) {
    showAllDone();
    return;
  }

  let w = currentWords[currentIdx];
  let isReview = w._origIdx !== undefined;

  card.innerHTML = `
    ${isReview ? '<div class="review-badge">🔄 复习</div>' : ''}
    <div class="word-card" id="wordCard">
      <div class="word-en">${w.en}</div>
      <div class="word-phonetic">${w.phonetic || ''}</div>
      <button class="word-speaker" id="speakerBtn" onclick="speakWord('${w.en.replace(/'/g,"\\'")}')">🔊</button>
      <div class="word-reveal" id="wordReveal">
        <div class="word-pos">${w.pos || ''}</div>
        <div class="word-cn">${w.cn}</div>
        ${w.ex_en ? `<div class="word-example">
          <div class="ex-en">📖 ${w.ex_en}</div>
          ${w.ex_cn ? `<div class="ex-cn">${w.ex_cn}</div>` : ''}
        </div>` : ''}
      </div>
    </div>
  `;

  // Auto-speak if available
  setTimeout(() => {
    let spk = document.getElementById('speakerBtn');
    if (spk) spk.style.opacity = '1';
  }, 200);
}

// ====== 回答 ======
function answer(grade) {
  let w = currentWords[currentIdx];
  let card = document.getElementById('wordCard');
  let reveal = document.getElementById('wordReveal');

  // Show meaning
  if (reveal && !reveal.classList.contains('show')) {
    reveal.classList.add('show');
  }

  if (grade === 'known') {
    // Mark as learned
    markLearned(w);
    learned++;
    updateProgress();
    animateNext();
  } else if (grade === 'unsure') {
    // Show meaning, add to review queue
    markReview(w, 0);
    updateProgress();
    // Wait a moment so they can read
    setTimeout(() => animateNext(), 800);
  } else if (grade === 'forgot') {
    // Show meaning, mark for review
    markReview(w, 0);
    updateProgress();
    setTimeout(() => animateNext(), 800);
  }
}

function animateNext() {
  let card = document.getElementById('wordCard');
  if (card) card.classList.add('flip-out');
  setTimeout(() => {
    currentIdx++;
    renderCard();
    updateProgress();
    document.getElementById('wordCard')?.classList.remove('flip-out');
  }, 300);
}

// ====== 标记掌握 ======
function markLearned(w) {
  if (!currentBook) return;
  let data = getStudyData();
  if (!data[currentBook]) data[currentBook] = { learned: [], reviews: {} };
  let wordIdx = w._origIdx !== undefined ? w._origIdx : findWordIndex(w);
  if (!data[currentBook].learned.includes(wordIdx)) {
    data[currentBook].learned.push(wordIdx);
  }
  // remove from reviews if present
  delete data[currentBook].reviews[wordIdx];
  saveStudyData(data);
}

function markReview(w, stage) {
  if (!currentBook) return;
  let data = getStudyData();
  if (!data[currentBook]) data[currentBook] = { learned: [], reviews: {} };
  let wordIdx = w._origIdx !== undefined ? w._origIdx : findWordIndex(w);
  data[currentBook].reviews[wordIdx] = {
    stage: stage,
    nextReview: getNextReviewDate(stage),
    lastSeen: Date.now()
  };
  saveStudyData(data);
}

function findWordIndex(w) {
  let book = BOOKS[currentBook];
  if (!book) {
    let customBooks = JSON.parse(localStorage.getItem('vocab_custom_books') || '[]');
    let found = customBooks.find(b => b.key === currentBook);
    if (found) book = found;
    else return -1;
  }
  return book.words.findIndex(x => x.en === w.en);
}

// ====== 进度 ======
function updateProgress() {
  let pct = totalWords > 0 ? Math.round((learned / totalWords) * 100) : 0;
  document.getElementById('progressLabel').textContent = `已学 ${learned} / ${totalWords}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

// ====== 完成页 ======
function showAllDone() {
  let card = document.getElementById('cardArea');
  let pct = totalWords > 0 ? Math.round((learned / totalWords) * 100) : 0;
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '💪' : '📚';
  let msg = pct >= 90 ? '太厉害了！全部掌握！' : pct >= 70 ? '很不错，继续加油！' : pct >= 50 ? '还有进步空间，再来一轮！' : '别灰心，坚持就是胜利！';

  card.innerHTML = `
    <div class="all-done">
      <div class="emoji">${emoji}</div>
      <div class="title">${msg}</div>
      <div class="sub">本轮完成 ${learned}/${totalWords} 词 · 正确率 ${pct}%</div>
      <button class="btn btn-know" style="width:100%;max-width:300px;padding:16px;" onclick="restartRound()">🔄 再来一轮</button>
      <button class="btn btn-unsure" style="width:100%;max-width:300px;padding:16px;margin-top:8px;" onclick="restartRound(true)">📝 只复习错词</button>
      <button class="btn" style="width:100%;max-width:300px;padding:16px;margin-top:8px;background:#f0f0f0;color:#666;" onclick="goBack()">📚 换一本词书</button>
    </div>
  `;
  document.getElementById('actionRow').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressPct').textContent = '100%';
}

function restartRound(reviewOnly) {
  let book = BOOKS[currentBook];
  if (!book) {
    let customBooks = JSON.parse(localStorage.getItem('vocab_custom_books') || '[]');
    let found = customBooks.find(b => b.key === currentBook);
    if (found) book = found;
    else return goBack();
  }

  if (reviewOnly) {
    let data = getStudyData();
    let bookData = data[currentBook] || { reviews: {} };
    let reviews = bookData.reviews || {};
    let entries = Object.entries(reviews);
    if (entries.length === 0) {
      showToast('没有需要复习的单词！');
      return;
    }
    currentWords = entries.map(([idx, r]) => ({
      ...book.words[parseInt(idx)],
      _origIdx: parseInt(idx),
      _stage: r.stage
    }));
    currentWords = shuffleArr(currentWords);
    totalWords = currentWords.length;
  } else {
    let data = getStudyData();
    let bookData = data[currentBook] || { learned: [] };
    let learnedSet = new Set(bookData.learned || []);
    currentWords = book.words.filter((w, i) => !learnedSet.has(i));
    currentWords = shuffleArr(currentWords);
    totalWords = currentWords.length;
  }

  currentIdx = 0;
  learned = 0;
  isReviewMode = reviewOnly;
  updateProgress();
  renderCard();
  document.getElementById('actionRow').style.display = 'flex';
}

// ====== 发音（优先API真人发音 → Web Speech fallback） ======
let voicesReady = false;
let voicesLoaded = false;
let audioCache = {}; // cache fetched audio URLs

function loadVoices() {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve([]);
    let voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) { voicesLoaded = true; return resolve(voices); }
    window.speechSynthesis.onvoiceschanged = () => {
      voicesLoaded = true;
      resolve(window.speechSynthesis.getVoices());
    };
    setTimeout(() => { voicesLoaded = true; resolve([]); }, 3000);
  });
}
loadVoices().then(() => { voicesReady = true; });

async function fetchAudioUrl(word) {
  if (audioCache[word]) return audioCache[word];
  try {
    let resp = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
    if (!resp.ok) return null;
    let data = await resp.json();
    if (!Array.isArray(data) || !data[0]) return null;
    let phonetics = data[0].phonetics || [];
    for (let p of phonetics) {
      if (p.audio && p.audio.trim()) {
        audioCache[word] = p.audio;
        return p.audio;
      }
    }
    return null;
  } catch(e) {
    return null;
  }
}

async function speakWord(word) {
  let btn = document.getElementById('speakerBtn');
  if (btn) btn.classList.add('playing');

  // Strategy 1: Free Dictionary API mp3
  let audioUrl = await fetchAudioUrl(word);
  if (audioUrl) {
    let audio = new Audio(audioUrl);
    audio.onended = () => { if (btn) btn.classList.remove('playing'); };
    audio.onerror = () => {
      // fallback to speech synthesis
      speakWithTTS(word, btn);
    };
    audio.play().catch(() => speakWithTTS(word, btn));
    return;
  }

  // Strategy 2: Web Speech API fallback
  speakWithTTS(word, btn);
}

function speakWithTTS(word, btn) {
  if (!('speechSynthesis' in window)) {
    if (btn) btn.classList.remove('playing');
    showToast('⚠️ 发音暂不可用');
    return;
  }
  function doSpeak() {
    window.speechSynthesis.cancel();
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.pitch = 1.0;
    u.volume = 1.0;
    let voices = window.speechSynthesis.getVoices();
    let enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'))
      || voices.find(v => v.lang.startsWith('en-US'))
      || voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;
    u.onend = () => { if (btn) btn.classList.remove('playing'); };
    u.onerror = () => { if (btn) btn.classList.remove('playing'); };
    window.speechSynthesis.speak(u);
  }
  if (!voicesLoaded) {
    loadVoices().then(doSpeak);
  } else {
    doSpeak();
  }
}

// ====== 上传词库 ======
function handleUpload(e) {
  let file = e.target.files[0];
  if (!file) return;
  let reader = new FileReader();
  reader.onload = function(ev) {
    let text = ev.target.result;
    let lines = text.split(/[\r\n]+/).filter(l => l.trim());
    let words = [];
    for (let line of lines) {
      let parts = line.split(/[,，\t]/);
      if (parts.length >= 2 && parts[0].trim() && parts[1].trim()) {
        words.push({
          en: parts[0].trim(),
          cn: parts[1].trim(),
          phonetic: parts[2] ? parts[2].trim() : '',
          pos: parts[3] ? parts[3].trim() : '',
          ex_en: parts[4] ? parts[4].trim() : '',
          ex_cn: parts[5] ? parts[5].trim() : '',
        });
      }
    }
    if (words.length === 0) {
      showToast('未能解析词库，请检查格式：英文,中文 每行一个');
      return;
    }
    let bookName = file.name.replace(/\.(txt|csv)$/i, '');
    let bookKey = 'custom_' + Date.now();
    let customBook = {
      key: bookKey,
      name: bookName,
      icon: '📂',
      cat: '自定义',
      count: words.length,
      desc: `用户上传 · ${words.length}词`,
      words: words
    };

    let customBooks = JSON.parse(localStorage.getItem('vocab_custom_books') || '[]');
    customBooks.push(customBook);
    localStorage.setItem('vocab_custom_books', JSON.stringify(customBooks));

    // Add to BOOKS temporarily
    BOOKS[bookKey] = customBook;

    showToast(`✅ 已导入「${bookName}」${words.length}词`);
    renderBookList();
  };
  reader.readAsText(file);
  e.target.value = '';
}

function deleteCustomBook(index) {
  let customBooks = JSON.parse(localStorage.getItem('vocab_custom_books') || '[]');
  let book = customBooks[index];
  if (book) {
    delete BOOKS[book.key];
    if (currentBook === book.key) {
      currentBook = null;
      showBookPage();
    }
  }
  customBooks.splice(index, 1);
  localStorage.setItem('vocab_custom_books', JSON.stringify(customBooks));
  showToast('已删除');
  renderBookList();
}

// ====== 工具函数 ======
function shuffleArr(arr) {
  let a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ====== 键盘快捷键 ======
document.addEventListener('keydown', function(e) {
  if (!currentBook) return;
  if (e.key === '1' || e.key === 'ArrowLeft') answer('forgot');
  else if (e.key === '2' || e.key === 'ArrowDown') answer('unsure');
  else if (e.key === '3' || e.key === 'ArrowRight') answer('known');
  else if (e.key === ' ') { e.preventDefault(); speakWord(currentWords[currentIdx]?.en || ''); }
});

// ====== 初始化 ======
renderBookList();
showBookPage();
</script>
