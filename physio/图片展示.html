<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片展示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d0d;color:#ccc;font-family:Microsoft YaHei,sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.container{max-width:800px;width:100%;text-align:center;}
img{max-width:100%;height:auto;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div class="container">
  <img src="display_img.jpg" alt="展示图片">
</div>
</body>
</html>
