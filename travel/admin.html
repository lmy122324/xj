<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 - 远游旅行网</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-tabs{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap}
.admin-tabs button{padding:10px 24px;border:none;border-radius:25px;cursor:pointer;font-size:14px;background:#E2E8F0;color:var(--text);transition:var(--transition)}
.admin-tabs button.active{background:var(--primary);color:white}
.data-table{width:100%;border-collapse:collapse;background:white;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.data-table th{background:var(--dark);color:white;padding:12px 16px;text-align:left;font-size:13px}
.data-table td{padding:12px 16px;border-bottom:1px solid #eee;font-size:14px}
.data-table tr:hover{background:#F7FAFC}
.empty-state{text-align:center;padding:60px 20px;color:var(--gray)}
.empty-state .icon{font-size:48px;margin-bottom:15px}
.pwd-box{max-width:400px;margin:100px auto;text-align:center}
.pwd-box input{padding:12px;border:2px solid #E2E8F0;border-radius:8px;font-size:16px;width:100%;margin-bottom:15px;text-align:center}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:30px}
.stat-card{background:white;padding:25px;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.stat-card .num{font-size:36px;font-weight:700;color:var(--primary)}
.stat-card .label{color:var(--gray);font-size:14px;margin-top:5px}
</style>
</head>
<body>

<div class="pwd-box" id="login-box">
  <h2 style="margin-bottom:20px">管理员登录</h2>
  <input type="password" id="admin-pwd" placeholder="请输入管理密码">
  <button class="btn-primary" onclick="adminLogin()" style="width:100%">登录</button>
  <p id="pwd-msg" style="color:#e74c3c;margin-top:10px;font-size:14px"></p>
</div>

<div id="admin-panel" style="display:none">
<header class="header"><div class="container" style="display:flex;justify-content:space-between;align-items:center">
  <h2 style="color:var(--primary)">后台管理</h2>
  <button onclick="logout()" class="btn-outline">退出</button>
</div></header>

<section class="section" style="padding-top:30px"><div class="container">

<div class="stats-grid">
  <div class="stat-card"><div class="num" id="stat-bookings">0</div><div class="label">预约订单</div></div>
  <div class="stat-card"><div class="num" id="stat-messages">0</div><div class="label">在线留言</div></div>
  <div class="stat-card"><div class="num" id="stat-users">0</div><div class="label">注册用户</div></div>
  <div class="stat-card"><div class="num" id="stat-views">0</div><div class="label">页面浏览</div></div>
</div>

<div class="admin-tabs">
  <button class="active" onclick="switchTab('bookings',this)">预约订单</button>
  <button onclick="switchTab('messages',this)">在线留言</button>
  <button onclick="switchTab('users',this)">注册用户</button>
</div>

<div id="tab-bookings">
<table class="data-table">
<thead><tr><th>编号</th><th>姓名</th><th>电话</th><th>目的地</th><th>出发日期</th><th>人数</th><th>提交时间</th></tr></thead>
<tbody id="bookings-tbody"></tbody>
</table>
</div>

<div id="tab-messages" style="display:none">
<table class="data-table">
<thead><tr><th>编号</th><th>姓名</th><th>电话</th><th>邮箱</th><th>留言内容</th><th>提交时间</th></tr></thead>
<tbody id="messages-tbody"></tbody>
</table>
</div>

<div id="tab-users" style="display:none">
<table class="data-table">
<thead><tr><th>编号</th><th>用户名</th><th>真实姓名</th><th>注册时间</th></tr></thead>
<tbody id="users-tbody"></tbody>
</table>
</div>

</div></section>
</div>

<script>
var ADMIN_PWD = 'admin123';

function adminLogin(){
  var pwd = document.getElementById('admin-pwd').value;
  if(pwd === ADMIN_PWD){
    localStorage.setItem('admin_logged_in', '1');
    document.getElementById('login-box').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadAllData();
  }else{
    document.getElementById('pwd-msg').textContent = '密码错误';
  }
}

function logout(){
  localStorage.removeItem('admin_logged_in');
  location.reload();
}

function switchTab(tab, btn){
  document.querySelectorAll('.admin-tabs button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('tab-bookings').style.display = tab === 'bookings' ? 'block' : 'none';
  document.getElementById('tab-messages').style.display = tab === 'messages' ? 'block' : 'none';
  document.getElementById('tab-users').style.display = tab === 'users' ? 'block' : 'none';
}

function loadAllData(){
  var bookings = JSON.parse(localStorage.getItem('travel_bookings') || '[]');
  var messages = JSON.parse(localStorage.getItem('travel_messages') || '[]');
  var users = JSON.parse(localStorage.getItem('travel_users') || '[]');
  var views = parseInt(localStorage.getItem('travel_views') || '0');

  document.getElementById('stat-bookings').textContent = bookings.length;
  document.getElementById('stat-messages').textContent = messages.length;
  document.getElementById('stat-users').textContent = users.length;
  document.getElementById('stat-views').textContent = views;

  var bHtml = ''; bookings.forEach(function(b,i){ bHtml += '<tr><td>'+(i+1)+'</td><td>'+b.name+'</td><td>'+b.phone+'</td><td>'+b.dest+'</td><td>'+b.date+'</td><td>'+b.people+'</td><td>'+b.time+'</td></tr>'; });
  document.getElementById('bookings-tbody').innerHTML = bHtml || '<tr><td colspan="7" class="empty-state">暂无预约订单</td></tr>';

  var mHtml = ''; messages.forEach(function(m,i){ mHtml += '<tr><td>'+(i+1)+'</td><td>'+m.name+'</td><td>'+m.phone+'</td><td>'+m.email+'</td><td>'+m.msg+'</td><td>'+m.time+'</td></tr>'; });
  document.getElementById('messages-tbody').innerHTML = mHtml || '<tr><td colspan="6" class="empty-state">暂无留言</td></tr>';

  var uHtml = ''; users.forEach(function(u,i){ uHtml += '<tr><td>'+(i+1)+'</td><td>'+u.username+'</td><td>'+u.name+'</td><td>'+u.time+'</td></tr>'; });
  document.getElementById('users-tbody').innerHTML = uHtml || '<tr><td colspan="4" class="empty-state">暂无注册用户</td></tr>';
}

// Page view counter
(function(){
  var views = parseInt(localStorage.getItem('travel_views') || '0');
  localStorage.setItem('travel_views', views + 1);
})();

// Auto login if already logged in
if(localStorage.getItem('admin_logged_in') === '1'){
  document.getElementById('login-box').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  loadAllData();
}
</script>
</body>
</html>
