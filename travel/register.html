<div class="form-card">
<h2>用户注册</h2>
<form id="register-form">
<div class="form-group"><label>真实姓名</label><input type="text" id="reg-name" required></div>
<div class="form-group"><label>用户名</label><input type="text" id="reg-username" required></div>
<div class="form-group"><label>密码</label><input type="password" id="reg-password" required></div>
<div class="form-group"><label>确认密码</label><input type="password" id="reg-password2" required></div>
<button type="submit" class="btn-primary">注册</button>
<p id="message"></p>
</form>
<div class="form-link">已有账号？<a href="login.html">立即登录</a></div>
