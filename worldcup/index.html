<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守护最好的小徐佳俊 🏆 世界杯情报站</title>
<style>
:root{--bg:#0a0e27;--card:#131743;--accent:#00d4aa;--gold:#ffd700;--red:#ff4757;--text:#e0e6ff;--sub:#8892b0;--border:#1e2350;--blue:#4d7cff;--orange:#ff8c42}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.header{padding:14px 12px;background:linear-gradient(135deg,#0a0e27,#1a1f4e);border-bottom:1px solid var(--border)}
.header h1{font-size:16px;font-weight:800}
.header h1 span{color:var(--gold)}
.header .sub{font-size:10px;color:var(--sub);margin-top:2px}
.header .badge{display:inline-block;padding:1px 6px;border-radius:3px;background:var(--accent);color:#000;font-size:9px;font-weight:700;margin-left:4px}
.container{max-width:720px;margin:0 auto;padding:8px 8px 60px}

/* Report card */
.report{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.report-header{padding:8px 10px;background:rgba(0,212,170,.05);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}
.report-header:hover{background:rgba(0,212,170,.1)}
.report-header.active{background:rgba(0,212,170,.12);border-bottom:1px solid var(--border)}
.report-time{font-size:11px;font-weight:600}
.report-ver{font-size:9px;color:var(--sub);background:var(--border);padding:1px 5px;border-radius:3px;margin-left:4px}
.report-badge{font-size:9px;padding:1px 6px;border-radius:3px}
.bdg-new{background:var(--red);color:#fff}
.bdg-update{background:var(--gold);color:#000}
.report-body{padding:8px 10px;display:none}
.report-body.open{display:block}

/* Match blocks */
.mb{padding:6px 0;border-bottom:1px solid rgba(30,35,80,.2)}
.mb:last-child{border-bottom:none}
.mb-title{font-size:12px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.mb-score{font-size:14px;font-weight:800;color:var(--gold)}
.mb-score.live{color:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.mb-confidence{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px}
.conf-high{background:rgba(0,212,170,.15);color:var(--accent)}
.conf-mid{background:rgba(255,215,0,.15);color:var(--gold)}
.conf-low{background:rgba(255,71,87,.15);color:var(--red)}
.mb-note{font-size:10px;color:var(--sub);margin-top:2px}

/* Change markers */
.change{font-size:10px;padding:2px 0}
.change-up{color:var(--accent)}
.change-down{color:var(--red)}
.change-neutral{color:var(--orange)}
.change-label{font-weight:700;margin-right:4px}

/* Section */
.sec-title{font-size:11px;font-weight:700;color:var(--accent);padding:8px 0 4px}

/* Factor list */
.factor{padding:3px 0;font-size:10px;display:flex;align-items:flex-start;gap:4px}
.factor-icon{flex-shrink:0}
.factor-good{color:var(--accent)}
.factor-bad{color:var(--red)}
.factor-neutral{color:var(--sub)}
.factor-change{background:rgba(255,71,87,.1);border-radius:3px;padding:2px 4px;margin:2px 0;border-left:2px solid var(--red)}

/* Recommendations */
.rec{padding:6px 8px;margin:3px 0;border-radius:5px;font-size:11px}
.rec-gold{background:rgba(255,215,0,.08);border:1px solid var(--gold)}
.rec-green{background:rgba(0,212,170,.08);border:1px solid var(--accent)}
.rec-blue{background:rgba(77,124,255,.08);border:1px solid var(--blue)}
.rec-red{background:rgba(255,71,87,.08);border:1px solid var(--red)}

/* Controls */
.nav-bar{display:flex;gap:4px;padding:4px 0;flex-wrap:wrap}
.nav-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:10px;font-weight:600}
.nav-btn:hover{border-color:var(--accent);color:var(--text)}
.nav-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}

.empty-state{text-align:center;padding:40px 10px;color:var(--sub);font-size:12px}

.badge-auto{display:inline-block;padding:1px 5px;border-radius:3px;background:rgba(0,212,170,.1);color:var(--accent);font-size:8px;font-weight:700}
</style>
</head>
<body>

<div class="header">
  <h1>🏆 <span>2026</span>世界杯 · AI情报站</h1>
  <div class="sub">
    守护最好的小徐佳俊
    <span class="badge">每2h自动更新</span>
    <span id="liveIndicator" class="badge" style="background:var(--red);color:#fff;display:none;">LIVE</span>
  </div>
</div>

<div class="container">

<div class="nav-bar" id="reportNav">
  <button class="nav-btn active" data-ver="latest">📌 最新</button>
  <button class="nav-btn" data-ver="all">📋 全部</button>
</div>

<div class="card" style="padding:6px 10px;margin-bottom:6px;background:rgba(0,212,170,.03);">
  <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;">
    <span style="color:var(--sub);">⏰ 下次更新: <span id="nextUpdate">-</span></span>
    <span style="color:var(--sub);">📡 数据: <span id="dataStatus">服务器采集</span></span>
  </div>
</div>

<div id="reportList">
  <div class="empty-state">🤖 等待第一版分析报告...</div>
</div>

</div>

<script>
// ===== REPORT STORE =====
// Reports are injected by the AI as JSON data
// Structure:
// { id, time, version, matches: [{home,away,score,confidence,note,changes:[],factors:[]}],
//   recommendations: [], news: [], status: 'new'|'update', prevId: null }

let reports = [];
let allLoaded = false;

function loadLatestReport() {
  fetch('reports.json')
    .then(r => r.json())
    .then(data => {
      reports = data.reports || [];
      allLoaded = true;
      renderReports('latest');
    })
    .catch(() => {}); // silently fail, reports injected via JS
}

function renderReports(view) {
  const el = document.getElementById('reportList');
  if (!reports.length) {
    el.innerHTML = `<div class="empty-state">🤖 暂无分析报告<br><span style="font-size:10px;">等待AI生成第一版...</span></div>`;
    return;
  }

  let html = '';
  const toShow = view === 'latest' ? [reports[reports.length - 1]] : [...reports].reverse();

  for (const r of toShow) {
    const isNew = r.status === 'new';
    const badge = isNew ? '<span class="report-badge bdg-new">NEW</span>' : '<span class="report-badge bdg-update">更新</span>';
    const isLatest = r === reports[reports.length - 1];

    html += `<div class="report">
      <div class="report-header ${isLatest?'active':''}" onclick="toggleReport(this)">
        <div>
          <span class="report-time">${r.time}</span>
          <span class="report-ver">v${r.version||'?'}</span>
          ${badge}
        </div>
        <span style="font-size:10px;color:var(--sub);">${isLatest?'📌 最新':''} ${r.matchCount||0}场</span>
      </div>
      <div class="report-body ${isLatest?'open':''}">`;

    // News/headlines
    if (r.news && r.news.length) {
      html += `<div class="sec-title">📰 最新动态</div>`;
      for (const n of r.news) html += `<div style="font-size:10px;padding:2px 0;${n.isChange?'color:var(--red);':''}">${n.icon||'•'} ${n.text}</div>`;
    }

    // Matches
    if (r.matches && r.matches.length) {
      html += `<div class="sec-title">🎯 比赛预测</div>`;
      for (const m of r.matches) {
        const confClass = m.confidence >= 80 ? 'conf-high' : m.confidence >= 60 ? 'conf-mid' : 'conf-low';
        html += `<div class="mb">
          <div class="mb-title">
            ${m.flagHome||''} ${m.home} vs ${m.flagAway||''} ${m.away}
            <span class="mb-score">${m.score}</span>
            <span class="mb-confidence ${confClass}">${m.confidence}%</span>
          </div>
          <div class="mb-note">${m.note}</div>`;

        // Changes (red highlighted)
        if (m.changes && m.changes.length) {
          for (const c of m.changes) {
            const icon = c.direction === 'up' ? '📈' : c.direction === 'down' ? '📉' : '➡️';
            const cls = c.direction === 'up' ? 'change-up' : c.direction === 'down' ? 'change-down' : 'change-neutral';
            html += `<div class="change ${cls}">${icon} <span class="change-label">${c.label}</span>${c.text}</div>`;
          }
        }

        // Factors
        if (m.factors && m.factors.length) {
          for (const f of m.factors) {
            const cls = f.type === 'good' ? 'factor-good' : f.type === 'bad' ? 'factor-bad' : 'factor-neutral';
            html += `<div class="factor ${f.isChange?'factor-change':''} ${cls}">
              <span class="factor-icon">${f.icon||'•'}</span>
              <span>${f.text}</span>
            </div>`;
          }
        }

        html += `</div>`;
      }
    }

    // Recommendations
    if (r.recommendations && r.recommendations.length) {
      html += `<div class="sec-title">💎 推荐</div>`;
      for (const rec of r.recommendations) {
        const cls = rec.type === 'best' ? 'rec-gold' : rec.type === 'value' ? 'rec-green' : rec.type === 'safe' ? 'rec-blue' : 'rec-red';
        const isChanged = rec.isChange;
        html += `<div class="rec ${cls}" style="${isChanged?'border-color:var(--red);border-width:2px;':''}">
          <div style="display:flex;justify-content:space-between;">
            <span style="font-weight:700;">${rec.title}</span>
            <span style="color:var(--gold);font-weight:700;">${rec.odds}</span>
          </div>
          <div style="font-size:10px;color:var(--sub);margin-top:2px;">${rec.reason}</div>
          ${isChanged?'<div style="font-size:9px;color:var(--red);margin-top:2px;">🔄 预测已调整</div>':''}
        </div>`;
      }
    }

    html += `</div></div>`;
  }

  el.innerHTML = html;
  document.getElementById('liveIndicator').style.display = reports.length ? 'inline' : 'none';
}

function toggleReport(header) {
  header.classList.toggle('active');
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

// ===== TABS =====
document.getElementById('reportNav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (!btn) return;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderReports(btn.dataset.ver);
});

// ===== INJECT REPORT (called by AI) =====
function injectReport(report) {
  reports.push(report);
  renderReports('latest');
  // Update next update time
  const now = new Date();
  const next = new Date(now);
  next.setHours(next.getHours() + 2, 0, 0, 0);
  document.getElementById('nextUpdate').textContent = next.toLocaleTimeString('zh-CN');
}

// ===== INIT =====
loadLatestReport();

// Retry with no-cache if empty after 3s
setTimeout(() => {
  if(reports.length===0){
    fetch('reports.json',{cache:'no-cache'})
      .then(r=>r.json()).then(d=>{if(d.reports&&d.reports.length){reports=d.reports;renderReports('latest');document.getElementById('dataStatus').textContent=reports.length+'份报告';}})
      .catch(()=>{document.getElementById('dataStatus').textContent='等待部署...';});
  }
},3000);

// Update next update time
function updateNextTime() {
  const now = new Date();
  const next = new Date(now);
  next.setHours(Math.floor(now.getHours()/2)*2 + 2, 0, 0, 0);
  document.getElementById('nextUpdate').textContent = next.toLocaleTimeString('zh-CN');
}
updateNextTime();
setInterval(updateNextTime, 60000);
</script>
</body>
</html>
