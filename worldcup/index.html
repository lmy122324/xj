<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>守护最好的小徐佳俊 🏆 2026世界杯AI预测</title>
<style>
:root{--bg:#0a0e27;--card:#131743;--accent:#00d4aa;--gold:#ffd700;--red:#ff4757;--text:#e0e6ff;--sub:#8892b0;--border:#1e2350;--blue:#4d7cff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:20px 12px 10px;background:linear-gradient(135deg,#0a0e27,#1a1f4e)}
.header h1{font-size:20px;font-weight:800}
.header h1 span{color:var(--gold)}
.header .sub{color:var(--sub);font-size:11px;margin-top:2px}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.tab{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.container{max-width:960px;margin:0 auto;padding:6px 8px 70px}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px}
.card-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.section-title{font-size:13px;font-weight:700;padding:8px 0 4px;color:var(--sub)}

/* Match rows */
.match{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid rgba(30,35,80,.3);gap:4px}
.match:last-child{border-bottom:none}
.match-info{width:50px;font-size:9px;color:var(--sub);flex-shrink:0;line-height:1.3}
.match-teams{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.flag{font-size:18px;flex-shrink:0}
.tname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-size:10px;color:var(--sub);padding:0 2px;flex-shrink:0}

/* Bet type tabs within match */
.bet-tabs{display:flex;gap:2px;margin:4px 0 2px;flex-wrap:wrap}
.bet-tab{padding:3px 10px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:10px;font-weight:600;transition:.15s}
.bet-tab.active{background:rgba(0,212,170,.15);color:var(--accent);border-color:var(--accent)}

/* Odds grid */
.odds-grid{display:flex;gap:3px;flex-wrap:wrap;margin:2px 0}
.odds-btn{padding:3px 7px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:10px;font-weight:600;text-align:center;min-width:38px;transition:.15s;line-height:1.2}
.odds-btn:hover{border-color:var(--accent);color:var(--text)}
.odds-btn.selected{background:var(--accent);color:#000;border-color:var(--accent)}
.odds-btn .val{font-size:11px;display:block}
.odds-btn .lab{font-size:8px;opacity:.6}

/* Handicap label */
.hcap{font-size:8px;color:var(--sub);margin:0 2px}

/* Calculator */
.calc-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(30,35,80,.2);font-size:11px}
.calc-item .del{padding:1px 6px;border-radius:3px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer;font-size:10px}
.calc-odds{color:var(--gold);font-weight:700;margin-left:auto}

.stake-box{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0}
.stake-input{background:#1e2350;border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:18px;font-weight:700;width:90px;text-align:center;outline:none}
.stake-input:focus{border-color:var(--accent)}

.total-odds{font-size:26px;font-weight:800;color:var(--gold);text-align:center}
.result-box{padding:8px;border-radius:6px;text-align:center;margin-top:4px}
.result-box.green{background:rgba(0,212,170,.1);border:1px solid var(--accent)}
.result-box .big{font-size:22px;font-weight:800}

/* Analysis */
.rec-card{padding:8px;margin:4px 0;border-radius:6px;font-size:12px}
.rec-best{background:rgba(255,215,0,.08);border:1px solid var(--gold)}
.rec-value{background:rgba(0,212,170,.08);border:1px solid var(--accent)}
.rec-skip{background:rgba(255,71,87,.08);border:1px solid var(--red)}
.rec-safe{background:rgba(77,124,255,.08);border:1px solid var(--blue)}

.ai-btn{width:100%;padding:10px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),#00f5d4);color:#000;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.ai-btn:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,212,170,.3)}
.ai-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.ai-btn .sub{font-size:10px;font-weight:400;opacity:.8}

.clear-btn{padding:4px 12px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:11px}
.clear-btn:hover{border-color:var(--red);color:var(--red)}

.stand-row{display:flex;align-items:center;padding:4px 0;font-size:11px;border-bottom:1px solid rgba(30,35,80,.15)}
.stand-pos{width:18px;font-weight:700;color:var(--sub)}
.stand-pts{width:28px;text-align:center;font-weight:700;color:var(--gold)}

@media(max-width:450px){
  .match-info{width:40px;font-size:8px}
  .flag{font-size:15px}
  .tname{font-size:11px}
  .odds-btn{min-width:32px;padding:2px 5px}
  .odds-btn .val{font-size:10px}
  .odds-btn .lab{font-size:7px}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏆 <span>2026</span>世界杯 · AI智能预测</h1>
  <div class="sub">守护最好的小徐佳俊 · 实时赔率 · 串关计算 · 比分预测</div>
</div>

<div class="tabs" id="tabBar">
  <div class="tab active" data-tab="schedule">📅 赛程</div>
  <div class="tab" data-tab="calculator">🧮 串关</div>
  <div class="tab" data-tab="analysis">📈 分析</div>
</div>

<div class="container">

<!-- TAB 1: SCHEDULE -->
<div id="tab-schedule" class="tab-content active">

  <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;">
    <span style="font-size:10px;color:var(--sub);">
      📡 <span id="oddsUpdateTime">加载中...</span>
    </span>
    <button onclick="fetchRealOdds()" id="refreshBtn" style="padding:4px 12px;border-radius:5px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:11px;font-weight:600;">
      🔄 刷新赔率
    </button>
  </div>

  <div class="card">
    <button class="ai-btn" onclick="requestAIAnalysis()" id="aiBtn">
      🤖 请求AI情报分析
      <div class="sub">联网采集·多维度·实时更新</div>
    </button>
    <div id="aiStatus" style="font-size:10px;color:var(--sub);margin-top:4px;text-align:center;min-height:14px;"></div>
  </div>

  <div class="section-title">✅ 已完赛</div>
  <div class="card" id="completedMatches"></div>

  <div class="section-title">🔥 即将开赛 <span style="font-size:10px;color:var(--sub);font-weight:400;">（点赔率加入串关）</span></div>
  <div id="upcomingMatches"></div>
</div>

<!-- TAB 2: CALCULATOR -->
<div id="tab-calculator" class="tab-content">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="card-title">🧮 我的串关</span>
      <button class="clear-btn" onclick="clearAll()">清空</button>
    </div>
    <div id="parlayList">
      <p style="color:var(--sub);font-size:11px;padding:12px;text-align:center;">去赛程页点赔率加入</p>
    </div>
  </div>
  <div class="card" id="calcCard" style="display:none;">
    <div class="total-odds" id="totalOddsDisplay">-</div>
    <div style="text-align:center;font-size:10px;color:var(--sub);">串关总赔率</div>
    <div class="stake-box">
      <span style="font-size:12px;">投入</span>
      <input type="number" id="stakeInput" class="stake-input" value="50" min="1" step="5" oninput="calcPayout()">
      <span style="font-size:11px;color:var(--sub);">¥/$</span>
    </div>
    <div class="result-box green">
      <div style="font-size:10px;color:var(--sub);">🏆 全中可赢</div>
      <div class="big" id="winAmount" style="color:var(--accent);">-</div>
      <div style="font-size:10px;color:var(--sub);margin-top:2px;">
        净赚 <span id="profitAmount" style="color:var(--gold);font-weight:700;">-</span>
      </div>
    </div>
    <div style="font-size:9px;color:var(--sub);text-align:center;margin-top:4px;">
      ⚠️ 串关 = 所有选项全中才赢 · 支持 胜平负/让球/大小球
    </div>
  </div>
</div>

<!-- TAB 3: ANALYSIS -->
<div id="tab-analysis" class="tab-content">
  <div id="analysisEmpty" style="text-align:center;padding:40px 10px;color:var(--sub);">
    <div style="font-size:36px;margin-bottom:8px;">🤖</div>
    <div style="font-size:13px;">还没有分析数据</div>
    <div style="font-size:10px;margin-top:4px;">去「赛程」点"请求AI情报分析"后在聊天喊我</div>
  </div>
  <div id="analysisContent" style="display:none;"></div>
</div>

</div>

<script>
// ===== CONSTANTS =====
const FLAGS={'墨西哥':'🇲🇽','南非':'🇿🇦','韩国':'🇰🇷','捷克':'🇨🇿','加拿大':'🇨🇦','波黑':'🇧🇦','卡塔尔':'🇶🇦','瑞士':'🇨🇭','巴西':'🇧🇷','摩洛哥':'🇲🇦','海地':'🇭🇹','苏格兰':'🏴','美国':'🇺🇸','巴拉圭':'🇵🇾','澳大利亚':'🇦🇺','土耳其':'🇹🇷','德国':'🇩🇪','库拉索':'🇨🇼','科特迪瓦':'🇨🇮','厄瓜多尔':'🇪🇨','荷兰':'🇳🇱','日本':'🇯🇵','瑞典':'🇸🇪','突尼斯':'🇹🇳'};
const GROUPS={'卡塔尔':'B','瑞士':'B','巴西':'C','摩洛哥':'C','海地':'C','苏格兰':'C','澳大利亚':'D','土耳其':'D','德国':'E','库拉索':'E','科特迪瓦':'E','厄瓜多尔':'E','荷兰':'F','日本':'F','瑞典':'F','突尼斯':'F'};

const TEAM_STR={'瑞士':90,'卡塔尔':35,'巴西':92,'摩洛哥':85,'海地':30,'苏格兰':70,'澳大利亚':55,'土耳其':72,'德国':95,'库拉索':10,'荷兰':88,'日本':78,'科特迪瓦':60,'厄瓜多尔':62,'瑞典':75,'突尼斯':58};

// ===== MATCHES =====
let matches = [
  {date:'6/14',time:'03:00',home:'卡塔尔',away:'瑞士',
    hOdds:16,dOdds:7,aOdds:1.23,
    hcap:'+1.5',hcapH:2.32,hcapA:1.67,
    ou:'2.5',ouO:1.67,ouU:2.23,
    status:'upcoming',scorePred:'0-2'},
  {date:'6/14',time:'06:00',home:'巴西',away:'摩洛哥',
    hOdds:1.73,dOdds:3.72,aOdds:5.6,
    hcap:'-0.8',hcapH:1.94,hcapA:1.96,
    ou:'2.3',ouO:1.97,ouU:1.92,
    status:'upcoming',scorePred:'1-0'},
  {date:'6/14',time:'09:00',home:'海地',away:'苏格兰',
    hOdds:6,dOdds:4.5,aOdds:1.57,
    hcap:'+1.0',hcapH:1.95,hcapA:1.95,
    ou:'2.8',ouO:1.95,ouU:1.93,
    status:'upcoming',scorePred:'0-2'},
  {date:'6/14',time:'12:00',home:'澳大利亚',away:'土耳其',
    hOdds:5.5,dOdds:3.85,aOdds:1.73,
    hcap:'+0.5',hcapH:2.20,hcapA:1.74,
    ou:'2.5',ouO:2.08,ouU:1.85,
    status:'upcoming',scorePred:'0-1'},
  {date:'6/15',time:'01:00',home:'德国',away:'库拉索',
    hOdds:1.04,dOdds:17.5,aOdds:51,
    hcap:'-3.5',hcapH:1.98,hcapA:1.87,
    ou:'4.3',ouO:1.87,ouU:1.97,
    status:'upcoming',scorePred:'5-0'},
  {date:'6/15',time:'04:00',home:'荷兰',away:'日本',
    hOdds:1.95,dOdds:3.64,aOdds:3.92,
    hcap:'-0.5',hcapH:2.02,hcapA:1.88,
    ou:'2.5',ouO:1.97,ouU:1.92,
    status:'upcoming',scorePred:'2-1'},
  {date:'6/15',time:'07:00',home:'科特迪瓦',away:'厄瓜多尔',
    hOdds:3.73,dOdds:2.83,aOdds:2.43,
    hcap:'+0.3',hcapH:1.88,hcapA:2.02,
    ou:'1.8',ouO:1.82,ouU:2.08,
    status:'upcoming',scorePred:'1-1'},
  {date:'6/15',time:'10:00',home:'瑞典',away:'突尼斯',
    hOdds:1.88,dOdds:3.54,aOdds:4.4,
    hcap:'-0.5',hcapH:1.90,hcapA:2.00,
    ou:'2.5',ouO:2.25,ouU:1.62,
    status:'upcoming',scorePred:'2-0'}
];

let completed = [
  {date:'6/12',time:'03:00',home:'墨西哥',away:'南非',score:'2-0'},
  {date:'6/12',time:'10:00',home:'韩国',away:'捷克',score:'2-1'},
  {date:'6/13',time:'03:00',home:'加拿大',away:'波黑',score:'1-1'},
  {date:'6/13',time:'09:00',home:'美国',away:'巴拉圭',score:'4-1'}
];

// ===== STATE =====
let selections = []; // {id, matchKey, home, away, type, subType, odds, label}
let activeBetTypes = {}; // matchKey -> '1x2'|'hcap'|'ou'

function matchKey(h,a){return h+'_'+a}

// ===== RENDER =====
function renderSchedule(){
  // Completed
  let c='';
  for(const m of completed){
    c+=`<div class="match" style="opacity:.5"><div class="match-info">${m.date}<br>${m.time}</div>
      <div class="match-teams"><span class="flag">${FLAGS[m.home]||''}</span>
      <span class="tname">${m.home}</span><span class="vs">${m.score}</span>
      <span class="tname">${m.away}</span><span class="flag">${FLAGS[m.away]||''}</span></div></div>`;
  }
  document.getElementById('completedMatches').innerHTML=c;

  // Upcoming
  let u='';
  for(const m of matches){
    if(m.status!=='upcoming') continue;
    const mk = matchKey(m.home,m.away);
    const bt = activeBetTypes[mk]||'1x2';
    u += `<div class="card"><div class="match">
      <div class="match-info">${m.date}<br>${m.time}</div>
      <div class="match-teams">
        <span class="flag">${FLAGS[m.home]||''}</span>
        <span class="tname">${m.home}</span>
        <span class="vs">${GROUPS[m.home]}组</span>
        <span class="tname">${m.away}</span>
        <span class="flag">${FLAGS[m.away]||''}</span>
      </div>
      <span class="hcap">${m.scorePred}</span>
    </div>
    <div class="bet-tabs">
      <span class="bet-tab ${bt==='1x2'?'active':''}" onclick="setBetType('${mk}','1x2')">胜平负</span>
      <span class="bet-tab ${bt==='hcap'?'active':''}" onclick="setBetType('${mk}','hcap')">让球<span class="hcap">(${m.hcap})</span></span>
      <span class="bet-tab ${bt==='ou'?'active':''}" onclick="setBetType('${mk}','ou')">大小球<span class="hcap">(${m.ou})</span></span>
    </div>`;

    if(bt==='1x2'){
      u+=`<div class="odds-grid">
        ${oddsBtn(mk,'1x2','home',m.home,'主',m.hOdds)}
        ${oddsBtn(mk,'1x2','draw','平局','平',m.dOdds)}
        ${oddsBtn(mk,'1x2','away',m.away,'客',m.aOdds)}
      </div>`;
    }else if(bt==='hcap'){
      u+=`<div class="odds-grid">
        ${oddsBtn(mk,'hcap','home',m.home+'('+m.hcap+')','主 '+m.hcap,m.hcapH)}
        ${oddsBtn(mk,'hcap','away',m.away+'(-'+m.hcap+')','客 -'+m.hcap,m.hcapA)}
      </div>`;
    }else{
      u+=`<div class="odds-grid">
        ${oddsBtn(mk,'ou','over','大'+m.ou,'大 '+m.ou,m.ouO)}
        ${oddsBtn(mk,'ou','under','小'+m.ou,'小 '+m.ou,m.ouU)}
      </div>`;
    }
    u += `<div style="font-size:9px;color:var(--sub);margin-top:2px;">预测: ${m.scorePred}</div></div>`;
  }
  document.getElementById('upcomingMatches').innerHTML=u;
}

function oddsBtn(mk,subType,type,label,shortLabel,odds){
  const sel = selections.some(s=>s.matchKey===mk && s.subType===subType && s.type===type);
  return `<div class="odds-btn ${sel?'selected':''}" onclick="toggleSelection('${mk}','${type}','${subType}','${label.replace(/'/g,'')}','${shortLabel}',${odds})">
    <span class="val">${odds.toFixed(2)}</span><span class="lab">${shortLabel}</span></div>`;
}

function setBetType(mk, t){
  activeBetTypes[mk]=t;
  // Remove existing selections for this match when switching type
  selections = selections.filter(s=>s.matchKey!==mk);
  renderSchedule();
  renderParlay();
}

// ===== SELECTIONS =====
function toggleSelection(mk,type,subType,label,sLabel,odds){
  const existing = selections.findIndex(s=>s.matchKey===mk && s.subType===subType && s.type===type);
  if(existing>=0){ selections.splice(existing,1); }
  else {
    selections = selections.filter(s=>s.matchKey!==mk); // one per match
    const parts = mk.split('_');
    selections.push({id:mk+'_'+subType+'_'+type, matchKey:mk, home:parts[0], away:parts[1], type, subType, odds, label:sLabel, fullLabel:label});
  }
  renderSchedule();
  renderParlay();
}

function renderParlay(){
  const el=document.getElementById('parlayList');
  const calc=document.getElementById('calcCard');
  if(selections.length===0){
    el.innerHTML=`<p style="color:var(--sub);font-size:11px;padding:12px;text-align:center;">去赛程页点赔率加入</p>`;
    calc.style.display='none'; return;
  }
  let html='';
  for(const s of selections){
    const f=FLAGS[s.home]||'', f2=FLAGS[s.away]||'';
    let detail=s.label;
    if(s.subType==='1x2'&&s.type==='home') detail=s.home+'胜';
    else if(s.subType==='1x2'&&s.type==='away') detail=s.away+'胜';
    else if(s.subType==='1x2') detail='平局';
    html+=`<div class="calc-item">
      <span>${f}${s.home} vs ${f2}${s.away}</span>
      <span style="color:var(--accent);font-weight:600;">${detail}</span>
      <span class="calc-odds">@${s.odds.toFixed(2)}</span>
      <span class="del" onclick="removeSel('${s.id}')">✕</span>
    </div>`;
  }
  el.innerHTML=html;
  calc.style.display='block';
  calcPayout();
}

function removeSel(id){
  selections=selections.filter(s=>s.id!==id);
  renderSchedule(); renderParlay();
}
function clearAll(){selections=[]; renderSchedule(); renderParlay();}

function calcPayout(){
  const stake=parseFloat(document.getElementById('stakeInput').value)||0;
  let total=1;
  for(const s of selections) total*=s.odds;
  total=Math.round(total*100)/100;
  document.getElementById('totalOddsDisplay').textContent=total.toFixed(2);
  const win=Math.round(stake*total*100)/100;
  const profit=Math.round((win-stake)*100)/100;
  document.getElementById('winAmount').textContent=win.toFixed(2);
  document.getElementById('profitAmount').textContent=profit.toFixed(2);
}

// ===== REAL ODDS FETCH =====
async function fetchRealOdds(){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true; btn.textContent='⏳...';
  document.getElementById('aiStatus').textContent='📡 抓取实时赔率...';

  try {
    const resp=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://wc-2026.com/schedule/'),
      {headers:{'User-Agent':'Mozilla/5.0','Accept':'text/html'}});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const html=await resp.text();
    document.getElementById('aiStatus').textContent='✅ 解析数据...';

    const lines=html.split('\n');
    let mi=0;
    for(let i=0;i<lines.length&&mi<matches.length;i++){
      const l=lines[i].trim();
      if(l.includes('主胜')&&(l.includes(' 1')||l.includes(' 2'))){
        let h=null,d=null,a=null;
        for(let j=i;j<Math.min(i+25,lines.length);j++){
          const t=lines[j].trim();
          const nm=t.match(/^([\d.]+)/);
          if(nm){ const v=parseFloat(nm[1]);
            if(v>0){ if(h===null)h=v; else if(d===null&&v!==h)d=v; else if(a===null&&v!==h&&v!==d){a=v;break;} }
          }
        }
        // Also look for handicap and o/u
        let hcapStr='', hcapH=null, hcapA=null, ouStr='', ouO=null, ouU=null;
        for(let j=i;j<Math.min(i+15,lines.length);j++){
          const t=lines[j];
          // 让球 +1.5 @ 2.32 / -1.5 @ 1.67
          const hcapMatch=t.match(/让球\s+([+-][\d.]+)\s*@\s*([\d.]+)\s*\/\s*([+-][\d.]+)\s*@\s*([\d.]+)/);
          if(hcapMatch){ hcapStr=hcapMatch[1]; hcapH=parseFloat(hcapMatch[2]); hcapA=parseFloat(hcapMatch[4]); }
          const ouMatch=t.match(/大小球\s+O\s+([\d.]+)\s*@\s*([\d.]+)\s*\/\s*U\s+([\d.]+)\s*@\s*([\d.]+)/);
          if(ouMatch){ ouStr=ouMatch[1]; ouO=parseFloat(ouMatch[2]); ouU=parseFloat(ouMatch[4]); }
        }
        if(h&&a&&matches[mi]){
          matches[mi].hOdds=h; matches[mi].dOdds=d||3.0; matches[mi].aOdds=a;
          if(hcapStr){matches[mi].hcap=hcapStr;matches[mi].hcapH=hcapH||1.9;matches[mi].hcapA=hcapA||1.9;}
          if(ouStr){matches[mi].ou=ouStr;matches[mi].ouO=ouO||1.9;matches[mi].ouU=ouU||1.9;}
          mi++;
        }
      }
    }
    document.getElementById('oddsUpdateTime').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN')+' ('+mi+'场)';
    document.getElementById('aiStatus').textContent='✅ 赔率已更新';
    renderSchedule();
  } catch(e){
    document.getElementById('aiStatus').textContent='⚠️ 抓取失败: '+e.message;
  }
  btn.disabled=false; btn.textContent='🔄 刷新';
}

// ===== ANALYSIS UPDATE (called by AI externally) =====
function updateAnalysis(data){
  const el=document.getElementById('analysisContent');
  const empty=document.getElementById('analysisEmpty');
  el.style.display='block'; empty.style.display='none';
  document.getElementById('aiBtn').disabled=false;
  document.getElementById('aiBtn').innerHTML='🤖 请求AI情报分析<div class="sub">联网采集·多维度·实时更新</div>';
  document.getElementById('aiStatus').textContent='✅ 分析完成 '+new Date().toLocaleTimeString('zh-CN');

  let html=`<div class="card" style="border-color:var(--gold);">
    <div class="card-title" style="color:var(--gold);">📋 AI情报报告</div>
    <div style="font-size:10px;color:var(--sub);">${new Date().toLocaleString('zh-CN')}</div></div>`;

  if(data.matches){
    for(const m of data.matches){
      const cc=m.confidence>=80?'var(--accent)':m.confidence>=60?'var(--gold)':'var(--red)';
      html+=`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:700;">${FLAGS[m.home]}${m.home} vs ${FLAGS[m.away]}${m.away}</span>
          <span style="font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(0,212,170,.1);color:${cc};">${m.confidence}%</span>
        </div>
        <div style="margin-top:2px;font-size:11px;">
          <span style="color:var(--gold);font-weight:700;">${m.score}</span>
          <span style="color:var(--accent);margin-left:6px;">${m.rec||''}</span>
        </div>
        <div style="font-size:10px;color:var(--sub);margin-top:2px;">${m.note}</div>`;
      if(m.details) html+=`<div style="font-size:9px;color:var(--sub);margin-top:4px;border-top:1px solid var(--border);padding-top:3px;">${m.details.map(d=>'• '+d).join('<br>')}</div>`;
      html+=`</div>`;
    }
  }

  if(data.recommendations){
    html+=`<div class="card" style="border-color:var(--gold);"><div class="card-title" style="color:var(--gold);">💎 推荐</div>`;
    for(const r of data.recommendations){
      const cls=r.type==='best'?'rec-best':r.type==='value'?'rec-value':r.type==='safe'?'rec-safe':'rec-skip';
      html+=`<div class="rec-card ${cls}">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-weight:700;font-size:12px;">${r.title}</span>
          <span style="color:var(--gold);font-weight:700;">${r.odds}</span>
        </div>
        <div style="font-size:10px;color:var(--sub);">${r.reason}</div>
      </div>`;
    }
    html+=`</div>`;
  }

  // Your bets
  html+=`<div class="card" style="border-color:var(--blue);">
    <div class="card-title" style="color:var(--blue);">📋 你的仓位</div>
    <table style="width:100%;font-size:10px;border-collapse:collapse;">
      <tr><th style="text-align:left;padding:3px 4px;border-bottom:1px solid var(--border);">下注</th>
      <th style="text-align:center;padding:3px 4px;border-bottom:1px solid var(--border);">评估</th>
      <th style="text-align:center;padding:3px 4px;border-bottom:1px solid var(--border);">建议</th></tr>
      <tr><td style="padding:3px 4px;">🇨🇭 瑞士赢</td><td style="text-align:center;color:var(--accent);">✅</td><td style="text-align:center;">持有</td></tr>
      <tr><td style="padding:3px 4px;">串 🇺🇸美国+🇨🇭瑞士</td><td style="text-align:center;color:var(--accent);">✅美国已赢</td><td style="text-align:center;">等瑞士</td></tr>
      <tr><td style="padding:3px 4px;">🇶🇦🇨🇭小2.5</td><td style="text-align:center;color:var(--gold);">⭐最佳价值</td><td style="text-align:center;">持有</td></tr>
      <tr><td style="padding:3px 4px;">🇨🇦加拿大赢</td><td style="text-align:center;color:var(--red);">❌</td><td style="text-align:center;">已结算</td></tr>
    </table>
  </div>`;

  el.innerHTML=html;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('[data-tab="analysis"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-analysis').classList.add('active');
}

// ===== TABS =====
document.getElementById('tabBar').addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(!tab) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
});

renderSchedule();
</script>
