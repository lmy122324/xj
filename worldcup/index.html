<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守护最好的小徐佳俊 🏆 世界杯情报站</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

:root{
  --bg:#0c0a1a;
  --card:#141128;
  --card-border:#2a2040;
  --accent:#00d4aa;
  --gold:#ffd700;
  --gold-light:#ffed80;
  --gold-dark:#b8960f;
  --red:#ff4757;
  --text:#e8e0f0;
  --sub:#7a7090;
}
.light{
  --bg:#f5f0e8;
  --card:#fffaf0;
  --card-border:#d4c8a8;
  --accent:#00a88a;
  --gold:#b8860b;
  --gold-light:#daa520;
  --gold-dark:#8b6914;
  --red:#d63031;
  --text:#2d2010;
  --sub:#8a7a5a;
}

body{
  font-family:'Noto Serif SC','PingFang SC','Microsoft YaHei',serif;
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(255,215,0,.03) 0%,transparent 50%),
                   radial-gradient(ellipse at 80% 20%,rgba(0,212,170,.02) 0%,transparent 50%),
                   repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,215,0,.008) 40px,rgba(255,215,0,.008) 41px);
  color:var(--text);
  min-height:100vh;
  line-height:1.6;
  transition:background .3s,color .3s;
}
.light body,body.light{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(139,105,20,.03) 0%,transparent 50%),
                   repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(139,105,20,.005) 40px,rgba(139,105,20,.005) 41px);
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  padding:24px 12px 16px;
  background:linear-gradient(180deg,#1a1040 0%,#0c0a1a 100%);
  border-bottom:1px solid var(--card-border);
  position:relative;
  overflow:hidden;
}
.light .header{background:linear-gradient(180deg,#f0e8d8 0%,#f5f0e8 100%);}
.header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--accent),var(--gold),transparent);
}
.light .header::before{opacity:.5;}
.header::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,215,0,.06) 0%,transparent 60%);
  pointer-events:none;
}
.header h1{
  font-size:22px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold-dark));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:none;
  letter-spacing:2px;
  position:relative;
  z-index:1;
}
.header .sub{
  font-size:10px;color:var(--sub);margin-top:4px;font-weight:400;
  letter-spacing:1px;position:relative;z-index:1;
}
.header .sub span{color:var(--gold);}
.badge-a{
  display:inline-block;padding:2px 8px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold-dark),var(--gold));
  color:#000;font-size:8px;font-weight:700;letter-spacing:.5px;
  margin-left:4px;
}

/* ===== CONTAINER ===== */
.container{max-width:720px;margin:0 auto;padding:6px 8px 60px;position:relative;}

/* ===== STATUS BAR ===== */
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;
  background:linear-gradient(135deg,rgba(255,215,0,.04),rgba(0,212,170,.02));
  border:1px solid rgba(255,215,0,.1);
  border-radius:10px;margin-bottom:8px;
  font-size:9px;color:var(--sub);letter-spacing:.3px;
}

/* ===== NAV ===== */
.nav{display:flex;gap:6px;padding:4px 0;flex-wrap:wrap;margin-bottom:2px;}
.nav-btn{
  padding:5px 14px;border-radius:20px;
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.02);
  color:var(--sub);cursor:pointer;font-size:10px;font-weight:600;
  transition:.2s;letter-spacing:.5px;
}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.08);}
.nav-btn.active{
  background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,215,0,.05));
  border-color:var(--gold);color:var(--gold);
  box-shadow:0 0 15px rgba(255,215,0,.1);
}

/* ===== DAY HEADER ===== */
.day-head{
  font-size:15px;font-weight:700;padding:10px 0 6px;
  color:var(--gold);
  letter-spacing:1px;
}
.day-sub{font-size:10px;color:var(--sub);font-weight:400;margin-left:6px;letter-spacing:0;}

/* ===== MATCH CARD ===== */
.mc{
  border:1px solid var(--card-border);
  border-radius:12px;margin-bottom:8px;
  background:linear-gradient(135deg,var(--card),rgba(255,215,0,.02));
  transition:.2s;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.2);
}
.mc:hover{border-color:rgba(255,215,0,.2);}
.mc-head{
  padding:10px 12px;display:flex;align-items:center;gap:8px;
  cursor:pointer;user-select:none;transition:.15s;
}
.mc-head:hover{background:rgba(255,215,0,.03);}
.mc-head.expanded{
  background:linear-gradient(180deg,rgba(255,215,0,.04),transparent);
  border-bottom:1px solid rgba(255,215,0,.1);
}
.mc-arrow{
  font-size:8px;color:var(--gold);transition:transform .3s ease;
  flex-shrink:0;opacity:.6;
}
.mc-arrow.open{transform:rotate(90deg);opacity:1;}
.mc-teams{flex:1;font-size:14px;font-weight:700;letter-spacing:.3px;}
.mc-teams .flag{font-size:20px;margin-right:3px;display:inline-block;filter:drop-shadow(0 0 2px rgba(255,215,0,.2));}
.mc-vs{color:var(--sub);font-size:10px;margin:0 4px;font-weight:400;}
.mc-time{font-size:9px;color:var(--sub);white-space:nowrap;letter-spacing:.3px;}
.mc-cb{
  padding:2px 8px;border-radius:12px;font-size:9px;font-weight:700;
  letter-spacing:.3px;
}
.mcb-h{background:linear-gradient(135deg,rgba(0,212,170,.15),rgba(0,212,170,.05));color:var(--accent);border:1px solid rgba(0,212,170,.2);}
.mcb-m{background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,215,0,.05));color:var(--gold);border:1px solid rgba(255,215,0,.2);}
.mcb-l{background:linear-gradient(135deg,rgba(255,71,87,.15),rgba(255,71,87,.05));color:var(--red);border:1px solid rgba(255,71,87,.2);}
.new-tag{
  display:inline-block;padding:2px 6px;border-radius:8px;
  background:linear-gradient(135deg,var(--red),#ff6b81);
  color:#fff;font-size:8px;font-weight:700;letter-spacing:.5px;
  animation:blink 1.5s infinite;box-shadow:0 0 6px rgba(255,71,87,.3);
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}

/* ===== MATCH BODY ===== */
.mc-body{padding:8px 12px;display:none;}
.mc-body.open{display:block;}
.ae{
  border-left:2px solid var(--gold);
  padding:5px 0 5px 10px;margin:6px 0;
  background:rgba(255,215,0,.015);
  border-radius:0 4px 4px 0;
}
.ae+.ae{margin-top:8px;border-left-color:var(--sub);}
.ae-meta{font-size:9px;color:var(--sub);margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.ae-text{font-size:12px;line-height:1.7;color:var(--text);}
.ae-source{font-size:9px;color:var(--sub);margin-top:3px;opacity:.7;}
.ct{
  padding:1px 6px;border-radius:8px;font-size:8px;font-weight:700;
  letter-spacing:.3px;
}
.ct-h{background:rgba(0,212,170,.12);color:var(--accent);}
.ct-m{background:rgba(255,215,0,.12);color:var(--gold);}
.ct-l{background:rgba(255,71,87,.12);color:var(--red);}
.fc{
  display:inline-block;padding:1px 6px;border-radius:8px;
  font-size:8px;margin:1px;font-weight:600;letter-spacing:.2px;
}
.fc-up{background:rgba(0,212,170,.08);color:var(--accent);border:1px solid rgba(0,212,170,.15);}
.fc-down{background:rgba(255,71,87,.08);color:var(--red);border:1px solid rgba(255,71,87,.15);}

/* ===== CHANGES ===== */
.chg{
  background:rgba(255,71,87,.05);border-radius:6px;padding:4px 8px;
  margin:4px 0;font-size:10px;border-left:2px solid var(--red);
}
.chg-label{font-weight:700;color:var(--red);}

/* ===== RECOMMENDATION ===== */
.rec-box{
  padding:6px 10px;margin:6px 0;border-radius:8px;font-size:11px;
  background:linear-gradient(135deg,rgba(255,215,0,.06),rgba(255,215,0,.02));
  border:1px solid rgba(255,215,0,.2);
  box-shadow:inset 0 0 20px rgba(255,215,0,.03);
}

/* ===== FULL REPORT BTN ===== */
.fr-btn{
  display:inline-block;padding:3px 10px;border-radius:12px;
  border:1px solid rgba(255,215,0,.2);
  background:linear-gradient(135deg,rgba(255,215,0,.06),rgba(0,212,170,.03));
  color:var(--gold);cursor:pointer;font-size:9px;font-weight:600;
  transition:.2s;letter-spacing:.3px;
}
.fr-btn:hover{
  background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(0,212,170,.06));
  border-color:var(--gold);box-shadow:0 0 12px rgba(255,215,0,.15);
}

/* ===== MODAL ===== */
.modal{
  display:none;position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,.7);
  z-index:100;overflow-y:auto;padding:20px 10px;
  backdrop-filter:blur(4px);
}
.light .modal{background:rgba(0,0,0,.4);}
.modal.open{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  max-width:680px;margin:0 auto;
  background:var(--card);
  border:1px solid var(--gold);
  border-radius:16px;padding:20px;position:relative;
  box-shadow:0 0 40px rgba(255,215,0,.08),0 20px 60px rgba(0,0,0,.5);
}
.modal-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--accent),var(--gold),transparent);
  border-radius:16px 16px 0 0;
}
.modal-close{
  position:absolute;top:12px;right:14px;
  background:rgba(255,255,255,.05);border:none;
  color:var(--sub);font-size:16px;cursor:pointer;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;
}
.modal-close:hover{background:rgba(255,71,87,.15);color:var(--red);}
.modal-title{
  font-size:16px;font-weight:700;margin-bottom:10px;padding-right:30px;
  color:var(--gold);letter-spacing:.5px;
}
.modal-body{font-size:12px;line-height:1.8;color:var(--text);}
.modal-body .s{color:var(--sub);font-size:11px;}
.modal-body .hl{color:var(--accent);font-weight:700;}
.modal-body .rl{color:var(--red);font-weight:700;}
.modal-body .gl{color:var(--gold);font-weight:700;}
.modal-body hr{border:none;border-top:1px solid var(--card-border);margin:10px 0;}
.modal-body b{color:var(--gold);}

/* ===== EMPTY ===== */
.empty{padding:60px 10px;text-align:center;color:var(--sub);font-size:13px;}

/* ===== RESPONSIVE ===== */
@media(max-width:450px){
  .header h1{font-size:18px;}
  .mc-teams{font-size:12px;}
  .mc-teams .flag{font-size:16px;}
  .mc-time{font-size:8px;}
  .ae-text{font-size:11px;}
  .modal-box{padding:14px;}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏆 2026 世界杯 · AI 情报站</h1>
  <div class="sub">守护最好的小徐佳俊 <span>✦</span> 每2h自动分析 <span>✦</span> 每晚12点刷新赛程</div>
  <button id="themeBtn" onclick="toggleTheme()" style="position:absolute;top:12px;right:12px;background:rgba(255,255,255,.05);border:1px solid var(--card-border);border-radius:20px;padding:4px 12px;color:var(--sub);cursor:pointer;font-size:10px;font-weight:600;transition:.2s;z-index:2;">🌙 夜间</button>
</div>

<div class="container">
<div class="status-bar">
  <span>📡 <span id="dataStatus">加载中...</span></span>
  <span>⏰ 更新: <span id="nextUpdate">-</span></span>
  <span><span class="badge-a">每2h</span></span>
</div>
<div class="nav" id="navBar">
  <button class="nav-btn active" data-view="all">📋 全部赛程</button>
  <button class="nav-btn" data-view="today">🔥 今日</button>
  <button class="nav-btn" data-view="changes">🔄 变化追踪</button>
</div>
<div id="content"><div class="empty">🤖 加载分析数据...</div></div>
</div>

<!-- Modal -->
<div class="modal" id="modal" onclick="if(event.target===this)closeFR()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeFR()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const FLAGS={'墨西哥':'🇲🇽','南非':'🇿🇦','韩国':'🇰🇷','捷克':'🇨🇿','加拿大':'🇨🇦','波黑':'🇧🇦','卡塔尔':'🇶🇦','瑞士':'🇨🇭','巴西':'🇧🇷','摩洛哥':'🇲🇦','海地':'🇭🇹','苏格兰':'🏴','美国':'🇺🇸','巴拉圭':'🇵🇾','澳大利亚':'🇦🇺','土耳其':'🇹🇷','德国':'🇩🇪','库拉索':'🇨🇼','科特迪瓦':'🇨🇮','厄瓜多尔':'🇪🇨','荷兰':'🇳🇱','日本':'🇯🇵','瑞典':'🇸🇪','突尼斯':'🇹🇳'};
let allMatches=[],currentView='all',matchIdx=0;

function loadData(){
  console.log('🏆 世界杯情报站 v1.2 加载中...');
  const u=window.location.origin+(window.location.pathname.replace(/\/[^/]*$/,'')||'/xj/worldcup')+'/data.json?v='+Date.now();
  fetch(u).then(r=>{if(!r.ok)throw Error();return r.json();}).then(d=>{allMatches=d.matches||[];document.getElementById('dataStatus').textContent=(d.analysisCount||0)+'份分析 · '+(d.matchCount||0)+'场';render();}).catch(()=>{fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{allMatches=d.matches||[];render();}).catch(()=>{document.getElementById('dataStatus').textContent='等待首版...';render();});});
}

function render(){
  matchIdx=0;const el=document.getElementById('content'),view=currentView;
  if(!allMatches.length){el.innerHTML='<div class="empty">🤖 暂无赛程数据<br><span style="font-size:10px;color:var(--sub);">每晚12点自动刷新后三天赛程</span></div>';return;}
  let html='';const days={};
  for(const m of allMatches){if(!days[m.date])days[m.date]=[];days[m.date].push(m);}
  if(view==='changes'){
    html='<div class="day-head">🔄 变化追踪</div>';let has=false;
    for(const m of allMatches){if(m.changes&&m.changes.length){has=true;html+=renderMatch(m);}}
    if(!has)html+='<div class="empty">暂无变化</div>';
  }else{
    for(const[date,dayMatches]of Object.entries(days)){const isToday=date===getTodayStr();html+=`<div class="day-head">${isToday?'🔥 ':''}${date} <span class="day-sub">${dayMatches.length}场</span></div>`;for(const m of dayMatches)html+=renderMatch(m);}
  }
  el.innerHTML=html;
}

function renderMatch(m){
  const al=m.analyses||[],l=al.length?al[al.length-1]:null,c=l?l.confidence:0,cc=c>=80?'mcb-h':c>=60?'mcb-m':c>=1?'mcb-l':'';
  const mi=matchIdx++,id='m'+mi,hasNew=al.some(a=>a.isNew),hasChg=m.changes&&m.changes.length;
  let html=`<div class="mc" id="mc_${id}"><div class="mc-head" onclick="toggleMatch('${id}')"><span class="mc-arrow" id="arr_${id}">▶</span><span class="mc-teams"><span class="flag">${FLAGS[m.home]||''}</span>${m.home} <span class="mc-vs">vs</span> <span class="flag">${FLAGS[m.away]||''}</span>${m.away}</span><span class="mc-time">${m.date} ${m.time} · ${m.group}组</span>${c?`<span class="mc-cb ${cc}">${c}%</span>`:''}${hasNew?'<span class="new-tag">NEW</span>':''}</div><div class="mc-body" id="body_${id}">`;
  if(hasChg){for(const c of m.changes)html+=`<div class="chg"><span class="chg-label">${c.icon||'🔄'} ${c.label}</span> ${c.text}</div>`;}
  if(al.length){
    for(let ai=0;ai<al.length;ai++){const a=al[ai],cl=a.confidence>=80?'ct-h':a.confidence>=60?'ct-m':'ct-l';
      html+=`<div class="ae"><div class="ae-meta">${a.isNew?'<span class="new-tag">NEW</span>':''}<span>🕐 ${a.time}</span><span class="ct ${cl}">${a.confidence}%</span>`;
      if(a.factors){for(const f of a.factors){const c2=f.type==='good'?'fc-up':f.type==='bad'?'fc-down':'';html+=`<span class="fc ${c2}">${f.icon||''} ${f.text}</span>`;}}
      // Goal info
      if(a.goalCount)html+=`<div style="font-size:10px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;"><span>⚽ 预计进球: <strong style="color:var(--gold);">${a.goalCount}球</strong></span><span>🎯 可能比分: ${a.possibleScores?`<span style="color:var(--sub);">${a.possibleScores.join(' / ')}</span>`:'-'}</span></div>`;
      html+=`</div><div class="ae-text">${a.text}</div>`;
      if(a.sources)html+=`<div class="ae-source">📰 来源: ${a.sources.join(' · ')}</div>`;
      if(a.fullReport)html+=`<div style="text-align:right;margin-top:4px;"><span class="fr-btn" data-m="${mi}" data-a="${ai}">📄 完整报告</span></div>`;
      html+=`</div>`;
    }
  }else{html+=`<div style="font-size:10px;color:var(--sub);padding:6px 0;">⏳ 等待分析...</div>`;}
  if(m.recommendations){for(const r of m.recommendations)html+=`<div class="rec-box">💎 ${r.title} ${r.odds||''} — ${r.reason}</div>`;}
  html+=`</div></div>`;
  return html;
}

function toggleMatch(id){
  const b=document.getElementById('body_'+id);if(!b)return;
  const h=b.previousElementSibling,a=document.getElementById('arr_'+id);
  b.classList.toggle('open');h.classList.toggle('expanded');a.classList.toggle('open');
}

document.getElementById('content').addEventListener('click',function(e){
  const btn=e.target.closest('.fr-btn');
  if(!btn)return;
  const mi=parseInt(btn.dataset.m),ai=parseInt(btn.dataset.a);
  const m=allMatches[mi];if(!m)return;
  const a=m.analyses[ai];if(a&&a.fullReport)showFR(m.home,m.away,a.time,a.fullReport);
});

function showFR(home,away,time,report){
  document.getElementById('modalTitle').textContent=FLAGS[home]||''+home+' vs '+FLAGS[away]||''+away+' · '+time;
  document.getElementById('modalBody').innerHTML=report;
  document.getElementById('modal').classList.add('open');
}
function closeFR(){document.getElementById('modal').classList.remove('open');}

function toggleTheme(){
  const b=document.body.classList.toggle('light');
  const btn=document.getElementById('themeBtn');
  btn.textContent=b?'🌞 白天':'🌙 夜间';
  localStorage.setItem('wcTheme',b?'light':'dark');
}
// Load saved theme
if(localStorage.getItem('wcTheme')==='light'){
  document.body.classList.add('light');
  document.getElementById('themeBtn').textContent='🌞 白天';
}

function getTodayStr(){const d=new Date();return(d.getMonth()+1)+'/'+d.getDate();}
document.getElementById('navBar').addEventListener('click',e=>{const btn=e.target.closest('.nav-btn');if(!btn)return;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;render();});
function updateNextTime(){const n=new Date(),h=n.getHours(),nx=new Date(n);nx.setHours(Math.floor(h/2)*2+2,0,0,0);document.getElementById('nextUpdate').textContent=nx.toLocaleTimeString('zh-CN');}
updateNextTime();setInterval(updateNextTime,60000);
loadData();
</script>
</body>
</html>
