<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守护最好的小徐佳俊 🏆 世界杯情报站</title>
<style>
:root{--bg:#0a0e27;--card:#131743;--accent:#00d4aa;--gold:#ffd700;--red:#ff4757;--text:#e0e6ff;--sub:#8892b0;--border:#1e2350}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.header{padding:14px 12px;background:linear-gradient(135deg,#0a0e27,#1a1f4e);border-bottom:1px solid var(--border)}
.header h1{font-size:16px;font-weight:800}
.header h1 span{color:var(--gold)}
.header .sub{font-size:10px;color:var(--sub);margin-top:2px}
.badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:700;background:var(--accent);color:#000}
.container{max-width:720px;margin:0 auto;padding:6px 8px 60px}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:9px;color:var(--sub)}
.day-head{font-size:13px;font-weight:700;padding:8px 0 4px;color:var(--gold)}
.day-sub{font-size:9px;color:var(--sub);font-weight:400;margin-left:6px}
.mc{border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden}
.mc-head{padding:8px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;transition:.15s}
.mc-head:hover{background:rgba(0,212,170,.06)}
.mc-head.expanded{background:rgba(0,212,170,.08);border-bottom:1px solid var(--border)}
.mc-teams{flex:1;font-size:13px;font-weight:700}
.mc-teams .flag{font-size:18px;margin-right:2px}
.mc-vs{color:var(--sub);font-size:10px;margin:0 3px}
.mc-time{font-size:9px;color:var(--sub);white-space:nowrap}
.mc-cb{padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700}
.mcb-h{background:rgba(0,212,170,.15);color:var(--accent)}
.mcb-m{background:rgba(255,215,0,.15);color:var(--gold)}
.mcb-l{background:rgba(255,71,87,.15);color:var(--red)}
.mc-arrow{font-size:10px;color:var(--sub);transition:transform .2s;flex-shrink:0}
.mc-arrow.open{transform:rotate(90deg)}
.mc-body{padding:6px 10px;display:none}
.mc-body.open{display:block}
.new-tag{display:inline-block;padding:1px 5px;border-radius:3px;background:var(--red);color:#fff;font-size:8px;font-weight:700;margin-right:4px;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.ae{border-left:2px solid var(--accent);padding:4px 0 4px 8px;margin:4px 0}
.ae+.ae{margin-top:6px;border-left-color:var(--sub)}
.ae-meta{font-size:9px;color:var(--sub);margin-bottom:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ae-text{font-size:11px}
.ae-source{font-size:9px;color:var(--sub);margin-top:2px}
.ct{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700}
.ct-h{background:rgba(0,212,170,.15);color:var(--accent)}
.ct-m{background:rgba(255,215,0,.15);color:var(--gold)}
.ct-l{background:rgba(255,71,87,.15);color:var(--red)}
.fc{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;margin:1px;font-weight:600}
.fc-up{background:rgba(0,212,170,.1);color:var(--accent)}
.fc-down{background:rgba(255,71,87,.1);color:var(--red)}
.chg{background:rgba(255,71,87,.06);border-radius:3px;padding:3px 5px;margin:2px 0;font-size:10px;border-left:2px solid var(--red)}
.chg-label{font-weight:700;color:var(--red)}
.rec-box{padding:6px 8px;margin:4px 0;border-radius:5px;font-size:11px;border:1px solid var(--gold);background:rgba(255,215,0,.05)}
.nav{display:flex;gap:4px;padding:4px 0;flex-wrap:wrap}
.nav-btn{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:10px;font-weight:600}
.nav-btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--sub);font-size:12px}
.fr-btn{display:inline-block;padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;font-size:9px;font-weight:600;margin-top:2px;transition:.15s}
.fr-btn:hover{background:rgba(0,212,170,.08);border-color:var(--accent);color:var(--accent)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:100;overflow-y:auto;padding:20px 10px}
.modal.open{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:16px;position:relative}
.modal-close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--sub);font-size:18px;cursor:pointer}
.modal-close:hover{color:var(--red)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:8px;padding-right:30px}
.modal-body{font-size:12px;line-height:1.7;color:var(--text)}
.modal-body .s{color:var(--sub);font-size:11px}
.modal-body .hl{color:var(--accent);font-weight:700}
.modal-body .rl{color:var(--red);font-weight:700}
.modal-body .gl{color:var(--gold);font-weight:700}
.modal-body hr{border:none;border-top:1px solid var(--border);margin:8px 0}
</style>
</head>
<body>

<div class="header">
  <h1>🏆 <span>2026</span>世界杯 · AI情报站</h1>
  <div class="sub">守护最好的小徐佳俊 · 每2h自动分析 · 每晚12点刷新赛程 · 点击赛程查看详情</div>
</div>

<div class="container">
<div class="status-bar">
  <span>📡 <span id="dataStatus">加载中...</span></span>
  <span>⏰ 更新: <span id="nextUpdate">-</span></span>
  <span><span class="badge">每2h</span></span>
</div>
<div class="nav" id="navBar">
  <button class="nav-btn active" data-view="all">📋 全部赛程</button>
  <button class="nav-btn" data-view="today">🔥 今日</button>
  <button class="nav-btn" data-view="changes">🔄 变化追踪</button>
</div>
<div id="content"><div class="empty">🤖 加载分析数据...</div></div>
</div>

<!-- Modal -->
<div class="modal" id="modal" onclick="if(event.target===this)closeFR()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeFR()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const FLAGS={'墨西哥':'🇲🇽','南非':'🇿🇦','韩国':'🇰🇷','捷克':'🇨🇿','加拿大':'🇨🇦','波黑':'🇧🇦','卡塔尔':'🇶🇦','瑞士':'🇨🇭','巴西':'🇧🇷','摩洛哥':'🇲🇦','海地':'🇭🇹','苏格兰':'🏴','美国':'🇺🇸','巴拉圭':'🇵🇾','澳大利亚':'🇦🇺','土耳其':'🇹🇷','德国':'🇩🇪','库拉索':'🇨🇼','科特迪瓦':'🇨🇮','厄瓜多尔':'🇪🇨','荷兰':'🇳🇱','日本':'🇯🇵','瑞典':'🇸🇪','突尼斯':'🇹🇳'};
let allMatches=[],currentView='all';

function loadData(){
  console.log('🏆 世界杯情报站 v1.1 加载中...');
  const u=window.location.origin+(window.location.pathname.replace(/\/[^/]*$/,'')||'/xj/worldcup')+'/data.json?v='+Date.now();
  fetch(u).then(r=>{if(!r.ok)throw Error();return r.json();}).then(d=>{allMatches=d.matches||[];document.getElementById('dataStatus').textContent=(d.analysisCount||0)+'份分析 · '+(d.matchCount||0)+'场';render();}).catch(()=>{fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{allMatches=d.matches||[];render();}).catch(()=>{document.getElementById('dataStatus').textContent='等待首版...';render();});});
}

function render(){
  matchIdx=0;const el=document.getElementById('content'),view=currentView;
  if(!allMatches.length){el.innerHTML='<div class="empty">🤖 暂无赛程数据<br><span style="font-size:10px;">每晚12点自动刷新后三天赛程</span></div>';return;}
  let html='';const days={};
  for(const m of allMatches){if(!days[m.date])days[m.date]=[];days[m.date].push(m);}
  if(view==='changes'){
    html='<div class="day-head">🔄 变化追踪</div>';let has=false;
    for(const m of allMatches){if(m.changes&&m.changes.length){has=true;html+=renderMatch(m);}}
    if(!has)html+='<div class="empty">暂无变化</div>';
  }else{
    for(const[date,dayMatches]of Object.entries(days)){const isToday=date===getTodayStr();html+=`<div class="day-head">${isToday?'🔥 ':''}${date} <span class="day-sub">${dayMatches.length}场</span></div>`;for(const m of dayMatches)html+=renderMatch(m);}
  }
  el.innerHTML=html;
}

let matchIdx=0;
function renderMatch(m){
  const al=m.analyses||[],l=al.length?al[al.length-1]:null,c=l?l.confidence:0,cc=c>=80?'mcb-h':c>=60?'mcb-m':c>=1?'mcb-l':'';
  const mi=matchIdx++;const id='m'+mi;const hasNew=al.some(a=>a.isNew),hasChg=m.changes&&m.changes.length;
  let html=`<div class="mc" id="mc_${id}"><div class="mc-head" onclick="toggleMatch('${id}')"><span class="mc-arrow" id="arr_${id}">▶</span><span class="mc-teams"><span class="flag">${FLAGS[m.home]||''}</span>${m.home} <span class="mc-vs">vs</span> <span class="flag">${FLAGS[m.away]||''}</span>${m.away}</span><span class="mc-time">${m.date} ${m.time} · ${m.group}组</span>${c?`<span class="mc-cb ${cc}">${c}%</span>`:''}${hasNew?'<span class="new-tag">NEW</span>':''}</div><div class="mc-body" id="body_${id}">`;
  if(hasChg){for(const c of m.changes)html+=`<div class="chg"><span class="chg-label">${c.icon||'🔄'} ${c.label}</span> ${c.text}</div>`;}
  if(al.length){
    for(let ai=0;ai<al.length;ai++){const a=al[ai],cl=a.confidence>=80?'ct-h':a.confidence>=60?'ct-m':'ct-l';
      html+=`<div class="ae"><div class="ae-meta">${a.isNew?'<span class="new-tag">NEW</span>':''}<span>🕐 ${a.time}</span><span class="ct ${cl}">${a.confidence}%</span>`;
      if(a.factors){for(const f of a.factors){const c2=f.type==='good'?'fc-up':f.type==='bad'?'fc-down':'';html+=`<span class="fc ${c2}">${f.icon||''} ${f.text}</span>`;}}
      html+=`</div><div class="ae-text">${a.text}</div>`;
      if(a.sources)html+=`<div class="ae-source">📰 来源: ${a.sources.join(' · ')}</div>`;
      // Full report button
      if(a.fullReport)html+=`<div style="text-align:right;"><span class="fr-btn" data-m="${mi}" data-a="${ai}">📄 完整报告</span></div>`;
      html+=`</div>`;
    }
  }else{html+=`<div style="font-size:10px;color:var(--sub);padding:4px 0;">⏳ 等待分析...</div>`;}
  if(m.recommendations){for(const r of m.recommendations)html+=`<div class="rec-box">💎 ${r.title} ${r.odds||''} — ${r.reason}</div>`;}
  html+=`</div></div>`;
  return html;
}

function toggleMatch(id){
  const b=document.getElementById('body_'+id);if(!b)return;
  const h=b.previousElementSibling,a=document.getElementById('arr_'+id);
  b.classList.toggle('open');h.classList.toggle('expanded');a.classList.toggle('open');
}

// Handle full report clicks via delegation
document.getElementById('content').addEventListener('click',function(e){
  const btn=e.target.closest('.fr-btn');
  if(!btn)return;
  const mi=parseInt(btn.dataset.m),ai=parseInt(btn.dataset.a);
  const m=allMatches[mi];if(!m)return;
  const a=m.analyses[ai];if(a&&a.fullReport)showFR(m.home,m.away,a.time,a.fullReport);
});

function showFR(home,away,time,report){
  document.getElementById('modalTitle').textContent=FLAGS[home]||''+home+' vs '+FLAGS[away]||''+away+' · '+time;
  document.getElementById('modalBody').innerHTML=report;
  document.getElementById('modal').classList.add('open');
}
function closeFR(){document.getElementById('modal').classList.remove('open');}

function getTodayStr(){const d=new Date();return(d.getMonth()+1)+'/'+d.getDate();}
document.getElementById('navBar').addEventListener('click',e=>{const btn=e.target.closest('.nav-btn');if(!btn)return;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;render();});
function updateNextTime(){const n=new Date(),h=n.getHours(),nx=new Date(n);nx.setHours(Math.floor(h/2)*2+2,0,0,0);document.getElementById('nextUpdate').textContent=nx.toLocaleTimeString('zh-CN');}
updateNextTime();setInterval(updateNextTime,60000);
loadData();
</script>
</body>
</html>
