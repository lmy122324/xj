<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 2026世界杯 · AI预测系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0a12;--card:#14131d;--card-border:#24223a;
  --accent:#00c49a;--gold:#f0b90b;--gold-light:#f5d742;--gold-dark:#c49a0a;
  --red:#e84142;--text:#d4d0e0;--sub:#5f5b72;
  --c:#00c49a;--b:#f0b90b;--a:#e84142;
  --shadow:rgba(0,0,0,.4);
  --header-bg:#0d0c17;
}
.light{
  --bg:#f0ede6;--card:#ffffff;--card-border:#ddd8cc;
  --accent:#008f75;--gold:#a0700a;--gold-light:#c49a1a;--gold-dark:#7a5508;
  --red:#c03030;--text:#1a1a1a;--sub:#7a7a7a;
  --shadow:rgba(0,0,0,.06);
  --header-bg:#e8e4dc;
}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;
}
.header{text-align:center;padding:14px 10px 8px;background:var(--header-bg);border-bottom:1px solid var(--card-border);position:relative}
.light .header{background:var(--header-bg)}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--accent),var(--gold),transparent)}
.header h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
.header .sub{font-size:7px;color:var(--sub);margin-top:1px;letter-spacing:.5px}
.theme-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.05);border:1px solid var(--card-border);border-radius:14px;padding:2px 8px;color:var(--sub);cursor:pointer;font-size:7px;font-weight:600;z-index:2}
.top-nav{display:flex;align-items:center;padding:3px 4px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--card-border);gap:2px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.top-nav-btn{padding:4px 10px;border-radius:14px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:8px;font-weight:700;transition:all .15s;white-space:nowrap;letter-spacing:.2px}
.top-nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.top-nav-btn.active{background:rgba(255,215,0,.08);border-color:var(--gold);color:var(--gold)}
.top-nav-spacer{flex:1}
.acc-bar{margin:3px 4px;padding:5px 10px;background:rgba(255,215,0,.02);border:1px solid rgba(255,215,0,.08);border-radius:8px;font-size:7px}
.acc-bar .at{font-size:9px;font-weight:700;color:var(--gold);margin-bottom:1px}
.acc-bar .as{display:flex;gap:6px;flex-wrap:wrap}
.acc-bar .ai{text-align:center;min-width:40px}
.acc-bar .ai .n{font-size:12px;font-weight:900}
.acc-bar .ai .l{font-size:6px;color:var(--sub)}
.acc-bar .note{font-size:6px;color:var(--sub);margin-top:1px;opacity:.5}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 1px}
.dot.up{background:var(--accent)}.dot.down{background:var(--red)}.dot.flat{background:var(--gold)}
.sub-nav{display:flex;gap:2px;padding:2px 4px;flex-wrap:wrap;border-bottom:1px solid var(--card-border)}
.sub-btn{padding:2px 8px;border-radius:10px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:7px;font-weight:600}
.sub-btn.active{background:rgba(0,212,170,.08);border-color:var(--accent);color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:2px 4px 60px;display:block}
.status-bar{display:flex;justify-content:space-between;padding:4px 8px;background:rgba(255,215,0,.015);border:1px solid rgba(255,215,0,.06);border-radius:6px;margin:3px 0;font-size:7px;color:var(--sub)}

/* ===== MATCH CARDS ===== */
.pc{border:1px solid var(--card-border);border-radius:10px;margin-bottom:6px;background:var(--card);overflow:hidden;box-shadow:0 2px 12px var(--shadow);transition:box-shadow .2s}
.pc-head{padding:6px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.pc-head:hover{background:rgba(255,215,0,.01)}
.pc-head.ex{border-bottom:1px solid rgba(255,215,0,.04);background:rgba(255,215,0,.015)}
.pc-ar{font-size:6px;color:var(--gold);transition:transform .2s;flex-shrink:0;opacity:.4}
.pc-ar.open{transform:rotate(90deg);opacity:1}
.pc-tm{flex:1;font-size:12px;font-weight:700;letter-spacing:.3px}
.pc-tm .fl{font-size:14px;margin-right:1px}
.pc-tm .vs{color:var(--sub);font-size:7px;margin:0 2px;font-weight:400}
.pc-ti{font-size:7px;color:var(--sub);white-space:nowrap}
.pc-cb{padding:1px 4px;border-radius:6px;font-size:6px;font-weight:700}
.pch{background:rgba(0,212,170,.1);color:var(--accent);border:1px solid rgba(0,212,170,.1)}
.pcm{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.1)}
.pcl{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.1)}
.nt{display:inline-block;padding:1px 3px;border-radius:4px;background:linear-gradient(135deg,var(--red),#ff6b81);color:#fff;font-size:5px;font-weight:700;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.pc-body{padding:6px 10px;display:none}
.pc-body.open{display:block}
.scards{display:flex;gap:2px;margin-bottom:3px;flex-wrap:wrap}
.sc{flex:1;min-width:80px;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:center;border:1px solid var(--card-border);background:rgba(255,255,255,.02);transition:all .15s}
.sc:hover{transform:translateY(-1px)}
.sc.sel{border-color:var(--gold);background:rgba(255,215,0,.04);transform:translateY(-1px);box-shadow:0 2px 8px rgba(255,215,0,.08)}
.sc .sl{font-size:7px;font-weight:700;display:block}
.sc .sp{font-size:8px;font-weight:700;display:block;margin:1px 0}
.sc .so{font-size:9px;font-weight:900;display:block}
.sc .sr{font-size:6px;display:block;color:var(--sub)}
.jc-toggle{width:100%;padding:4px 8px;margin:3px 0;border-radius:6px;border:1px solid rgba(255,215,0,.1);background:rgba(255,215,0,.02);color:var(--gold);cursor:pointer;font-size:7px;font-weight:700;text-align:center;transition:background .15s}
.jc-panel{display:none}
.jc-panel.open{display:block}
.jc-section{margin-bottom:3px;padding:3px 5px;border-radius:4px;background:rgba(255,215,0,.01);border:1px solid rgba(255,215,0,.04)}
.jc-section .jct{font-size:7px;font-weight:700;color:var(--gold);margin-bottom:2px}
.jc-row{display:flex;gap:3px;flex-wrap:wrap}
.jc-item{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.015);font-size:7px;white-space:nowrap}
.jc-item .jcn{color:var(--sub)}
.jc-item .jco{font-weight:700;margin-left:1px}
.jco-g{color:var(--accent)}.jco-y{color:var(--gold)}.jco-r{color:var(--red)}
.chg{padding:2px 5px;margin:2px 0;font-size:7px;border-left:2px solid var(--red);background:rgba(255,255,255,.02);border-radius:0 3px 3px 0}

/* ===== BETTING VIEW ===== */
.bv{padding:2px 0}
.bv-h{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--gold);text-align:center}
.bv-sub{font-size:7px;color:var(--sub);text-align:center;margin-bottom:6px}
.bv-cards{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.bv-c{flex:1;min-width:120px;padding:8px;border-radius:8px;cursor:pointer;transition:.2s;text-align:center;border:1px solid var(--card-border)}
.bv-c:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.bv-c.active{box-shadow:0 0 0 2px var(--gold),0 4px 16px rgba(255,215,0,.1)}
.bv-c .bvt{font-size:11px;font-weight:700;display:block}
.bv-c .bvd{font-size:7px;display:block;color:var(--sub);margin:2px 0}
.bv-c .bvr{font-size:18px;font-weight:900;display:block;margin:4px 0}
.bv-c .bvn{font-size:7px;display:block;color:var(--sub)}
.bv-c.s1{border-color:rgba(0,212,170,.3);background:rgba(0,212,170,.04)}
.bv-c.s1 .bvt{color:var(--c)}.bv-c.s1 .bvr{color:var(--c)}
.bv-c.s2{border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.04)}
.bv-c.s2 .bvt{color:var(--b)}.bv-c.s2 .bvr{color:var(--b)}
.bv-c.s3{border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.04)}
.bv-c.s3 .bvt{color:var(--a)}.bv-c.s3 .bvr{color:var(--a)}

.bv-list-title{font-size:9px;font-weight:700;color:var(--gold);margin-bottom:3px}
.bv-item{padding:4px 6px;margin:2px 0;border-radius:4px;border:1px solid rgba(255,215,0,.06);display:flex;align-items:center;gap:4px;font-size:7px;background:rgba(255,255,255,.01)}
.bv-item .bvi-ck{width:12px;height:12px;border-radius:2px;border:1px solid var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:7px;flex-shrink:0}
.bv-item .bvi-ck.ckd{background:var(--gold);border-color:var(--gold);color:#000}
.bv-item .bvi-m{flex:1}
.bv-item .bvi-o{font-weight:700;font-size:8px}
.bv-item .bvi-c{font-size:6px;color:var(--sub)}
.bv-parlay{padding:6px 8px;border-radius:6px;border:1px solid rgba(255,215,0,.12);background:rgba(255,215,0,.02);margin-top:6px}
.bv-parlay .bvp-h{font-size:9px;font-weight:700;color:var(--gold);margin-bottom:3px}
.bv-parlay .bvp-row{display:flex;justify-content:space-between;font-size:7px;padding:2px 0}
.bv-parlay .bvp-btn{padding:4px 12px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;font-size:8px;font-weight:700;cursor:pointer;margin-top:3px;width:100%}
.bv-parlay .bvp-btn:disabled{opacity:.4;cursor:default}

/* ===== ANALYSIS / MODAL ===== */
.rpt{padding:6px 8px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;overflow-y:auto;padding:15px 8px}
.modal-box{max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:14px;position:relative}
.mc{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.05);border:none;position:absolute;top:8px;right:10px;color:var(--sub);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}

.empty{padding:24px 10px;text-align:center;color:var(--sub);font-size:10px}
.hide{display:none!important}

/* ===== 可视化组件 ===== */
.vis-row{display:flex;gap:4px;margin:2px 0;flex-wrap:wrap}
.vis-left{flex:0 0 auto;min-width:120px;max-width:160px}
.vis-right{flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px}
/* 概率条 */
.pbar{display:flex;align-items:center;gap:3px;margin:1px 0;height:14px}
.pbar-tr{flex:1;height:10px;background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden;position:relative}
.pbar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.25,.46,.45,.94);min-width:0}
.pbar-label{font-size:6px;color:var(--sub);white-space:nowrap;width:22px;text-align:right;flex-shrink:0}
.pbar-val{font-size:7px;font-weight:700;width:32px;text-align:right;flex-shrink:0}
/* 进球区间 */
.grange{padding:4px 2px}
.grange-track{position:relative;height:16px;background:rgba(255,255,255,.04);border-radius:8px;margin:2px 0 4px}
.grange-highlight{position:absolute;top:0;height:100%;border-radius:8px;background:linear-gradient(90deg,rgba(255,215,0,.15),rgba(255,215,0,.3));border:1px solid rgba(255,215,0,.3);z-index:1;transition:left .5s cubic-bezier(.25,.46,.45,.94),width .5s cubic-bezier(.25,.46,.45,.94)}
.grange-ticks{display:flex;justify-content:space-between;font-size:6px;color:var(--sub);position:relative;margin-top:-2px}
.grange-tick{text-align:center;flex:1}
/* 对位看板 */
.kb{border:1px solid rgba(255,215,0,.08);border-radius:5px;padding:4px 6px;margin:2px 0;background:rgba(255,215,0,.01)}
.kb-tit{font-size:7px;font-weight:700;color:var(--gold);margin-bottom:3px}
.kb-row{display:flex;justify-content:space-between;font-size:7px;padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.kb-row:last-child{border-bottom:none}
.kb-row .kbl{color:var(--sub)}
.kb-row .kbh{color:var(--text);font-weight:600}
.kb-row .kba{color:var(--text);font-weight:600;text-align:right}
/* 仪表盘 */
.ana-split{display:flex;gap:4px;flex-wrap:wrap}
.ana-left{flex:2;min-width:200px}
.ana-right{flex:3;min-width:240px;border-left:1px solid rgba(255,215,0,.06);padding-left:4px}
.ana-right .rpt{padding:0;font-size:9px;max-height:400px;overflow-y:auto}
.tg-canvas{display:inline-block;vertical-align:middle;width:36px;height:16px;margin-left:2px;border-radius:2px}
@media(max-width:480px){
  .ana-split{flex-direction:column}
  .ana-right{border-left:none;border-top:1px solid rgba(255,215,0,.06);padding-left:0;padding-top:3px;margin-top:3px}
}
.gauge-wrap{display:inline-flex;align-items:center;gap:3px;position:relative}
.gauge-svg{width:36px;height:36px;display:block}
.gauge-val{position:absolute;font-size:7px;font-weight:900;text-align:center;line-height:1;width:36px;top:50%;left:50%;transform:translate(-50%,-35%)}
@media(max-width:480px){
  .vis-left{max-width:130px}
  .vis-right{min-width:100px}
}

@media(max-width:480px){
  .pc-tm{font-size:10px}.pc-tm .fl{font-size:12px}
  .sc{min-width:60px}.bv-c{min-width:90px;padding:6px}
  .header h1{font-size:15px}.bv-c .bvr{font-size:15px}
}
@media(min-width:900px){.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
@media(min-width:1400px){.pc-grid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:899px){.pc-grid{display:block}}
</style>
</head>

  <div class="sub">每8h更新 · 竞彩全玩法 · 购彩策略</div>
  <button class="theme-btn" onclick="tt()" id="tb">🌙</button>
</div>

  <button class="top-nav-btn active" data-v="pred" onclick="swV('pred',this)">🏠 预测</button>

<!-- VIEW: PREDICT -->
<div id="vPred">
<div class="container">
<div class="status-bar"><span>📡 <span id="dS">加载中...</span></span><span>⏰ 下次: <span id="nU">-</span></span></div>
<div class="sub-nav">
  <button class="sub-btn active" data-f="all" onclick="fil('all',this)">📋 全部</button>
  <button class="sub-btn" data-f="today" onclick="fil('today',this)">🔥 今日</button>
  <button class="sub-btn" data-f="changes" onclick="fil('changes',this)">🔄 变化</button>
</div>
<div id="pC"><div class="empty">🤖 加载中...</div></div>
</div></div>

<!-- VIEW: ANALYSIS -->
<div id="vAna" class="hide">
<div class="container">
<div class="sub-nav">
  <button class="sub-btn active" data-av="s" onclick="swAV('s',this)">🔍 单场</button>
  <button class="sub-btn" data-av="t" onclick="swAV('t',this)">📋 今日全部</button>
</div>
<div id="anaC"><div class="empty">📊 选择比赛查看分析</div></div>
</div></div>

<!-- VIEW: BETTING -->
<div id="vBet" class="hide">
<div class="container">
<div class="bv" id="bC"><div class="empty">💰 加载购彩建议...</div></div>
</div></div>

function gaugeHTML(conf){
  var col=conf>=75?'var(--accent)':conf>=60?'var(--gold)':'var(--red)';
  var r=conf/100*180;
  var rad=Math.PI/180,x0=18,y0=32,radius=14;
  var start=-180,end=-180+r;
  function px(a){return x0+radius*Math.cos((a-90)*rad);}
  function py(a){return y0+radius*Math.sin((a-90)*rad);}
  var d='M'+px(start)+','+py(start)+' A'+radius+','+radius+' 0 '+(r>180?1:0)+',1 '+px(end)+','+py(end);
  var bg='M'+px(-180)+','+py(-180)+' A'+radius+','+radius+' 0 0,1 '+px(0)+','+py(0);
  return '<span class="gauge-wrap"><svg class="gauge-svg" viewBox="0 0 36 36"><path d="'+bg+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="3"></path><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round"></path></svg><span class="gauge-val" style="color:'+col+'">'+conf+'</span></span>';
}

var animLock={};
// ===== 信心趋势小折线 =====
function drawTrend(canvasId, confs, animated){
  var cv=document.getElementById(canvasId);if(!cv||!confs||confs.length<2)return;
  if(cv.offsetWidth===0){setTimeout(function(){drawTrend(canvasId,confs,animated);},200);return;}
  var dpr=window.devicePixelRatio||1;
  var w=36,h=16;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var cs=getComputedStyle(document.body);var accent=cs.getPropertyValue('--accent').trim()||'#00d4aa';
  function drawFrame(pct){
    ctx.clearRect(0,0,w,h);
    var n=confs.length,spacing=w/(n-1);
    // grid dots at full positions
    for(var i=0;i<n;i++){
      var x=i*spacing,y=h-2-(confs[i]/100)*(h-4);
      ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();
    }
    // animated line
    var drawN=Math.max(2,Math.floor(1+(n-1)*pct));
    ctx.beginPath();
    for(var i=0;i<drawN;i++){
      var x=i*spacing,y=h-2-(confs[i]/100)*(h-4);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.stroke();
    // last dot bigger
    if(drawN>0){
      var lx=(drawN-1)*spacing,ly=h-2-(confs[drawN-1]/100)*(h-4);
      ctx.beginPath();ctx.arc(lx,ly,1.8,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
    }
  }
  if(animated===false){drawFrame(1);return;}
  var startT=null,dur=400;
  function step(ts){
    if(!startT)startT=ts;
    var p=Math.min(1,(ts-startT)/dur);
    drawFrame(1-Math.pow(1-p,3));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

      for(var i=0;i<=6;i++){var idx=i%6;var a=angles[idx];var val=((data[idx]||0)/100)*p;var x=cx+R*val*Math.cos(a);var y=cy+R*val*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.closePath();ctx.fillStyle=fillColor;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
      for(var i=0;i<6;i++){var a=angles[i];var val=((data[i]||0)/100)*p;var x=cx+R*val*Math.cos(a);var y=cy+R*val*Math.sin(a);ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
    }
    plotTeam(awayData,'rgba(255,215,0,.5)','rgba(255,215,0,.06)');

    ctx.fillStyle='rgba(255,215,0,.8)';ctx.fillRect(8,19,7,7);ctx.fillStyle=textColor;ctx.fillText(awayLabel,18,25);
  }
  if(!animated){drawFrame(1);return;}
  var startT=null,dur=500;
  animLock[canvasId]=true;
  function step(ts){
    if(!startT)startT=ts;
    var elapsed=ts-startT,p=Math.min(1,elapsed/dur);
    var ease=1-Math.pow(1-p,3);
    drawFrame(ease);
    if(p<1){requestAnimationFrame(step);}else{animLock[canvasId]=false;}
  }
  requestAnimationFrame(step);
}

// ===== 计算简易6维雷达数据 =====
function calcRadar(match,analysis){
  var deep=analysis&&analysis.deepAnalysis?analysis.deepAnalysis:{};
  var pH=deep.probHome||50,pA=deep.probAway||50;
  var rankH=deep.fifaRankHome||50,rankA=deep.fifaRankAway||50;
  var strengthH=Math.max(20,Math.min(95,100-rankH*1.2+10));
  var strengthA=Math.max(20,Math.min(95,100-rankA*1.2+10));
  var home=[
    Math.round((strengthH+pH)/2),
    Math.round((100-rankH*0.8+pH*0.3)/1.3),
    Math.round((strengthH+pH*0.6)/1.6),
    Math.round(50+Math.random()*30),
    Math.round(strengthH*0.7+30),
    Math.round(60+Math.random()*25)
  ];
  var away=[
    Math.round((strengthA+pA)/2),
    Math.round((100-rankA*0.8+pA*0.3)/1.3),
    Math.round((strengthA+pA*0.6)/1.6),
    Math.round(50+Math.random()*30),
    Math.round(strengthA*0.7+30),
    Math.round(60+Math.random()*25)
  ];
  return {home:home,away:away};
}

function diffText(a,b){
  var parts=[];
  if(!a||!b)return parts;
  var ra=a.deepAnalysis?a.deepAnalysis.predictedResult:'';
  var rb=b.deepAnalysis?b.deepAnalysis.predictedResult:'';
  if(ra&&rb&&ra!==rb)parts.push('\u25B6 \u9884\u6D4B\u65B9\u5411 ['+ra+'] \u2192 ['+rb+']');
  if(a.confidence!==undefined&&b.confidence!==undefined&&a.confidence!==b.confidence){
    var dir=b.confidence>a.confidence?'\u2191\u5347\u81F3':'\u2193\u964D\u81F3';
    parts.push('\u25B6 \u4FE1\u5FC3 '+a.confidence+'% \u2192 '+b.confidence+'% ('+dir+')');
  }
  var sa=a.possibleScores||[],sb=b.possibleScores||[];
  if(sa.length&&sb.length&&JSON.stringify(sa)!==JSON.stringify(sb)){
    parts.push('\u25B6 \u6CE2\u80C6 ['+sa.join(',')+'] \u2192 ['+sb.join(',')+']');
  }
  var ga=a.deepAnalysis?a.deepAnalysis.goalRange:'';
  var gb=b.deepAnalysis?b.deepAnalysis.goalRange:'';
  if(ga&&gb&&ga!==gb)parts.push('\u25B6 \u603B\u8FDB\u7403 ['+ga+'] \u2192 ['+gb+']');
  if(a.text&&b.text&&a.text!==b.text)parts.push('\u25B6 \u5206\u6790\u8981\u70B9\u6709\u8C03\u6574');
  return parts;
}

  box.style.cssText='max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:12px;position:relative';

  closeBtn.textContent='X';
  closeBtn.style.cssText='position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.05);border:none;color:var(--sub);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center';
  closeBtn.onclick=function(){m.remove();};

  box.appendChild(bodyDiv);
  m.appendChild(box);
  document.body.appendChild(m);
  m.onclick=function(e){if(e.target===m)m.remove()};
}function swV(v,btn){cV=v;var oids=[];document.querySelectorAll('.pc-body.open').forEach(function(o){oids.push(o.id.replace('bd',''))});document.querySelectorAll('.top-nav-btn').forEach(function(b){b.classList.remove('active')});if(btn)btn.classList.add('active');document.getElementById('vPred').className=(v==='pred'?'':'hide');document.getElementById('vAna').className=(v==='ana'?'':'hide');document.getElementById('vBet').className=(v==='bet'?'':'hide');document.getElementById('ab').style.display=(v==='bet'?'none':'');rP();setTimeout(function(){oids.forEach(function(id){var b2=document.getElementById('bd'+id);if(b2&&!b2.classList.contains('open')){b2.classList.add('open');var a2=document.getElementById('ar'+id);if(a2)a2.classList.add('open');var ph2=b2.previousElementSibling;if(ph2)ph2.classList.add('ex');}});},50);}

if(localStorage.getItem('wcT')==='l'){document.body.classList.add('light');document.getElementById('tb').textContent='☀️';}
