<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 2026世界杯 · AI预测系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0a12;--card:#14131d;--card-border:#24223a;
  --accent:#00c49a;--gold:#f0b90b;--gold-light:#f5d742;--gold-dark:#c49a0a;
  --red:#e84142;--text:#d4d0e0;--sub:#5f5b72;
  --c:#00c49a;--b:#f0b90b;--a:#e84142;
  --shadow:rgba(0,0,0,.4);
  --header-bg:#0d0c17;
}
.light{
  --bg:#f0ede6;--card:#ffffff;--card-border:#ddd8cc;
  --accent:#008f75;--gold:#a0700a;--gold-light:#c49a1a;--gold-dark:#7a5508;
  --red:#c03030;--text:#1a1a1a;--sub:#7a7a7a;
  --shadow:rgba(0,0,0,.06);
  --header-bg:#e8e4dc;
}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;
}
.header{text-align:center;padding:14px 10px 8px;background:var(--header-bg);border-bottom:1px solid var(--card-border);position:relative}
.light .header{background:var(--header-bg)}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--accent),var(--gold),transparent)}
.header h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
.header .sub{font-size:7px;color:var(--sub);margin-top:1px;letter-spacing:.5px}
.theme-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.05);border:1px solid var(--card-border);border-radius:14px;padding:2px 8px;color:var(--sub);cursor:pointer;font-size:7px;font-weight:600;z-index:2}
.top-nav{display:flex;align-items:center;padding:3px 4px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--card-border);gap:2px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.top-nav-btn{padding:4px 10px;border-radius:14px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:8px;font-weight:700;transition:all .15s;white-space:nowrap;letter-spacing:.2px}
.top-nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.top-nav-btn.active{background:rgba(255,215,0,.08);border-color:var(--gold);color:var(--gold)}
.top-nav-spacer{flex:1}
.acc-bar{margin:3px 4px;padding:5px 10px;background:rgba(255,215,0,.02);border:1px solid rgba(255,215,0,.08);border-radius:8px;font-size:7px}
.acc-bar .at{font-size:9px;font-weight:700;color:var(--gold);margin-bottom:1px}
.acc-bar .as{display:flex;gap:6px;flex-wrap:wrap}
.acc-bar .ai{text-align:center;min-width:40px}
.acc-bar .ai .n{font-size:12px;font-weight:900}
.acc-bar .ai .l{font-size:6px;color:var(--sub)}
.acc-bar .note{font-size:6px;color:var(--sub);margin-top:1px;opacity:.5}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin:0 1px}
.dot.up{background:var(--accent)}.dot.down{background:var(--red)}.dot.flat{background:var(--gold)}
.sub-nav{display:flex;gap:2px;padding:2px 4px;flex-wrap:wrap;border-bottom:1px solid var(--card-border)}
.sub-btn{padding:2px 8px;border-radius:10px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:7px;font-weight:600}
.sub-btn.active{background:rgba(0,212,170,.08);border-color:var(--accent);color:var(--accent)}
.container{max-width:1400px;margin:0 auto;padding:2px 4px 60px;display:block}
.status-bar{display:flex;justify-content:space-between;padding:4px 8px;background:rgba(255,215,0,.015);border:1px solid rgba(255,215,0,.06);border-radius:6px;margin:3px 0;font-size:7px;color:var(--sub)}

/* ===== MATCH CARDS ===== */
.pc{border:1px solid var(--card-border);border-radius:10px;margin-bottom:6px;background:var(--card);overflow:hidden;box-shadow:0 2px 12px var(--shadow);transition:box-shadow .2s}
.pc-head{padding:6px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.pc-head:hover{background:rgba(255,215,0,.01)}
.pc-head.ex{border-bottom:1px solid rgba(255,215,0,.04);background:rgba(255,215,0,.015)}
.pc-ar{font-size:6px;color:var(--gold);transition:transform .2s;flex-shrink:0;opacity:.4}
.pc-ar.open{transform:rotate(90deg);opacity:1}
.pc-tm{flex:1;font-size:12px;font-weight:700;letter-spacing:.3px}
.pc-tm .fl{font-size:14px;margin-right:1px}
.pc-tm .vs{color:var(--sub);font-size:7px;margin:0 2px;font-weight:400}
.pc-ti{font-size:7px;color:var(--sub);white-space:nowrap}
.pc-cb{padding:1px 4px;border-radius:6px;font-size:6px;font-weight:700}
.pch{background:rgba(0,212,170,.1);color:var(--accent);border:1px solid rgba(0,212,170,.1)}
.pcm{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.1)}
.pcl{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.1)}
.nt{display:inline-block;padding:1px 3px;border-radius:4px;background:linear-gradient(135deg,var(--red),#ff6b81);color:#fff;font-size:5px;font-weight:700;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.pc-body{padding:6px 10px;display:none}
.pc-body.open{display:block}
.scards{display:flex;gap:2px;margin-bottom:3px;flex-wrap:wrap}
.sc{flex:1;min-width:80px;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:center;border:1px solid var(--card-border);background:rgba(255,255,255,.02);transition:all .15s}
.sc:hover{transform:translateY(-1px)}
.sc.sel{border-color:var(--gold);background:rgba(255,215,0,.04);transform:translateY(-1px);box-shadow:0 2px 8px rgba(255,215,0,.08)}
.sc .sl{font-size:7px;font-weight:700;display:block}
.sc .sp{font-size:8px;font-weight:700;display:block;margin:1px 0}
.sc .so{font-size:9px;font-weight:900;display:block}
.sc .sr{font-size:6px;display:block;color:var(--sub)}
.jc-toggle{width:100%;padding:4px 8px;margin:3px 0;border-radius:6px;border:1px solid rgba(255,215,0,.1);background:rgba(255,215,0,.02);color:var(--gold);cursor:pointer;font-size:7px;font-weight:700;text-align:center;transition:background .15s}
.jc-panel{display:none}
.jc-panel.open{display:block}
.jc-section{margin-bottom:3px;padding:3px 5px;border-radius:4px;background:rgba(255,215,0,.01);border:1px solid rgba(255,215,0,.04)}
.jc-section .jct{font-size:7px;font-weight:700;color:var(--gold);margin-bottom:2px}
.jc-row{display:flex;gap:3px;flex-wrap:wrap}
.jc-item{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.015);font-size:7px;white-space:nowrap}
.jc-item .jcn{color:var(--sub)}
.jc-item .jco{font-weight:700;margin-left:1px}
.jco-g{color:var(--accent)}.jco-y{color:var(--gold)}.jco-r{color:var(--red)}
.chg{padding:2px 5px;margin:2px 0;font-size:7px;border-left:2px solid var(--red);background:rgba(255,255,255,.02);border-radius:0 3px 3px 0}

/* ===== BETTING VIEW ===== */
.bv{padding:2px 0}
.bv-h{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--gold);text-align:center}
.bv-sub{font-size:7px;color:var(--sub);text-align:center;margin-bottom:6px}
.bv-cards{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap}
.bv-c{flex:1;min-width:120px;padding:8px;border-radius:8px;cursor:pointer;transition:.2s;text-align:center;border:1px solid var(--card-border)}
.bv-c:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.bv-c.active{box-shadow:0 0 0 2px var(--gold),0 4px 16px rgba(255,215,0,.1)}
.bv-c .bvt{font-size:11px;font-weight:700;display:block}
.bv-c .bvd{font-size:7px;display:block;color:var(--sub);margin:2px 0}
.bv-c .bvr{font-size:18px;font-weight:900;display:block;margin:4px 0}
.bv-c .bvn{font-size:7px;display:block;color:var(--sub)}
.bv-c.s1{border-color:rgba(0,212,170,.3);background:rgba(0,212,170,.04)}
.bv-c.s1 .bvt{color:var(--c)}.bv-c.s1 .bvr{color:var(--c)}
.bv-c.s2{border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.04)}
.bv-c.s2 .bvt{color:var(--b)}.bv-c.s2 .bvr{color:var(--b)}
.bv-c.s3{border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.04)}
.bv-c.s3 .bvt{color:var(--a)}.bv-c.s3 .bvr{color:var(--a)}

.bv-list-title{font-size:9px;font-weight:700;color:var(--gold);margin-bottom:3px}
.bv-item{padding:4px 6px;margin:2px 0;border-radius:4px;border:1px solid rgba(255,215,0,.06);display:flex;align-items:center;gap:4px;font-size:7px;background:rgba(255,255,255,.01)}
.bv-item .bvi-ck{width:12px;height:12px;border-radius:2px;border:1px solid var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:7px;flex-shrink:0}
.bv-item .bvi-ck.ckd{background:var(--gold);border-color:var(--gold);color:#000}
.bv-item .bvi-m{flex:1}
.bv-item .bvi-o{font-weight:700;font-size:8px}
.bv-item .bvi-c{font-size:6px;color:var(--sub)}
.bv-parlay{padding:6px 8px;border-radius:6px;border:1px solid rgba(255,215,0,.12);background:rgba(255,215,0,.02);margin-top:6px}
.bv-parlay .bvp-h{font-size:9px;font-weight:700;color:var(--gold);margin-bottom:3px}
.bv-parlay .bvp-row{display:flex;justify-content:space-between;font-size:7px;padding:2px 0}
.bv-parlay .bvp-btn{padding:4px 12px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#000;font-size:8px;font-weight:700;cursor:pointer;margin-top:3px;width:100%}
.bv-parlay .bvp-btn:disabled{opacity:.4;cursor:default}

/* ===== ANALYSIS / MODAL ===== */
.rpt{padding:6px 8px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;overflow-y:auto;padding:15px 8px}
.modal-box{max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:14px;position:relative}
.mc{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.05);border:none;position:absolute;top:8px;right:10px;color:var(--sub);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}

.empty{padding:24px 10px;text-align:center;color:var(--sub);font-size:10px}
.hide{display:none!important}

/* ===== 可视化组件 ===== */
.vis-row{display:flex;gap:4px;margin:2px 0;flex-wrap:wrap}
.vis-left{flex:0 0 auto;min-width:120px;max-width:160px}
.vis-right{flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px}
/* 概率条 */
.pbar{display:flex;align-items:center;gap:3px;margin:1px 0;height:14px}
.pbar-tr{flex:1;height:10px;background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden;position:relative}
.pbar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.25,.46,.45,.94);min-width:0}
.pbar-label{font-size:6px;color:var(--sub);white-space:nowrap;width:22px;text-align:right;flex-shrink:0}
.pbar-val{font-size:7px;font-weight:700;width:32px;text-align:right;flex-shrink:0}
/* 进球区间 */
.grange{padding:4px 2px}
.grange-track{position:relative;height:16px;background:rgba(255,255,255,.04);border-radius:8px;margin:2px 0 4px}
.grange-highlight{position:absolute;top:0;height:100%;border-radius:8px;background:linear-gradient(90deg,rgba(255,215,0,.15),rgba(255,215,0,.3));border:1px solid rgba(255,215,0,.3);z-index:1;transition:left .5s cubic-bezier(.25,.46,.45,.94),width .5s cubic-bezier(.25,.46,.45,.94)}
.grange-ticks{display:flex;justify-content:space-between;font-size:6px;color:var(--sub);position:relative;margin-top:-2px}
.grange-tick{text-align:center;flex:1}
/* 对位看板 */
.kb{border:1px solid rgba(255,215,0,.08);border-radius:5px;padding:4px 6px;margin:2px 0;background:rgba(255,215,0,.01)}
.kb-tit{font-size:7px;font-weight:700;color:var(--gold);margin-bottom:3px}
.kb-row{display:flex;justify-content:space-between;font-size:7px;padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.kb-row:last-child{border-bottom:none}
.kb-row .kbl{color:var(--sub)}
.kb-row .kbh{color:var(--text);font-weight:600}
.kb-row .kba{color:var(--text);font-weight:600;text-align:right}
/* 仪表盘 */
.ana-split{display:flex;gap:4px;flex-wrap:wrap}
.ana-left{flex:2;min-width:200px}
.ana-right{flex:3;min-width:240px;border-left:1px solid rgba(255,215,0,.06);padding-left:4px}
.ana-right .rpt{padding:0;font-size:9px;max-height:400px;overflow-y:auto}
.tg-canvas{display:inline-block;vertical-align:middle;width:36px;height:16px;margin-left:2px;border-radius:2px}
@media(max-width:480px){
  .ana-split{flex-direction:column}
  .ana-right{border-left:none;border-top:1px solid rgba(255,215,0,.06);padding-left:0;padding-top:3px;margin-top:3px}
}
.gauge-wrap{display:inline-flex;align-items:center;gap:3px;position:relative}
.gauge-svg{width:36px;height:36px;display:block}
.gauge-val{position:absolute;font-size:7px;font-weight:900;text-align:center;line-height:1;width:36px;top:50%;left:50%;transform:translate(-50%,-35%)}
@media(max-width:480px){
  .vis-left{max-width:130px}
  .vis-right{min-width:100px}
}

@media(max-width:480px){
  .pc-tm{font-size:10px}.pc-tm .fl{font-size:12px}
  .sc{min-width:60px}.bv-c{min-width:90px;padding:6px}
  .header h1{font-size:15px}.bv-c .bvr{font-size:15px}
}
@media(min-width:900px){.pc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}}
@media(min-width:1400px){.pc-grid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:899px){.pc-grid{display:block}}

/* === Interactive UX improvements === */
.pc-head{padding:6px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;transition:background .15s;border-radius:6px 6px 0 0}
.pc-head:hover{background:rgba(255,215,0,.04);box-shadow:inset 0 0 0 1px rgba(255,215,0,.08)}
.pc-head.ex{background:rgba(255,215,0,.015)}
.pc{cursor:default;transition:box-shadow .2s}
.pc:hover{box-shadow:0 3px 16px rgba(0,0,0,.3)}
.sc{cursor:pointer;transition:all .2s;border:2px solid var(--card-border);border-left-width:4px;padding:5px 6px;position:relative;border-radius:8px}


.sc:hover{transform:translateY(-2px);box-shadow:0 3px 12px rgba(0,0,0,.3)}
.sc .sl{font-size:8px;font-weight:700;display:block;margin-bottom:2px}
.sc .so{font-size:10px;font-weight:900;display:block}
.sc .sp{font-size:7px;display:block}
.sc .sr{font-size:6px;color:var(--sub)}
.sc.sel{box-shadow:0 3px 12px rgba(255,215,0,.15)}
.bvi-ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--card-border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:700;color:var(--accent);transition:all .15s;flex-shrink:0}
.bvi-ck:hover{border-color:var(--gold);background:rgba(255,215,0,.03)}
.bvi-ck.ckd{border-color:var(--accent)!important;background:rgba(0,212,170,.1)!important}
.bv-item{cursor:default;transition:all .15s;padding:5px 6px;border-radius:6px}
.bv-item:hover{border-color:rgba(255,215,0,.2);background:rgba(255,215,0,.02);transform:translateY(-1px)}
.bv-c{cursor:pointer;transition:all .2s;border-radius:10px;position:relative;overflow:hidden}
.bv-c:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 3px 12px rgba(255,215,0,.06)}
.bv-c.active{transform:translateY(-1px)}
.sub-btn{cursor:pointer;transition:all .15s}
.sub-btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.jc-toggle{cursor:pointer;transition:all .15s;width:100%;padding:4px 8px;margin:3px 0;border-radius:6px;border:1px solid rgba(255,215,0,.1);background:rgba(255,215,0,.02);color:var(--gold);font-size:7px;font-weight:700;text-align:center}
.jc-toggle:hover{background:rgba(255,215,0,.06);border-color:var(--gold)}
.top-nav-btn{cursor:pointer;transition:all .2s;position:relative}
.top-nav-btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.bvp-btn{cursor:pointer;transition:all .2s}
.bvp-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 12px rgba(240,185,11,.2)}
.bvp-btn:disabled{opacity:.4;cursor:not-allowed}


/* ===== STRATEGY TABS ===== */
.st-tabs{display:flex;gap:4px;margin-bottom:6px;padding:0}
.st-tab{flex:1;padding:8px 4px;border-radius:8px;border:2px solid var(--card-border);background:var(--card);cursor:pointer;text-align:center;transition:all .2s;font-size:8px;font-weight:600;color:var(--sub)}
.st-tab:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.st-tab .st-icon{font-size:16px;display:block;margin-bottom:2px}
.st-tab .st-label{font-size:9px;display:block}
.st-tab .st-desc{font-size:6px;display:block;margin-top:1px;opacity:.7}
.st-tab.active{background:rgba(0,212,170,.06);transform:translateY(-2px)}
.st-tab.active.s1{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 3px 12px rgba(0,212,170,.12)}
.st-tab.active.s1 .st-label{color:var(--c);font-weight:800}
.st-tab.active.s2{border-color:var(--b);box-shadow:0 0 0 1px var(--b),0 3px 12px rgba(255,215,0,.12)}
.st-tab.active.s2 .st-label{color:var(--b);font-weight:800}
.st-tab.active.s3{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 3px 12px rgba(232,65,66,.12)}
.st-tab.active.s3 .st-label{color:var(--a);font-weight:800}

/* ===== BETTING ITEMS WITH STRATEGY COLOR ===== */
.bv-item.s1{border-left:3px solid var(--c)}
.bv-item.s2{border-left:3px solid var(--b)}
.bv-item.s3{border-left:3px solid var(--a)}
.bv-item .bvi-s1{color:var(--c);font-weight:700}
.bv-item .bvi-s2{color:var(--b);font-weight:700}
.bv-item .bvi-s3{color:var(--a);font-weight:700}
.bv-item .bvi-ck.s1{background:rgba(0,212,170,.15);border-color:var(--c);color:var(--c)}
.bv-item .bvi-ck.s2{background:rgba(255,215,0,.15);border-color:var(--b);color:var(--b)}
.bv-item .bvi-ck.s3{background:rgba(232,65,66,.15);border-color:var(--a);color:var(--a)}
.bv-item .bvi-ck.s1.ckd{background:var(--c)!important;border-color:var(--c)!important;color:#000!important}
.bv-item .bvi-ck.s2.ckd{background:var(--b)!important;border-color:var(--b)!important;color:#000!important}
.bv-item .bvi-ck.s3.ckd{background:var(--a)!important;border-color:var(--a)!important;color:#000!important}

/* ===== MULTI-OPTION BETTING ITEMS ===== */
.bv-opts{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.bv-opt{padding:2px 5px;border-radius:3px;border:1px solid var(--card-border);cursor:pointer;font-size:6px;white-space:nowrap;transition:all .15s;background:rgba(255,255,255,.02);color:var(--sub)}
.bv-opt:hover{border-color:var(--gold);background:rgba(255,215,0,.04)}
.bv-opt.ckd{border-color:var(--gold);background:rgba(255,215,0,.08);color:var(--gold)}
.bv-opt.s1{border-left:2px solid var(--c)}
.bv-opt.s2{border-left:2px solid var(--b)}
.bv-opt.s3{border-left:2px solid var(--a)}

/* ===== STANDINGS TABLE ===== */
.st-group{margin-bottom:8px}
.st-group-title{font-size:10px;font-weight:700;color:var(--gold);padding:4px 0 2px}
.st-table{width:100%;border-collapse:collapse;font-size:7px}
.st-table th{padding:3px 4px;text-align:center;border-bottom:1px solid var(--card-border);color:var(--sub);font-weight:600}

function cn(n){return CN[n]||n}
function fl(n){return FL[cn(n)]||''}

var AM=[],cV='pred',cF='all',cAv='s',cS='balanced',cMi=0,selParlay={},radarData=[];

function ld(){
  // Load from cache first (instant render)
  try{var cached=localStorage.getItem('wcData');if(cached){var cd=JSON.parse(cached);AM=cd.matches||[];document.getElementById('dS').textContent=(cd.analysisCount||0)+'份(缓存'+(cd._cachedAt?' '+cd._cachedAt:'')+')';uA(cd.prediction_accuracy);rP();}}catch(e){}
  // Fetch fresh data in background
  var u=(window.location.origin+(window.location.pathname.replace(/\/[^/]*$/,'')||'/xj/worldcup'))+'/data.json?v='+Date.now();
  fetch(u).then(function(r){return r.json()}).then(function(d){
    AM=d.matches||[];document.getElementById('dS').textContent=(d.analysisCount||0)+'份';
    uA(d.prediction_accuracy);rP();
    try{var wcSave=JSON.parse(JSON.stringify(d));wcSave._cachedAt=new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});localStorage.setItem('wcData',JSON.stringify(wcSave));}catch(e){}
  }).catch(function(){
    fetch('data.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
      AM=d.matches||[];uA(d.prediction_accuracy);rP();
      try{var wcSave=JSON.parse(JSON.stringify(d));wcSave._cachedAt=new Date().toLocaleString('zh-CN',{hour:'2-digit',minute:'2-digit'});localStorage.setItem('wcData',JSON.stringify(wcSave));}catch(e){}
    }).catch(function(){
      if(!AM.length){document.getElementById('dS').textContent='等待数据...';document.getElementById('pC').innerHTML='<div class="empty">网络无法连接，请刷新重试</div>';}
    });
  });
}
function uA(ac){
  if(!ac)return;
  document.getElementById('aT').textContent=ac.total_matches||0;
  document.getElementById('aR').textContent=ac.accuracy_rate||'0%';
  ; // accuracy display handled by parts
  if(ac.history&&ac.history.length){
    var r=ac.history.slice(-5);
    document.getElementById('aD').innerHTML=r.map(function(h){return '<span class="dot '+(h.rate>60?'up':h.rate>45?'flat':'down')+'" title="'+h.date+': '+h.rate+'%"></span>'}).join('');
  }
}
function gT(){
  var d=new Date();
  return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
}
function rP(){
  if(cV==='pred'){document.getElementById('pC').innerHTML=rM();}
  else if(cV==='ana'){rA();}
  else if(cV==='bet'){rB();}
}
function rM(){
  if(!AM.length)return '<div class="empty">暂无赛程</div>';
  var days={},mi=0,doneM=[],futureM=[];
  for(var i=0;i<AM.length;i++){var m=AM[i];if(m.result){doneM.push(m);}else{futureM.push(m);}}
  // Group future matches by day
  var days={};
  for(var i=0;i<futureM.length;i++){var m=futureM[i];var d=m.date||'?';if(!days[d])days[d]=[];days[d].push(m);}
  var sd=Object.keys(days).sort(function(a,b){var ap=a.split('/'),bp=b.split('/');var ma=parseInt(ap[0]),mb=parseInt(bp[0]),da=parseInt(ap[1]),db=parseInt(bp[1]);return ma!==mb?ma-mb:da-db;});
  var tD=gT(),tD2=String(parseInt(tD.split('/')[0]))+'/'+String(parseInt(tD.split('/')[1]));
  var h='';
  for(var di=0;di<sd.length;di++){
    var d=sd[di],ms=days[d];
    if(cF==='today'&&d!==tD&&d!==tD2)continue;
    if(cF==='changes')break;
    var isT=(d===tD||d===tD2);
    h+='<div class="day-head" style="font-size:12px;font-weight:700;padding:5px 0 2px;color:var(--gold)">'+(isT?'🔥 ':'')+d+' <span style="font-size:7px;color:var(--sub);font-weight:400">'+ms.length+'场</span></div><div class="pc-grid">';
    for(var mi2=0;mi2<ms.length;mi2++)h+=rC(ms[mi2],mi++);
    h+='</div>';
  }
  // Completed matches (collapsible)
  if(doneM.length){
    h+='<div class="day-head" style="font-size:12px;font-weight:700;padding:5px 0 2px;color:var(--sub);cursor:pointer;user-select:none" onclick="var p=this.nextElementSibling;var s=p.style.display;p.style.display=s===\'none\'?\'\':\'none\';this.textContent=this.textContent.startsWith(\'📋\')?\'▶ 已赛 ('+doneM.length+'场)\':\'📋 已赛 ('+doneM.length+'场)\'">📋 已赛 ('+doneM.length+'场)</div><div class="pc-grid" style="display:none">';
    for(var di=0;di<doneM.length;di++)h+=rC(doneM[di],mi++);
    h+='</div>';
  }
  if(cF==='changes'){
    var has=false;h='<div style="font-size:12px;font-weight:700;padding:5px 0 2px;color:var(--gold)">🔄 变化追踪</div>';
    for(var i=0;i<AM.length;i++){if(AM[i].changes&&AM[i].changes.length){has=true;h+=rC(AM[i],i);}}
    if(!has)h+='<div class="empty">暂无变化</div>';
  }
  return h;
}
function rC(m,mi){
  var al=m.analyses||[],l=al.length?al[al.length-1]:null,c=l?l.confidence:0;
  var id='m'+mi,hc=cn(m.home),ac=cn(m.away),hasNew=l&&l.isNew,rs=m.result?m.result.split('-'):null;
  var h='<div class="pc"><div class="pc-head" onclick="tM(\''+id+'\')"><span class="pc-ar" id="ar'+id+'">▶</span><span class="pc-tm"><span class="fl">'+fl(hc)+'</span>'+hc+'<span class="vs">vs</span><span class="fl">'+fl(ac)+'</span>'+ac+'</span>'+(rs?'<span class="pc-ti" style="color:var(--gold);font-weight:700;background:rgba(255,215,0,.06);padding:1px 6px;border-radius:4px;font-size:9px">'+m.result+'</span>':'<span class="pc-ti">'+(m.date||'')+' '+(m.time||'')+'</span>')+(c?gaugeHTML(c):'')+(hasNew?'<span class="nt">NEW</span>':'')+'</div><div class="pc-body" id="bd'+id+'">';
  if(m.changes){for(var ci=0;ci<m.changes.length;ci++){var cx=m.changes[ci];h+='<div class="chg" style="border-left-color:'+(cx.type==='good'?'var(--accent)':'var(--red)')+'">'+cx.icon+' <b>'+cx.label+'</b> '+cx.text+'</div>';}}
  if(l&&l.strategies){
    var sc=l.strategies,o=['conservative','balanced','aggressive'],cs={'conservative':'var(--c)','balanced':'var(--b)','aggressive':'var(--a)'};
    h+='<div class="scards">';
    for(var si=0;si<o.length;si++){
      var sk=o[si],x=sc[sk];if(!x)continue;
      h+='<div class="sc'+(sk===cS?' sel':'')+'" style="border-color:'+cs[sk]+'" onclick="var ops=document.querySelectorAll(\'.pc-body.open\');var oids=[];ops.forEach(function(o){oids.push(o.id.replace(\'bd\',\'\'))});cS=\'\'+sk+\'\';rP();setTimeout(function(){oids.forEach(function(id){var b=document.getElementById(\'bd\'+id);if(b&&!b.classList.contains(\'open\')){b.classList.add(\'open\');var a=document.getElementById(\'ar\'+id);if(a)a.classList.add(\'open\');var ph=b.previousElementSibling;if(ph)ph.classList.add(\'ex\');}});},50)"><span class="sl" style="color:'+cs[sk]+'">'+x.label+'</span><span class="sp">'+x.pick.replace(/@\s*\d+\.?\d*/g,'').trim()+'</span><span class="so" style="color:'+cs[sk]+'">@'+x.odds+'</span><span class="sr">¥'+x.per_100+'</span></div>';
    }
    h+='</div>';
  }
  // 可视化布局: 雷达图 + 概率条 + 进球区间 + 对位看板
  if(l&&l.deepAnalysis){var rd=calcRadar(m,l);var rid='rd'+mi;radarData[mi]=rd;var deep=l.deepAnalysis;
    var pH=deep.probHome||0,pD=deep.probDraw||0,pA=deep.probAway||0,hcName=cn(m.home),acName=cn(m.away);
    h+='<div class="vis-row">';
    // 左: 雷达图
    h+='<div class="vis-left"><canvas id="'+rid+'" width="170" height="155" style="width:100%;border-radius:6px" data-hc="'+hc+'" data-ac="'+ac+'" data-mi="'+mi+'"></canvas></div>';
    // 右: 概率条 + 进球区间
    h+='<div class="vis-right">';

// ===== 仪表盘SVG =====
function gaugeHTML(conf){
  var col=conf>=75?'var(--accent)':conf>=60?'var(--gold)':'var(--red)';
  var r=conf/100*180;
  var rad=Math.PI/180,x0=18,y0=32,radius=14;
  var start=-180,end=-180+r;
  function px(a){return x0+radius*Math.cos((a-90)*rad);}
  function py(a){return y0+radius*Math.sin((a-90)*rad);}
  var d='M'+px(start)+','+py(start)+' A'+radius+','+radius+' 0 '+(r>180?1:0)+',1 '+px(end)+','+py(end);
  var bg='M'+px(-180)+','+py(-180)+' A'+radius+','+radius+' 0 0,1 '+px(0)+','+py(0);
  return '<span class="gauge-wrap"><svg class="gauge-svg" viewBox="0 0 36 36"><path d="'+bg+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="3"></path><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linecap="round"></path></svg><span class="gauge-val" style="color:'+col+'">'+conf+'</span></span>';
}

// ===== 雷达图绘图函数 =====
var animLock={};
// ===== 信心趋势小折线 =====
function drawTrend(canvasId, confs, animated){
  var cv=document.getElementById(canvasId);if(!cv||!confs||confs.length<2)return;
  if(cv.offsetWidth===0){setTimeout(function(){drawTrend(canvasId,confs,animated);},200);return;}
  var dpr=window.devicePixelRatio||1;
  var w=36,h=16;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var cs=getComputedStyle(document.body);var accent=cs.getPropertyValue('--accent').trim()||'#00d4aa';
  function drawFrame(pct){
    ctx.clearRect(0,0,w,h);
    var n=confs.length,spacing=w/(n-1);
    // grid dots at full positions
    for(var i=0;i<n;i++){
      var x=i*spacing,y=h-2-(confs[i]/100)*(h-4);
      ctx.beginPath();ctx.arc(x,y,1.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();
    }
    // animated line
    var drawN=Math.max(2,Math.floor(1+(n-1)*pct));
    ctx.beginPath();
    for(var i=0;i<drawN;i++){
      var x=i*spacing,y=h-2-(confs[i]/100)*(h-4);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.stroke();
    // last dot bigger
    if(drawN>0){
      var lx=(drawN-1)*spacing,ly=h-2-(confs[drawN-1]/100)*(h-4);
      ctx.beginPath();ctx.arc(lx,ly,1.8,0,Math.PI*2);ctx.fillStyle=accent;ctx.fill();
    }
  }
  if(animated===false){drawFrame(1);return;}
  var startT=null,dur=400;
  function step(ts){
    if(!startT)startT=ts;
    var p=Math.min(1,(ts-startT)/dur);
    drawFrame(1-Math.pow(1-p,3));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function drawRadar(canvasId, homeLabel, awayLabel, homeData, awayData, animated){
  var cv=document.getElementById(canvasId);if(!cv)return;
  if(animLock[canvasId])return;
  if(animated===undefined)animated=true;
  var dpr=window.devicePixelRatio||1;
  var dispW=170,dispH=155;
  cv.width=dispW*dpr;cv.height=dispH*dpr;
  cv.style.width=dispW+'px';cv.style.height=dispH+'px';
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  var W=dispW, H=dispH, cx=W/2, cy=H/2, R=Math.min(cx,cy)-22;
  var cs=getComputedStyle(document.body);
  var textColor=cs.getPropertyValue('--text').trim()||'#e8e0f0';
  var bgColor='transparent';
  var gl=cs.getPropertyValue('--gold').trim()||'#f0b90b';
  var ac=cs.getPropertyValue('--accent').trim()||'#00c49a';
  var sub=cs.getPropertyValue('--sub').trim()||'#5f5b72';
  var labels=[['\u8FDB\u653B','ATK'],['\u9632\u5B88','DEF'],['\u63A7\u573A','MID'],['\u72B6\u6001','FRM'],['\u5173\u952E\u7403\u5458','KEY'],['\u6218\u672F','TAC']];
  var angles=[];for(var i=0;i<6;i++){angles.push((Math.PI*2*i/6)-Math.PI/2);}
  function drawFrame(t){
    ctx.clearRect(0,0,W,H);
    // Outer glow
    var grd=ctx.createRadialGradient(cx,cy,R*0.3,cx,cy,R*1.2);
    grd.addColorStop(0,'rgba(255,215,0,0)');
    grd.addColorStop(0.7,'rgba(255,215,0,0)');
    grd.addColorStop(1,'rgba(255,215,0,.03)');
    ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
    // Grid rings with labels
    for(var ring=1;ring<=4;ring++){
      var r=R*ring/4;
      ctx.beginPath();
      for(var i=0;i<=6;i++){var a=angles[i%6];var x=cx+r*Math.cos(a);var y=cy+r*Math.sin(a);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
      ctx.closePath();
      ctx.strokeStyle=ring===4?'rgba(255,215,0,.12)':'rgba(255,255,255,.04)';
      ctx.lineWidth=ring===4?1:.5;
      ctx.stroke();
      // Value labels on first axis
      if(ring%2===0){ctx.font='5px sans-serif';ctx.fillStyle='rgba(255,255,255,.08)';
        var lx=cx+r*Math.cos(angles[0]);var ly=cy+r*Math.sin(angles[0]);
        ctx.textAlign='center';ctx.fillText(ring*25,lx-8,ly+2);}
    }
    // Axis lines
    for(var i=0;i<6;i++){
      ctx.beginPath();ctx.moveTo(cx,cy);
      var x=cx+R*Math.cos(angles[i]);var y=cy+R*Math.sin(angles[i]);
      ctx.lineTo(x,y);ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=.5;ctx.stroke();
    }
    // Labels
    for(var i=0;i<6;i++){
      var a=angles[i];var x=cx+(R+9)*Math.cos(a);var y=cy+(R+9)*Math.sin(a);
      ctx.font='bold 6px sans-serif';ctx.fillStyle=textColor;ctx.textAlign='center';
      ctx.fillText(labels[i][0],x,y+2);
      ctx.font='5px sans-serif';ctx.fillStyle=sub;
      ctx.fillText(labels[i][1],x,y+8);
    }
    // Center label
    ctx.font='7px sans-serif';ctx.fillStyle='rgba(255,255,255,.05)';ctx.textAlign='center';ctx.fillText('6\u7EF4\u8BC4\u5206',cx,cy+2.5);
    // Plot
    var p=t;
    function plotTeam(data,color,fillColor,label){
      ctx.beginPath();
      for(var i=0;i<=6;i++){var idx=i%6;var a2=angles[idx];var val=((data[idx]||0)/100)*p;var x2=cx+R*val*Math.cos(a2);var y2=cy+R*val*Math.sin(a2);i===0?ctx.moveTo(x2,y2):ctx.lineTo(x2,y2);}
      ctx.closePath();
      ctx.fillStyle=fillColor;ctx.fill();
      ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.shadowColor=color;ctx.shadowBlur=4;
      ctx.stroke();ctx.shadowBlur=0;
      for(var i=0;i<6;i++){var a2=angles[i];var val=((data[i]||0)/100)*p;var x2=cx+R*val*Math.cos(a2);var y2=cy+R*val*Math.sin(a2);
        ctx.beginPath();ctx.arc(x2,y2,2,0,Math.PI*2);
        ctx.fillStyle='#fff';ctx.fill();
        ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
        ctx.font='5px sans-serif';ctx.fillStyle=color;ctx.textAlign='center';
        var valText=Math.round(data[i]);
        ctx.fillText(valText,x2,y2-5);
      }
    }
    // Draw away first (behind), then home (front)
    plotTeam(awayData,'rgba(255,215,0,.5)','rgba(255,215,0,.08)',awayLabel);
    plotTeam(homeData,'rgba(0,212,170,.6)','rgba(0,212,170,.1)',homeLabel);
    // Legend
    ctx.font='bold 6px sans-serif';ctx.textAlign='left';
    ctx.fillStyle='rgba(0,212,170,.6)';ctx.fillRect(6,5,8,8);
    ctx.strokeStyle='rgba(0,212,170,.6)';ctx.strokeRect(6,5,8,8);
    ctx.fillStyle=textColor;ctx.fillText(homeLabel,16,12);
    ctx.fillStyle='rgba(255,215,0,.6)';ctx.fillRect(6,16,8,8);
    ctx.strokeStyle='rgba(255,215,0,.6)';ctx.strokeRect(6,16,8,8);
    ctx.fillStyle=textColor;ctx.fillText(awayLabel,16,23);
  }
  if(!animated){drawFrame(1);return;}
  var startT=null,dur=600;
  animLock[canvasId]=true;
  function step(ts){
    if(!startT)startT=ts;
    var elapsed=ts-startT,p2=Math.min(1,elapsed/dur);
    var ease=1-Math.pow(1-p2,3);
    drawFrame(ease);
    if(p2<1){requestAnimationFrame(step);}else{animLock[canvasId]=false;}
  }
  requestAnimationFrame(step);
}// ===== 计算简易6维雷达数据 =====
function calcRadar(match,analysis){
  var deep=analysis&&analysis.deepAnalysis?analysis.deepAnalysis:{};
  var pH=deep.probHome||50,pA=deep.probAway||50;
  var rankH=deep.fifaRankHome||50,rankA=deep.fifaRankAway||50;
  var strengthH=Math.max(20,Math.min(95,100-rankH*1.2+10));
  var strengthA=Math.max(20,Math.min(95,100-rankA*1.2+10));
  var home=[
    Math.round((strengthH+pH)/2),
    Math.round((100-rankH*0.8+pH*0.3)/1.3),
    Math.round((strengthH+pH*0.6)/1.6),
    Math.round(50+Math.random()*30),
    Math.round(strengthH*0.7+30),
    Math.round(60+Math.random()*25)
  ];
  var away=[
    Math.round((strengthA+pA)/2),
    Math.round((100-rankA*0.8+pA*0.3)/1.3),
    Math.round((strengthA+pA*0.6)/1.6),
    Math.round(50+Math.random()*30),
    Math.round(strengthA*0.7+30),
    Math.round(60+Math.random()*25)
  ];
  return {home:home,away:away};
}


// ===== STANDINGS VIEW =====
function rSt(){
  var el=document.getElementById('stC');
  if(!AM.length){el.innerHTML='<div class="empty">暂无数据</div>';return;}
  // Group matches by group
  var groups={};
  for(var i=0;i<AM.length;i++){
    var m=AM[i],g=m.group||'?';
    if(!groups[g])groups[g]=[];
    groups[g].push(m);
  }
  var h='<div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--gold)">🏆 积分榜</div>';
  var gKeys=Object.keys(groups).sort();
  for(var gi=0;gi<gKeys.length;gi++){
    var g=gKeys[gi],ms=groups[g];
    // Calculate standings
    var teams={};
    for(var i=0;i<ms.length;i++){
      var m=ms[i],hc=cn(m.home),ac=cn(m.away);
      if(!teams[hc])teams[hc]={name:hc,played:0,won:0,drawn:0,lost:0,gd:0,pts:0};
      if(!teams[ac])teams[ac]={name:ac,played:0,won:0,drawn:0,lost:0,gd:0,pts:0};
      if(m.result){
        var parts=m.result.split('-'),hgoals=parseInt(parts[0])||0,agoals=parseInt(parts[1])||0;
        teams[hc].played++;teams[ac].played++;
        teams[hc].gd+=hgoals-agoals;teams[ac].gd+=agoals-hgoals;
        if(hgoals>agoals){teams[hc].won++;teams[hc].pts+=3;teams[ac].lost++;}
        else if(hgoals<agoals){teams[ac].won++;teams[ac].pts+=3;teams[hc].lost++;}
        else{teams[hc].drawn++;teams[ac].drawn++;teams[hc].pts++;teams[ac].pts++;}
      }
    }
    var sorted=Object.values(teams).sort(function(a,b){
      if(b.pts!==a.pts)return b.pts-a.pts;
      if(b.gd!==a.gd)return b.gd-a.gd;
      return 0;
    });
    h+='<div class="st-group"><div class="st-group-title">'+g+'组</div>';
    h+='<table class="st-table"><thead><tr><th>#</th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>净胜</th><th>积分</th></tr></thead><tbody>';
    for(var ti=0;ti<sorted.length;ti++){
      var t=sorted[ti],rank=ti+1;
      var rCls=rank<=2?'st-rank':'';
      h+='<tr><td class="'+rCls+'">'+rank+'</td><td class="st-team"><span class="fl">'+fl(t.name)+'</span>'+t.name+'</td><td>'+t.played+'</td><td>'+t.won+'</td><td>'+t.drawn+'</td><td>'+t.lost+'</td><td>'+(t.gd>0?'+':'')+t.gd+'</td><td class="st-pts">'+t.pts+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  el.innerHTML=h;
}

    var m=AM[i];

      done++;var parts=m.result.split('-'),hg=parseInt(parts[0])||0,ag=parseInt(parts[1])||0;
      totalGoals+=hg+ag;

    }else{upcoming++;}
  }
  var avgGoals=done>0?(totalGoals/done).toFixed(1):'-';

function rADFilter(){
  var fromVal=document.getElementById('mdcFrom').value;

  if(!fromVal||!toVal)return;
  var fromParts=fromVal.split('-'),toParts=toVal.split('-');
  var fromStr=String(parseInt(fromParts[1]))+'/'+String(parseInt(fromParts[2]));
  var toStr=String(parseInt(toParts[1]))+'/'+String(parseInt(toParts[2]));

  var toM=parseInt(toParts[1]),toD=parseInt(toParts[2]);

  var filtered=[];
  for(var i=0;i<AM.length;i++){
    var m=AM[i];
    if(!m.date)continue;
    var dp=m.date.split('/');if(dp.length<2)continue;
    var dm=parseInt(dp[0]),dd=parseInt(dp[1]);
    var after=(dm>fromM||(dm===fromM&&dd>=fromD));
    var before=(dm<toM||(dm===toM&&dd<=toD));
    if(after&&before)filtered.push(m);
  }
  if(!filtered.length){
    document.getElementById('mdcResult').innerHTML='<div class="empty">该日期范围内无比赛</div>';

    var ap=a.date.split('/'),bp=b.date.split('/');
    var ma=parseInt(ap[0]),da=parseInt(ap[1]),mb=parseInt(bp[0]),db=parseInt(bp[1]);
    if(ma!==mb)return ma-mb;
    if(da!==db)return da-db;
    return (a.time||'').localeCompare(b.time||'');
  });
  var h='<div style="font-size:8px;color:var(--sub);margin-bottom:4px">共 '+filtered.length+' 场比赛</div>';
  h+='<table class="mdc-table"><thead><tr><th>日期</th><th>时间</th><th>主队</th><th>vs</th><th>客队</th><th>主胜</th><th>平</th><th>客胜</th><th>推荐</th><th>信心</th></tr></thead><tbody>';
  for(var i=0;i<filtered.length;i++){
    var m=filtered[i],hc=cn(m.home),ac=cn(m.away);
    var a=m.analyses&&m.analyses.length?m.analyses[m.analyses.length-1]:null;
    var spf={},rec='',conf='-',cClass='';

      if(a.strategies){
        var skey=cS||'balanced',f=a.strategies[skey];
        if(f)rec=f.pick;
        else{

    h+='<tr><td>'+m.date+'</td><td>'+(m.time||'-')+'</td><td><span class="fl">'+fl(hc)+'</span>'+hc+'</td><td style="color:var(--sub);font-size:6px">vs</td><td><span class="fl">'+fl(ac)+'</span>'+ac+'</td><td>'+hOdds+'</td><td>'+(dOdds)+'</td><td>'+aOdds+'</td><td style="font-size:6px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+rec+'</td><td class="mdc-conf '+cClass+'">'+conf+'</td></tr>';

function diffText(a,b){
  var parts=[];
  if(!a||!b)return parts;
  var ra=a.deepAnalysis?a.deepAnalysis.predictedResult:'';
  var rb=b.deepAnalysis?b.deepAnalysis.predictedResult:'';
  if(ra&&rb&&ra!==rb)parts.push('\u25B6 \u9884\u6D4B\u65B9\u5411 ['+ra+'] \u2192 ['+rb+']');
  if(a.confidence!==undefined&&b.confidence!==undefined&&a.confidence!==b.confidence){
    var dir=b.confidence>a.confidence?'\u2191\u5347\u81F3':'\u2193\u964D\u81F3';
    parts.push('\u25B6 \u4FE1\u5FC3 '+a.confidence+'% \u2192 '+b.confidence+'% ('+dir+')');
  }
  var sa=a.possibleScores||[],sb=b.possibleScores||[];
  if(sa.length&&sb.length&&JSON.stringify(sa)!==JSON.stringify(sb)){
    parts.push('\u25B6 \u6CE2\u80C6 ['+sa.join(',')+'] \u2192 ['+sb.join(',')+']');
  }
  var ga=a.deepAnalysis?a.deepAnalysis.goalRange:'';
  var gb=b.deepAnalysis?b.deepAnalysis.goalRange:'';
  if(ga&&gb&&ga!==gb)parts.push('\u25B6 \u603B\u8FDB\u7403 ['+ga+'] \u2192 ['+gb+']');
  if(a.text&&b.text&&a.text!==b.text)parts.push('\u25B6 \u5206\u6790\u8981\u70B9\u6709\u8C03\u6574');
  return parts;
}

      aOdds=Math.max(1.05,Math.round(aEuro*0.75*100)/100);
    }
    // Fallback: from strategies
    if(!hOdds&&strs.conservative)hOdds=strs.conservative.odds;
    if(!dOdds&&strs.balanced)dOdds=strs.balanced.odds;
    if(!aOdds&&strs.aggressive){
      // Don't use aggressive odds for away - it's probably correct score
      aOdds=6.0;
    }
    // Ensure minimum values
    if(!hOdds||hOdds<1)hOdds=1.5;
    if(!dOdds||dOdds<1)dOdds=3.5;
    if(!aOdds||aOdds<1)aOdds=6.0;
    
    h+='<div class="bv-item">';
    h+='<div style="display:flex;align-items:center;margin-bottom:4px;gap:4px">';
    h+='<div style="flex:1;font-size:8px;font-weight:600"><span class="fl">'+fl(hc)+'</span>'+hc+' <span style="color:var(--sub)">vs</span> <span class="fl">'+fl(ac)+'</span>'+ac+'</div>';
    h+='<div style="font-size:6px;color:var(--sub)">'+m.date+' '+m.time+'</div>';
    h+='</div>';
    
    // === SPF row (all 3 outcomes, always shown) ===
    h+='<div style="display:flex;gap:3px;margin-bottom:3px">';
    var bIdH=m.home+m.away+'_spf_h',bIdD=m.home+m.away+'_spf_d',bIdA=m.home+m.away+'_spf_a';
    var bSelH=selParlay[bIdH]?'2px solid var(--c)':'1px solid var(--card-border)';
    var bSelD=selParlay[bIdD]?'2px solid var(--b)':'1px solid var(--card-border)';
    var bSelA=selParlay[bIdA]?'2px solid var(--a)':'1px solid var(--card-border)';
    var bBgH=selParlay[bIdH]?'rgba(0,212,170,.12)':'transparent';
    var bBgD=selParlay[bIdD]?'rgba(255,215,0,.12)':'transparent';
    var bBgA=selParlay[bIdA]?'rgba(232,65,66,.12)':'transparent';
    h+='<div class="odds-btn" style="border:'+bSelH+';background:'+bBgH+'" onclick="var k=\''+bIdH+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\''+hc+'\u80dc\',odds:'+hOdds+'}};rB()"><div class="lb">'+hc+'\u80dc</div><div class="od" style="color:var(--c)">@'+hOdds+'</div></div>';
    h+='<div class="odds-btn" style="border:'+bSelD+';background:'+bBgD+'" onclick="var k=\''+bIdD+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\''+hc+'\u5e73'+ac+'\',odds:'+dOdds+'}};rB()"><div class="lb">\u5e73\u5c40</div><div class="od" style="color:var(--b)">@'+dOdds+'</div></div>';
    h+='<div class="odds-btn" style="border:'+bSelA+';background:'+bBgA+'" onclick="var k=\''+bIdA+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\''+ac+'\u80dc\',odds:'+aOdds+'}};rB()"><div class="lb">'+ac+'\u80dc</div><div class="od" style="color:var(--a)">@'+aOdds+'</div></div>';
    h+='</div>';
    
    // === Strategy recommendations row ===
    h+='<div style="display:flex;gap:2px;flex-wrap:wrap">';
    var skList=['conservative','balanced','aggressive'];
    var sC={'conservative':'var(--c)','balanced':'var(--b)','aggressive':'var(--a)'};
    var sL={'conservative':'\u4fdd\u5b88','balanced':'\u5747\u8861','aggressive':'\u6fc0\u8fdb'};
    for(var si=0;si<skList.length;si++){
      var sk=skList[si],opt=strs[sk];if(!opt)continue;
      var sId=m.home+m.away+'_'+sk;
      var sSel=selParlay[sId]?'2px solid '+sC[sk]:'1px solid var(--card-border)';
      var sBg=selParlay[sId]?sC[sk]+'15':'transparent';
      h+='<div class="odds-btn" style="border:'+sSel+';background:'+sBg+';min-width:70px;flex:0" onclick="var k=\''+sId+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\''+(opt.pick.replace(/[\'"]/g,''))+'\',odds:'+opt.odds+'}};rB()">';
      h+='<div class="lb" style="color:'+sC[sk]+';font-size:6px">'+sL[sk]+'</div>';
      h+='<div class="od" style="color:'+sC[sk]+';font-size:9px">@'+opt.odds+'</div>';
      h+='<div class="sub" style="font-size:5px;opacity:.8">'+(opt.pick.length>8?opt.pick.substring(0,8):opt.pick)+'</div>';
      h+='</div>';
    }
    // Handicap option (if available)
    var rq=jc.rangqiu||{};
    // rangqiu format: {teamName: {odds, handicap}, teamName: {odds, handicap}} or {handicap: -, '3': odds}
    var rqFirst=null;
    for(var rk in rq){if(typeof rq[rk]==='object'&&rq[rk].odds){rqFirst=rq[rk];break;}}
    if(!rqFirst&&rq.handicap!==undefined&&rq['3']){rqFirst={handicap:rq.handicap,odds:rq['3']};}
    if(rqFirst&&rqFirst.odds>1){
      var rId=m.home+m.away+'_rq';
      var rSel=selParlay[rId]?'2px solid var(--b)':'1px solid var(--card-border)';
      var rBg=selParlay[rId]?'rgba(255,215,0,.08)':'transparent';
      var hcLabel=Math.abs(rqFirst.handicap);
      h+='<div class="odds-btn" style="border:'+rSel+';background:'+rBg+';min-width:60px;flex:0" onclick="var k=\''+rId+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\''+hc+'\u8ba9'+(rqFirst.handicap>0?'+':'')+hcLabel+'\u80dc\',odds:'+rqFirst.odds+'}};rB()">';
      h+='<div class="lb" style="color:var(--b)">\u8ba9\u7403</div>';
      h+='<div class="od" style="color:var(--b);font-size:8px">@'+rqFirst.odds+'</div>';
      h+='<div class="sub" style="font-size:5px">'+(rqFirst.handicap>0?'+':'')+hcLabel+'</div>';
      h+='</div>';
    }
    // Over/under from jingcai total_goals
    var tg=jc.total_goals||{};
    var underOdds=tg['0']||tg['1']||tg['2']||0;
    if(typeof underOdds==='number'&&underOdds<1){
      // Calculate under 2.5 from combined prob
      var p=0;var ck=['0','1','2'];
      for(var ui=0;ui<ck.length;ui++){if(tg[ck[ui]]>1)p+=1/tg[ck[ui]];}
      if(p>0)underOdds=Math.round(1/p*100)/100;
    }
    if(underOdds>1){
      var uId=m.home+m.away+'_under';
      var uSel=selParlay[uId]?'2px solid var(--c)':'1px solid var(--card-border)';
      var uBg=selParlay[uId]?'rgba(0,212,170,.08)':'transparent';
      h+='<div class="odds-btn" style="border:'+uSel+';background:'+uBg+';min-width:55px;flex:0" onclick="var k=\''+uId+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\'\u603b\u8fdb\u7403<2.5\',odds:'+underOdds+'}};rB()">';
      h+='<div class="lb" style="color:var(--c)">\u5c0f\u7403</div>';
      h+='<div class="od" style="color:var(--c);font-size:8px">@'+underOdds+'</div>';
      h+='</div>';
    }
    // Over 2.5
    var overOdds=jc.over_under?jc.over_under['Over 2.5']||jc.over_under['Over']||0:0;
    if(typeof overOdds==='number'&&overOdds<1){
      var p2=0;var ck2=['3','4','5','6_plus'];
      for(var oi=0;oi<ck2.length;oi++){if(tg[ck2[oi]]>1)p2+=1/tg[ck2[oi]];}
      if(p2>0)overOdds=Math.round(1/p2*100)/100;
    }
    if(overOdds>1){
      var oId=m.home+m.away+'_over';
      var oSel=selParlay[oId]?'2px solid var(--a)':'1px solid var(--card-border)';
      var oBg=selParlay[oId]?'rgba(232,65,66,.08)':'transparent';
      h+='<div class="odds-btn" style="border:'+oSel+';background:'+oBg+';min-width:55px;flex:0" onclick="var k=\''+oId+'\';if(selParlay[k]){delete selParlay[k];}else{selParlay[k]={pick:\'\u603b\u8fdb\u7403>2.5\',odds:'+overOdds+'}};rB()">';
      h+='<div class="lb" style="color:var(--a)">\u5927\u7403</div>';
      h+='<div class="od" style="color:var(--a);font-size:8px">@'+overOdds+'</div>';
      h+='</div>';
    }
    h+='</div></div>';
  }
  
  // Bet slip
  var pKeys=Object.keys(selParlay),pOdds=1,pCount=pKeys.length,ptxt='';
  for(var pi=0;pi<pKeys.length;pi++){
    var item=selParlay[pKeys[pi]];if(!item)continue;
    pOdds*=item.odds;ptxt+=item.pick+(pi<pKeys.length-1?' \u00d7 ':'');
  }
  pOdds=Math.round(pOdds*100)/100;
  var pRet=Math.round(100*pOdds);
  h+='<div class="bet-slip"><div style="display:flex;align-items:center;margin-bottom:4px">';
  h+='<span style="font-size:9px;font-weight:700;color:var(--gold)">\ud83d\udccb \u6295\u6ce8\u5355</span>';
  h+='<span style="margin-left:auto;font-size:6px;color:var(--sub)">'+(pCount>0?pCount+'\u9879':'\uff08\u7a7a\uff09')+'</span>';
  h+='</div>';
  if(pCount>0){
    for(var pi=0;pi<pKeys.length;pi++){
      var k=pKeys[pi],item=selParlay[k];if(!item)continue;
      h+='<div class="bet-slip-item">';
      h+='<div class="bet-slip-remove" onclick="delete selParlay[\''+k+'\'];rB()">\u2715</div>';
      h+='<span style="flex:1">'+item.pick+'</span>';
      h+='<span style="color:var(--gold);font-weight:600">@'+item.odds+'</span>';
      h+='</div>';
    }
    h+='<div class="bet-summary"><span>'+(isParlay?'\u4e32\u5173\u8d54\u7387':'\u5355\u5173\u8d54\u7387')+'</span><span class="val" style="color:var(--gold)">'+pOdds+'\u500d</span></div>';
    h+='<div class="bet-summary" style="border-top:1px solid var(--card-border);padding-top:4px"><span>\u6bcf100\u5143\u56de\u62a5</span><span class="val" style="color:var(--accent)">\u00a5'+pRet+'</span></div>';
    h+='<button class="bvp-btn" onclick="cP()" style="margin-top:4px">'+(isParlay?'\u751f\u6210\u4e32\u5173\u6295\u6ce8\u5355':'\u751f\u6210\u5355\u5173\u6295\u6ce8\u5355')+'</button>';
    h+='<div style="margin-top:2px;text-align:right"><span style="font-size:6px;color:var(--sub);cursor:pointer" onclick="selParlay={};rB()">\u6e05\u7a7a\u5168\u90e8</span></div>';
  }else{
    h+='<div style="font-size:7px;color:var(--sub);padding:6px 0;text-align:center">\u70b9\u51fb\u4e0a\u65b9\u8d54\u7387\u52a0\u5165\u6295\u6ce8\u5355</div>';
  }
  h+='</div></div>';
  el.innerHTML=h;
}
function togPO(el,mid){
  el.classList.toggle('ckd');
  var opt=el.getAttribute('data-opt');
  if(!opt)return;
  var parts=opt.split(':');
  var pick=parts[0],odds=parseFloat(parts[1]);
  if(!odds)return;
  // Update selParlay for this match
  if(el.classList.contains('ckd')){
    selParlay[mid+'_'+pick]={pick:pick+'@'+odds,odds:odds};
  }else{
    delete selParlay[mid+'_'+pick];
  }
  rB();
}
function togP(id,pick,odds,el,stra){
  if(selParlay[id]){delete selParlay[id];}else{selParlay[id]={pick:pick,odds:parseFloat(odds),strategy:stra||""};}
  rB();
}
function cP(){
  var pKeys=Object.keys(selParlay);
  if(pKeys.length<1)return;
  var isParlay=typeof selMode==="undefined"?true:selMode;
  if(isParlay&&pKeys.length<2)return;
  var pOdds=1,txt="",details=[];
  for(var i=0;i<pKeys.length;i++){
    var item=selParlay[pKeys[i]];if(!item)continue;
    pOdds*=item.odds;
    txt+=item.pick+(i<pKeys.length-1?" × ":"");
    var stratLabel="";
    var k=pKeys[i];
    if(k.indexOf("_conservative_")>0)stratLabel="保守";
    else if(k.indexOf("_balanced_")>0)stratLabel="均衡";
    else if(k.indexOf("_aggressive_")>0)stratLabel="激进";
    details.push(item.pick+" @"+item.odds+(stratLabel?" ("+stratLabel+")":""));
  }
  pOdds=Math.round(pOdds*100)/100;
  var ret=Math.round(100*pOdds);
  var mode=isParlay?"串关":"单关";
  alert("🎯 "+mode+"投注方案\n\n"+details.join("\n")+"\n\n赔率: "+pOdds+"倍\n每100元回报: ¥"+ret+"\n\n⚠️ 请理性投注");
}

function tM(id){var b=document.getElementById('bd'+id);if(!b)return;b.classList.toggle('open');var ar=document.getElementById('ar'+id);if(ar)ar.classList.toggle('open');b.previousElementSibling.classList.toggle('ex');
if(!b.classList.contains('open'))return;
// Animate radar
var cv=b.querySelector('canvas:not(.tg-canvas)');var mi=cv?parseInt(cv.getAttribute('data-mi')):-1;
var rd=mi>=0?radarData[mi]:null;
if(cv&&rd){drawRadar(cv.id,cv.getAttribute('data-hc'),cv.getAttribute('data-ac'),rd.home,rd.away,true);}
// Animate trend chart
var tcv=b.closest('.pc').querySelector('.tg-canvas');
if(tcv){var ti=parseInt(tcv.id.replace('tg',''));var obj=AM.filter(function(m){return m.date===gT()||m.date===String(parseInt(gT().split('/')[0]))+'/'+String(parseInt(gT().split('/')[1]));});if(obj.length>ti){var al=obj[ti].analyses||[];var confs=al.slice().sort(function(a,b){return a.time>b.time?1:-1;}).map(function(a){return a.confidence||0});if(confs.length>=2)drawTrend(tcv.id,confs,true);}}
// Animate probability bars and goal range
setTimeout(function(){
  var fills=b.querySelectorAll('.pbar-fill');
  for(var fi=0;fi<fills.length;fi++){var w=fills[fi].getAttribute('data-w');if(w){void fills[fi].offsetHeight;fills[fi].style.width=w+'%';}}
  var hl=b.querySelector('.grange-highlight');
  if(hl){var gl=parseFloat(hl.getAttribute('data-gl')),gh=parseFloat(hl.getAttribute('data-gh'));if(!isNaN(gl)&&!isNaN(gh)){var lp=gl/7*100,rp=(1-gh/7)*100;hl.style.left=lp+'%';hl.style.width=(100-lp-rp)+'%';}}
},100);}
function tJ(btn){var p=btn.nextElementSibling;p.classList.toggle('open');btn.textContent=p.classList.contains('open')?'⬆️ 收起竞彩':'⬇️ 展开竞彩';}
function sFR(tit,time,enc){
  var r=decodeURIComponent(enc);
  var m=document.createElement('div');
  m.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:'+(document.body.classList.contains('light')?'rgba(200,190,170,.7)':'rgba(0,0,0,.7)')+';z-index:100;overflow-y:auto;padding:12px 6px';
  var box=document.createElement('div');
  box.style.cssText='max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--gold);border-radius:8px;padding:12px;position:relative';
  var closeBtn=document.createElement('button');
  closeBtn.textContent='X';
  closeBtn.style.cssText='position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.05);border:none;color:var(--sub);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center';
  closeBtn.onclick=function(){m.remove();};
  box.appendChild(closeBtn);
  var titDiv=document.createElement('div');
  titDiv.style.cssText='font-size:12px;font-weight:700;margin-bottom:6px;padding-right:20px;color:var(--gold)';
  titDiv.textContent=tit+' - '+time;
  box.appendChild(titDiv);
  var bodyDiv=document.createElement('div');
  bodyDiv.style.cssText='font-size:10px;line-height:1.6;all:initial';
  bodyDiv.innerHTML='<div style="font-family:-apple-system,\'PingFang SC\',sans-serif;font-size:10px;line-height:1.6;color:var(--text)">'+r+'</div>';
  box.appendChild(bodyDiv);
  m.appendChild(box);
  document.body.appendChild(m);
  m.onclick=function(e){if(e.target===m)m.remove()};
}function swV(v,btn){
  cV=v;
  document.querySelectorAll('.top-nav-btn').forEach(function(b){b.classList.remove('active')});
  if(btn)btn.classList.add('active');
  var views=['vPred','vAna','vBet','vStandings','vSchedule','vData'];
  for(var vi=0;vi<views.length;vi++){
    var el=document.getElementById(views[vi]);
    if(el)el.className=(views[vi]==='v'+v.charAt(0).toUpperCase()+v.slice(1)?'':'hide');
  }
  document.getElementById('ab').style.display=(v==='bet'||v==='standings'||v==='schedule'||v==='data'?'none':'');
  if(v==='pred'){var oids=[];document.querySelectorAll('.pc-body.open').forEach(function(o){oids.push(o.id.replace('bd',''))});rP();setTimeout(function(){oids.forEach(function(id){var b2=document.getElementById('bd'+id);if(b2&&!b2.classList.contains('open')){b2.classList.add('open');var a2=document.getElementById('ar'+id);if(a2)a2.classList.add('open');var ph2=b2.previousElementSibling;if(ph2)ph2.classList.add('ex');}});},50);}
  else if(v==='ana')rA();
  else if(v==='bet')rB();
  else if(v==='standings')rSt();
  else if(v==='schedule')rSch();
  else if(v==='data')rData();
}function fil(f,btn){cF=f;document.getElementById('vPred').querySelectorAll('.sub-btn').forEach(function(b){b.classList.remove('active')});if(btn)btn.classList.add('active');rP();}
function swAV(v,btn){cAv=v;document.getElementById('vAna').querySelectorAll('.sub-btn').forEach(function(b){b.classList.remove('active')});if(btn)btn.classList.add('active');rA();}
function tt(){document.body.classList.toggle('light');var isLight=document.body.classList.contains('light');document.getElementById('tb').textContent=isLight?'☀️':'🌙';localStorage.setItem('wcT',isLight?'l':'d');setTimeout(function(){document.querySelectorAll('canvas').forEach(function(cv){cv.width=cv.width});},50)}
if(localStorage.getItem('wcT')==='l'){document.body.classList.add('light');document.getElementById('tb').textContent='☀️';}

function uN(){var n=new Date();var nx=new Date(n);nx.setHours(Math.floor(n.getHours()/8)*8+8,0,0,0);document.getElementById('nU').textContent=nx.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
uN();setInterval(uN,60000);
ld();
