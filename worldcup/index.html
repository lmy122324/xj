<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏆 2026世界杯 · AI预测系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0a1a;--card:#141128;--card-border:#2a2040;
  --accent:#00d4aa;--gold:#ffd700;--gold-light:#ffed80;--gold-dark:#b8960f;
  --red:#ff4757;--text:#e8e0f0;--sub:#7a7090;
  --conservative:#00d4aa;--balanced:#ffd700;--aggressive:#ff4757;
}
.light{
  --bg:#f5f0e8;--card:#fffaf0;--card-border:#d4c8a8;
  --accent:#00a88a;--gold:#b8860b;--gold-light:#daa520;--gold-dark:#8b6914;
  --red:#d63031;--text:#2d2010;--sub:#8a7a5a;
}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  line-height:1.5;transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}

/* ===== HEADER ===== */
.header{text-align:center;padding:14px 10px 8px;background:linear-gradient(180deg,#1a1040,#0c0a1a);border-bottom:1px solid var(--card-border);position:relative}
.light .header{background:linear-gradient(180deg,#f0e8d8,#f5f0e8)}
.header::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--accent),var(--gold),transparent)}
.header h1{font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold-light),var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px}
.header .sub{font-size:8px;color:var(--sub);margin-top:1px;letter-spacing:.5px}
.theme-btn{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.05);border:1px solid var(--card-border);border-radius:16px;padding:3px 10px;color:var(--sub);cursor:pointer;font-size:8px;font-weight:600;z-index:2}

/* ===== TOP NAV ===== */
.top-nav{display:flex;align-items:center;padding:4px 6px;background:rgba(255,255,255,.015);border-bottom:1px solid var(--card-border);gap:3px;flex-wrap:wrap;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.top-nav-btn{padding:4px 10px;border-radius:14px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:9px;font-weight:600;transition:.15s;white-space:nowrap}
.top-nav-btn:hover{border-color:var(--gold);color:var(--gold)}
.top-nav-btn.active{background:rgba(255,215,0,.1);border-color:var(--gold);color:var(--gold)}
.top-nav-spacer{flex:1}
.strat-btn{padding:3px 10px;border-radius:14px;border:1px solid var(--accent);background:rgba(0,212,170,.06);color:var(--accent);cursor:pointer;font-size:8px;font-weight:700;white-space:nowrap}
.strat-dd{display:none;position:absolute;top:100%;right:0;z-index:50;background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:3px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.4);margin-top:3px}
.strat-dd.open{display:block}
.strat-opt{display:block;width:100%;text-align:left;padding:5px 8px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:9px;border-radius:4px}
.strat-opt:hover{background:rgba(255,215,0,.04)}
.strat-opt.active{background:rgba(0,212,170,.06)}
.strat-opt .sl{font-weight:700;font-size:10px}
.strat-opt .sd{font-size:7px;color:var(--sub);display:block}

/* ===== ACCURACY ===== */
.acc-bar{margin:3px 6px;padding:6px 10px;background:rgba(255,215,0,.03);border:1px solid rgba(255,215,0,.08);border-radius:8px;font-size:8px}
.acc-bar .at{font-size:10px;font-weight:700;color:var(--gold);margin-bottom:2px}
.acc-bar .as{display:flex;gap:8px;flex-wrap:wrap}
.acc-bar .ai{text-align:center;min-width:50px}
.acc-bar .ai .n{font-size:14px;font-weight:900}
.acc-bar .ai .l{font-size:7px;color:var(--sub)}
.acc-bar .note{font-size:7px;color:var(--sub);margin-top:2px;opacity:.6}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin:0 1px}
.dot.up{background:var(--accent)}.dot.down{background:var(--red)}.dot.flat{background:var(--gold)}

/* ===== SUB NAV ===== */
.sub-nav{display:flex;gap:3px;padding:3px 6px;flex-wrap:wrap;border-bottom:1px solid var(--card-border)}
.sub-btn{padding:3px 10px;border-radius:12px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:8px;font-weight:600;transition:.15s}
.sub-btn:hover{border-color:var(--accent);color:var(--accent)}
.sub-btn.active{background:rgba(0,212,170,.08);border-color:var(--accent);color:var(--accent)}

/* ===== STATUS ===== */
.status-bar{display:flex;justify-content:space-between;padding:4px 8px;background:rgba(255,215,0,.02);border:1px solid rgba(255,215,0,.06);border-radius:6px;margin:3px 0;font-size:7px;color:var(--sub)}

/* ===== CONTAINER ===== */
.container{max-width:720px;margin:0 auto;padding:3px 6px 60px}

/* ===== PREDICT CARD ===== */
.pc{border:1px solid var(--card-border);border-radius:10px;margin-bottom:5px;background:linear-gradient(135deg,var(--card),rgba(255,215,0,.01));overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.pc-head{padding:7px 10px;display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.pc-head:hover{background:rgba(255,215,0,.015)}
.pc-head.ex{border-bottom:1px solid rgba(255,215,0,.06);background:rgba(255,215,0,.02)}
.pc-ar{font-size:7px;color:var(--gold);transition:transform .2s;flex-shrink:0;opacity:.4}
.pc-ar.open{transform:rotate(90deg);opacity:1}
.pc-tm{flex:1;font-size:12px;font-weight:700}
.pc-tm .fl{font-size:16px;margin-right:2px}
.pc-tm .vs{color:var(--sub);font-size:8px;margin:0 2px;font-weight:400}
.pc-ti{font-size:7px;color:var(--sub);white-space:nowrap}
.pc-cb{padding:1px 5px;border-radius:8px;font-size:7px;font-weight:700}
.pch{background:rgba(0,212,170,.1);color:var(--accent);border:1px solid rgba(0,212,170,.12)}
.pcm{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.12)}
.pcl{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.12)}
.nt{display:inline-block;padding:1px 4px;border-radius:5px;background:linear-gradient(135deg,var(--red),#ff6b81);color:#fff;font-size:6px;font-weight:700;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sb{padding:1px 5px;border-radius:6px;font-size:6px;font-weight:700;margin-left:2px}
.sbc{background:rgba(0,212,170,.1);color:var(--accent);border:1px solid rgba(0,212,170,.12)}
.sbb{background:rgba(255,215,0,.1);color:var(--gold);border:1px solid rgba(255,215,0,.12)}
.sba{background:rgba(255,71,87,.1);color:var(--red);border:1px solid rgba(255,71,87,.12)}

.pc-body{padding:5px 10px;display:none}
.pc-body.open{display:block}

/* ===== STRAT CARDS ===== */
.scards{display:flex;gap:3px;margin-bottom:4px;flex-wrap:wrap}
.sc{flex:1;min-width:90px;padding:5px 6px;border-radius:6px;cursor:pointer;text-align:center;border:1px solid transparent;background:rgba(255,215,0,.015);transition:.15s}
.sc:hover{transform:translateY(-1px)}
.sc.sel{border-color:var(--gold)}
.sc .sl{font-size:8px;font-weight:700;display:block}
.sc .sp{font-size:9px;font-weight:700;display:block;margin:1px 0}
.sc .so{font-size:10px;font-weight:900;display:block}
.sc .sr{font-size:7px;display:block;color:var(--sub)}

/* ===== 竞彩 PANEL ===== */
.jc-toggle{padding:4px 8px;margin:3px 0;border-radius:6px;border:1px solid rgba(255,215,0,.1);background:rgba(255,215,0,.02);color:var(--gold);cursor:pointer;font-size:8px;font-weight:600;text-align:center;width:100%}
.jc-panel{display:none;margin-top:4px}
.jc-panel.open{display:block}
.jc-section{margin-bottom:4px;padding:4px 6px;border-radius:6px;background:rgba(255,215,0,.015);border:1px solid rgba(255,215,0,.05)}
.jc-section .jct{font-size:8px;font-weight:700;color:var(--gold);margin-bottom:3px}
.jc-row{display:flex;gap:4px;flex-wrap:wrap}
.jc-item{padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.02);font-size:8px;white-space:nowrap}
.jc-item .jcn{color:var(--sub)}
.jc-item .jco{font-weight:700;margin-left:2px}
.jco-g{color:var(--accent)}.jco-y{color:var(--gold)}.jco-r{color:var(--red)}

/* ===== ANALYSIS VIEW ===== */
.analysis-match-selector{display:flex;gap:4px;padding:4px 0;overflow-x:auto;margin-bottom:4px}
.ams-btn{padding:3px 8px;border-radius:10px;border:1px solid var(--card-border);background:transparent;color:var(--sub);cursor:pointer;font-size:8px;white-space:nowrap;flex-shrink:0}
.ams-btn.active{background:rgba(255,215,0,.08);border-color:var(--gold);color:var(--gold)}
.analysis-full{margin-bottom:5px}
.analysis-full .af-card{padding:6px 8px;border:1px solid var(--card-border);border-radius:8px;margin-bottom:4px;background:rgba(255,215,0,.01);cursor:pointer}
.af-card .af-h{font-size:11px;font-weight:700}
.af-card .af-s{display:flex;gap:8px;margin-top:3px;font-size:8px;color:var(--sub);flex-wrap:wrap}

/* ===== REPORT SECTION ===== */
.rpt{padding:8px 10px}
.rpt-h{font-size:16px;font-weight:700;text-align:center;margin-bottom:6px;color:var(--gold)}
.rpt-box{border-radius:8px;padding:6px 8px;margin-bottom:6px;border:1px solid rgba(255,215,0,.08)}
.rpt-box .rpt-t{font-size:10px;font-weight:700;margin-bottom:3px}
.rpt-box .rpt-c{font-size:9px;line-height:1.6}
.rpt-table{width:100%;border-collapse:collapse;font-size:8px;margin:3px 0}
.rpt-table td{padding:3px 6px;border-bottom:1px solid rgba(255,215,0,.05)}
.strat-block{padding:5px 8px;margin:3px 0;border-radius:6px 0 0 6px}
.sb-c{border-left:3px solid var(--conservative);background:rgba(0,212,170,.03)}
.sb-b{border-left:3px solid var(--balanced);background:rgba(255,215,0,.03)}
.sb-a{border-left:3px solid var(--aggressive);background:rgba(255,71,87,.03)}
.back-btn{padding:3px 8px;border-radius:10px;border:1px solid var(--card-border);color:var(--sub);cursor:pointer;font-size:8px;margin-bottom:6px;display:inline-block}

/* ===== EMPTY ===== */
.empty{padding:30px 10px;text-align:center;color:var(--sub);font-size:11px}
.empty-r{display:none}

/* ===== MATCH SELECTOR DROPDOWN ===== */
.ms-wrap{position:relative;margin-bottom:4px}
.ms-btn{width:100%;padding:5px 10px;border:1px solid var(--card-border);border-radius:6px;background:rgba(255,215,0,.02);color:var(--text);cursor:pointer;font-size:10px;font-weight:600;text-align:left}
.ms-dd{display:none;position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--card);border:1px solid var(--card-border);border-radius:6px;max-height:200px;overflow-y:auto;margin-top:2px}
.ms-dd.open{display:block}
.ms-opt{padding:5px 8px;border:none;background:transparent;color:var(--text);cursor:pointer;font-size:9px;width:100%;text-align:left}
.ms-opt:hover{background:rgba(255,215,0,.03)}
.ms-opt.active{color:var(--gold);font-weight:700}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .pc-tm{font-size:11px}.pc-tm .fl{font-size:14px}
  .sc{min-width:70px;padding:4px 4px}
  .sc .sl{font-size:7px}.sc .sp{font-size:8px}.sc .so{font-size:9px}
  .header h1{font-size:16px}
  .jc-item{font-size:7px}
  .rpt-h{font-size:14px}
  .top-nav-btn{font-size:8px;padding:3px 8px}
}

@media(min-width:768px){
  .scards{flex-wrap:nowrap}
  .jc-row{gap:6px}
  .pc{padding:0}
}

.hide{display:none!important}
</style>
</head>
<body>

<div class="header">
  <h1>🏆 2026世界杯 · AI预测系统</h1>
  <div class="sub">每8h更新 · 竞彩全玩法 · 多维分析</div>
  <button class="theme-btn" onclick="tt()">🌙</button>
</div>

<div class="top-nav" id="topNav">
  <button class="top-nav-btn active" data-view="predict" onclick="swView('predict',this)">🏠 预测</button>
  <button class="top-nav-btn" data-view="analysis" onclick="swView('analysis',this)">📊 分析</button>
  <div class="top-nav-spacer"></div>
  <div style="position:relative">
    <button class="strat-btn" id="stratBtn" onclick="togStrat()">⚡ 均衡</button>
    <div class="strat-dd" id="stratDd">
      <button class="strat-opt" data-s="conservative" onclick="selStrat('conservative',this)"><span class="sl" style="color:var(--conservative)">🛡️ 保守</span><span class="sd">低风险，稳字当头</span></button>
      <button class="strat-opt active" data-s="balanced" onclick="selStrat('balanced',this)"><span class="sl" style="color:var(--balanced)">⚡ 均衡</span><span class="sd">收益风险兼顾</span></button>
      <button class="strat-opt" data-s="aggressive" onclick="selStrat('aggressive',this)"><span class="sl" style="color:var(--aggressive)">🔥 激进</span><span class="sd">追求高回报</span></button>
    </div>
  </div>
</div>

<div class="acc-bar" id="accBar">
  <div class="at">📊 预测准确度</div>
  <div class="as">
    <div class="ai"><div class="n" id="acTotal">-</div><div class="l">已预测</div></div>
    <div class="ai"><div class="n" id="acRate">-</div><div class="l">准确率</div></div>
    <div class="ai"><div class="n" id="acCorr">-</div><div class="l">猜中</div></div>
    <div class="ai"><div class="n"><span id="acDots"></span></div><div class="l">近5场</div></div>
  </div>
  <div class="note">⚽ 足球随机性大，顶级模型约58-65%，每场8维数据支撑，长期跟注正期望值自现</div>
</div>

<!-- ===== PREDICT VIEW ===== -->
<div id="viewPredict">
<div class="container">
<div class="status-bar"><span>📡 <span id="dataSt">加载中...</span></span><span>⏰ 下次: <span id="nxUp">-</span></span></div>
<div class="sub-nav">
  <button class="sub-btn active" data-f="all" onclick="filMatch('all',this)">📋 全部</button>
  <button class="sub-btn" data-f="today" onclick="filMatch('today',this)">🔥 今日</button>
  <button class="sub-btn" data-f="changes" onclick="filMatch('changes',this)">🔄 变化</button>
</div>
<div id="predictContent"><div class="empty">🤖 加载中...</div></div>
</div>
</div>

<!-- ===== ANALYSIS VIEW ===== -->
<div id="viewAnalysis" class="hide">
<div class="container">
<div class="sub-nav">
  <button class="sub-btn active" data-av="single" onclick="swAnaView('single',this)">🔍 单场分析</button>
  <button class="sub-btn" data-av="all_today" onclick="swAnaView('all_today',this)">📋 今日全部</button>
</div>
<div id="analysisContent"><div class="empty">📊 选择一场比赛查看完整分析</div></div>
</div>
</div>

<script>
// ===== CHINESE TEAM NAMES =====
const CN = {
  'Switzerland':'瑞士','Bosnia & Herzegovina':'波黑','Canada':'加拿大','Qatar':'卡塔尔',
  'Czech Republic':'捷克','South Africa':'南非','Mexico':'墨西哥','South Korea':'韩国',
  'Brazil':'巴西','Morocco':'摩洛哥','Haiti':'海地','Scotland':'苏格兰',
  'USA':'美国','Paraguay':'巴拉圭','Australia':'澳大利亚','Türkiye':'土耳其',
  'Germany':'德国','Curaçao':'库拉索',"Côte d'Ivoire":'科特迪瓦','Ecuador':'厄瓜多尔',
  'Netherlands':'荷兰','Japan':'日本','Sweden':'瑞典','Tunisia':'突尼斯',
  'Portugal':'葡萄牙','DR Congo':'刚果(金)','England':'英格兰','Croatia':'克罗地亚',
  'Ghana':'加纳','Panama':'巴拿马','Colombia':'哥伦比亚','Uzbekistan':'乌兹别克',
  'Argentina':'阿根廷','Algeria':'阿尔及利亚','Norway':'挪威','Iraq':'伊拉克',
  'France':'法国','Senegal':'塞内加尔','Austria':'奥地利','Jordan':'约旦',
  'Spain':'西班牙','Saudi Arabia':'沙特','Belgium':'比利时','Iran':'伊朗',
  'Uruguay':'乌拉圭','Cape Verde':'佛得角','New Zealand':'新西兰','Egypt':'埃及',
  'Turkey':'土耳其','Bosnia-Herzegovina':'波黑','Czechia':'捷克','Korea':'韩国',
  'Korea Republic':'韩国','DR Congo':'刚果(金)',"Cote d'Ivoire":'科特迪瓦',
};
const FL = {
  '瑞士':'🇨🇭','波黑':'🇧🇦','加拿大':'🇨🇦','卡塔尔':'🇶🇦','捷克':'🇨🇿','南非':'🇿🇦',
  '墨西哥':'🇲🇽','韩国':'🇰🇷','巴西':'🇧🇷','摩洛哥':'🇲🇦','海地':'🇭🇹','苏格兰':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',
  '美国':'🇺🇸','巴拉圭':'🇵🇾','澳大利亚':'🇦🇺','土耳其':'🇹🇷','德国':'🇩🇪','库拉索':'🇨🇼',
  '科特迪瓦':'🇨🇮','厄瓜多尔':'🇪🇨','荷兰':'🇳🇱','日本':'🇯🇵','瑞典':'🇸🇪','突尼斯':'🇹🇳',
  '葡萄牙':'🇵🇹','刚果(金)':'🇨🇩','英格兰':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','克罗地亚':'🇭🇷','加纳':'🇬🇭',
  '巴拿马':'🇵🇦','哥伦比亚':'🇨🇴','乌兹别克':'🇺🇿','阿根廷':'🇦🇷','阿尔及利亚':'🇩🇿',
  '挪威':'🇳🇴','伊拉克':'🇮🇶','法国':'🇫🇷','塞内加尔':'🇸🇳','奥地利':'🇦🇹','约旦':'🇯🇴',
  '西班牙':'🇪🇸','沙特':'🇸🇦','比利时':'🇧🇪','伊朗':'🇮🇷','乌拉圭':'🇺🇾','佛得角':'🇨🇻',
  '新西兰':'🇳🇿','埃及':'🇪🇬',
};
function cn(name){return CN[name]||name}
function fl(name){return FL[cn(name)]||''}

let AM=[],curView='predict',curStrat='balanced',curFil='all',curAv='single',curMatchIdx=0,mIdx=0;

// ===== DATA LOAD =====
function ld(){
  const u=(window.location.origin+(window.location.pathname.replace(/\/[^/]*$/,'')||'/xj/worldcup'))+'/data.json?v='+Date.now();
  fetch(u).then(r=>r.json()).then(d=>{
    AM=d.matches||[];document.getElementById('dataSt').textContent=(d.analysisCount||0)+'份';
    upAcc(d.prediction_accuracy);ren();
  }).catch(()=>{
    fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
      AM=d.matches||[];upAcc(d.prediction_accuracy);ren();
    }).catch(()=>{document.getElementById('dataSt').textContent='等待数据...';ren()});
  });
}

function upAcc(ac){
  if(!ac)return;
  document.getElementById('acTotal').textContent=ac.total_matches||0;
  document.getElementById('acRate').textContent=ac.accuracy_rate||'0%';
  document.getElementById('acCorr').textContent=(ac.correct_h2h||0)+'/'+(ac.total_matches||0);
  const dots=document.getElementById('acDots');
  if(ac.history&&ac.history.length){
    const r=ac.history.slice(-5);
    dots.innerHTML=r.map(h=>`<span class="dot ${h.rate>60?'up':h.rate>45?'flat':'down'}" title="${h.date}: ${h.rate}%"></span>`).join('');
  }
}

// ===== RENDER =====
function ren(){
  mIdx=0;
  if(curView==='predict')renPred();
  else renAna();
}

function renPred(){
  const el=document.getElementById('predictContent');
  if(!AM.length){el.innerHTML='<div class="empty">暂无赛程数据</div>';return}
  const days={};
  for(const m of AM){
    const d=m.date||'?';if(!days[d])days[d]=[];days[d].push(m);
  }
  let html='';
  const sD=Object.keys(days).sort((a,b)=>parseInt(a.split('/')[1])-parseInt(b.split('/')[1]));
  const tD=getT();
  for(const d of sD){
    if(curFil==='changes')break;
    if(curFil==='today'&&d!==tD)continue;
    const isT=d===tD;
    html+=`<div class="day-head" style="font-size:13px;font-weight:700;padding:6px 0 3px;color:var(--gold)">${isT?'🔥 ':''}${d} <span style="font-size:8px;color:var(--sub);font-weight:400">${days[d].length}场</span></div>`;
    for(const m of days[d])html+=rMC(m);
  }
  if(curFil==='changes'){
    html='<div style="font-size:13px;font-weight:700;padding:6px 0 3px;color:var(--gold)">🔄 变化追踪</div>';
    let has=false;
    for(const m of AM){if(m.changes&&m.changes.length){has=true;html+=rMC(m);}}
    if(!has)html+='<div class="empty">暂无变化</div>';
  }
  el.innerHTML=html;
}

function rMC(m){
  const al=m.analyses||[],l=al.length?al[al.length-1]:null;
  const c=l?l.confidence:0,cc=c>=80?'pch':c>=60?'pcm':'pcl';
  const mi=mIdx++,id='m'+mi,hasNew=l&&l.isNew;
  const hc=cn(m.home),ac=cn(m.away);
  const s=curStrat;let rP='-',rO='-',rR='-';
  if(l&&l.strategies&&l.strategies[s]){const x=l.strategies[s];rP=x.pick||'-';rO=x.odds||'-';rR=x.per_100||'-';rR=rR!=='-'?'¥'+rR:'-';}
  const sN=s==='conservative'?'保守':s==='balanced'?'均衡':'激进';
  const sB=s==='conservative'?'sbc':s==='balanced'?'sbb':'sba';
  
  let h=`<div class="pc">
  <div class="pc-head" onclick="togM('${id}')">
    <span class="pc-ar" id="ar${id}">▶</span>
    <span class="pc-tm"><span class="fl">${fl(hc)}</span>${hc}<span class="vs">vs</span><span class="fl">${fl(ac)}</span>${ac}</span>
    <span class="pc-ti">${m.date||''} ${m.time||''}</span>
    ${c?`<span class="pc-cb ${cc}">${c}%</span>`:''}
    ${hasNew?'<span class="nt">NEW</span>':''}
    ${rO!=='-'?`<span class="sb ${sB}">${sN} ${rO}</span>`:''}
  </div>
  <div class="pc-body" id="bd${id}">`;
  
  // Changes
  if(m.changes){for(const c of m.changes||[]){
    const ct=c.type==='good'?'chg-good':c.type==='bad'?'chg-bad':'chg-neutral';
    h+=`<div style="border-radius:4px;padding:2px 5px;margin:2px 0;font-size:8px;border-left:2px solid ${c.type==='good'?'var(--accent)':'var(--red)'};background:rgba(255,255,255,.01)"><b>${c.icon||'🔄'} ${c.label}</b> ${c.text}</div>`;
  }}
  
  // Strategy cards
  if(l&&l.strategies){
    const sc=l.strategies;const o=['conservative','balanced','aggressive'];
    const cs={'conservative':'var(--conservative)','balanced':'var(--balanced)','aggressive':'var(--aggressive)'};
    h+='<div class="scards">';
    for(const sk of o){
      const x=sc[sk];if(!x)continue;
      h+=`<div class="sc${sk===s?' sel':''}" style="border-color:${cs[sk]}" onclick="selStrat('${sk}',null)">
        <span class="sl" style="color:${cs[sk]}">${x.label}</span>
        <span class="sp">${x.pick}</span>
        <span class="so" style="color:${cs[sk]}">@${x.odds}</span>
        <span class="sr">每100→¥${x.per_100}</span>
      </div>`;
    }
    h+='</div>';
  }
  
  // 竞彩 panel
  h+=`<button class="jc-toggle" onclick="togJC(this)">⬇️ 展开竞彩全玩法</button>
  <div class="jc-panel">`;
  
  if(l&&l.jingcai_all){
    const j=l.jingcai_all;
    // SPF
    h+=`<div class="jc-section"><div class="jct">🎯 胜平负</div><div class="jc-row">`;
    const spfKeys=Object.keys(j.spf||{});
    for(const k of spfKeys){const v=j.spf[k];const c=v<=1.8?'g':v<=3.5?'y':'r';h+=`<span class="jc-item"><span class="jcn">${k==='Draw'?'平局':cn(k)}</span><span class="jco jco-${c}">${v}</span></span>`;}
    h+=`</div></div>`;
    
    // RANGQIU
    if(j.rangqiu){
      const rqKeys=Object.keys(j.rangqiu);
      if(rqKeys.length>0){const firstRq=j.rangqiu[rqKeys[0]];const hc=firstRq&&firstRq.handicap?firstRq.handicap:0;
      h+=`<div class="jc-section"><div class="jct">📊 让球胜平负 (${hc>0?'+':''}${hc})</div><div class="jc-row">`;
      for(const k of rqKeys){const v=j.rangqiu[k].odds;const c=v<=2?'g':v<=4?'y':'r';h+=`<span class="jc-item"><span class="jcn">${cn(k)}</span><span class="jco jco-${c}">${v}</span></span>`;}
      h+=`</div></div>`;}
    }
    
    // FIRST HALF
    if(j.first_half_spf){
      h+=`<div class="jc-section"><div class="jct">⏱️ 上半场胜平负</div><div class="jc-row">`;
      for(const[k,v]of Object.entries(j.first_half_spf)){const c=v<=2?'g':v<=4?'y':'r';h+=`<span class="jc-item"><span class="jcn">${k==='Draw'?'平局':cn(k)}</span><span class="jco jco-${c}">${v}</span></span>`;}
      h+=`</div></div>`;
    }
    // Total goals
    if(j.total_goals){
      h+=`<div class="jc-section"><div class="jct">⚽ 总进球数</div><div class="jc-row">`;
      for(const[k,v]of Object.entries(j.total_goals)){const c=v<=4?'g':v<=8?'y':'r';h+=`<span class="jc-item"><span class="jcn">${k}</span><span class="jco jco-${c}">${v}</span></span>`;}
      h+=`</div></div>`;
    }
    // Scores
    if(j.scores){
      h+=`<div class="jc-section"><div class="jct">🥅 波胆（比分）</div><div class="jc-row">`;
      for(const[k,v]of Object.entries(j.scores).slice(0,8)){const c=v<=7?'g':v<=12?'y':'r';h+=`<span class="jc-item"><span class="jcn">${k}</span><span class="jco jco-${c}">${v}</span></span>`;}
      h+=`</div></div>`;
    }
    // Half Full
    if(j.half_full){
      h+=`<div class="jc-section"><div class="jct">🔄 半全场</div><div class="jc-row">`;
      for(const[k,v]of Object.entries(j.half_full).slice(0,6)){const c=v<=4?'g':v<=8?'y':'r';h+=`<span class="jc-item"><span class="jcn">${k}</span><span class="jco jco-${c}">${v}</span></span>`;}
      h+=`</div></div>`;
    }
    // 串关 (只推荐合理组合)
    if(j.chuan_guan&&j.chuan_guan.length){
      // Filter: only show picks where all entries are the favorite
      const spfKeys2=Object.keys(j.spf||{});
      let favTeam = ''; let favOdds = 0;
      for(const k of spfKeys2){if(j.spf[k]>favOdds){favOdds=j.spf[k];favTeam=k;}}
      const sensible = j.chuan_guan.filter(c => 
        !c.picks.includes('平局') || c.picks.includes(favTeam)
      ).slice(0,2);
      if(sensible.length){
        h+=`<div class="jc-section"><div class="jct">🔗 推荐串关</div>`;
        for(const c of sensible){
          h+=`<div style="font-size:8px;padding:2px 0"><span style="color:var(--gold);font-weight:700">${c.type}</span>: ${c.picks} — <b style="font-size:10px">${c.odds}倍</b> <span style="color:var(--accent)">每100→¥${Math.round(100*c.odds)}</span></div>`;
        }
        h+=`</div>`;
      }
    }
  }else{
    h+=`<div style="font-size:8px;color:var(--sub);padding:4px">⏳ 赔率计算中...</div>`;
  }
  h+=`</div>`;
  
  // Analysis text
  if(al.length){
    for(const a of al){
      h+=`<div style="border-left:2px solid var(--gold);padding:3px 0 3px 7px;margin:3px 0;font-size:10px;line-height:1.5">
        <div style="font-size:7px;color:var(--sub);margin-bottom:1px">🕐 ${a.time}</div>
        <div>${a.text}</div>
        ${a.fullReport?`<div style="text-align:right;margin-top:2px"><button class="top-nav-btn" style="font-size:7px;padding:2px 6px" onclick="showFR('${fl(hc)}${hc} vs ${fl(ac)}${ac}','${(a.time||'').replace(/'/g,"\\'")}','${encodeURIComponent(a.fullReport||'')}')">📄 完整分析</button></div>`:''}
      </div>`;
    }
  }
  
  h+=`</div></div>`;
  return h;
}

// ===== ANALYSIS VIEW =====
function renAna(){
  const el=document.getElementById('analysisContent');
  if(!AM.length){el.innerHTML='<div class="empty">暂无赛程数据</div>';return}
  if(curAv==='single')renAnaSingle(el);
  else renAnaAll(el);
}

function renAnaSingle(el){
  // Match selector
  const upc=AM.filter(m=>!m.result||m.result==='');
  let h=`<div class="ms-wrap">
    <button class="ms-btn" onclick="this.nextElementSibling.classList.toggle('open')">⬇️ ${curMatchIdx<upc.length?fl(cn(upc[curMatchIdx].home))+' '+cn(upc[curMatchIdx].home)+' vs '+fl(cn(upc[curMatchIdx].away))+' '+cn(upc[curMatchIdx].away):'选择比赛'}</button>
    <div class="ms-dd">`;
  for(let i=0;i<upc.length;i++){
    const m=upc[i];const a=cn(m.home),b=cn(m.away);
    h+=`<button class="ms-opt${i===curMatchIdx?' active':''}" onclick="curMatchIdx=${i};renAna()">${fl(a)}${a} vs ${fl(b)}${b} ${m.date||''}</button>`;
  }
  h+=`</div></div>`;
  
  // Report
  if(upc.length>0&&curMatchIdx<upc.length){
    const m=upc[curMatchIdx];const a=m.analyses?.[m.analyses.length-1];
    if(a&&a.fullReport){h+=`<div class="rpt">${decodeURIComponent(a.fullReport)}</div>`;}
    else h+=`<div class="empty">⏳ 等待分析</div>`;
  }else h+=`<div class="empty">暂无未开始比赛</div>`;
  
  el.innerHTML=h;
}

function renAnaAll(el){
  const tD=getT();let h='';
  const tdM=AM.filter(m=>m.date===tD);
  if(!tdM.length){el.innerHTML='<div class="empty">今日暂无比赛</div>';return}
  h+=('<div style="font-size:13px;font-weight:700;padding:6px 0;color:var(--gold)">'+'🔥 今日 '+tD+' 全部分析</div>');
  for(const m of tdM){
    const a=m.analyses?.[m.analyses.length-1];
    const hc=cn(m.home),ac=cn(m.away);
    h+=('<div class="pc"><div class="pc-head" onclick="this.nextElementSibling.classList.toggle(\'open\');this.classList.toggle(\'ex\')">'+'<span class="pc-ar">▶</span><span class="pc-tm"><span class="fl">'+fl(hc)+'</span>'+hc+'<span class="vs">vs</span><span class="fl">'+fl(ac)+'</span>'+ac+'</span><span class="pc-ti">'+(m.time||'')+'</span>'+(a&&a.confidence?'<span class="pc-cb '+(a.confidence>=80?'pch':a.confidence>=60?'pcm':'pcl')+'">'+a.confidence+'%</span>':'')+'</div><div class="pc-body"><div style="font-size:10px;color:var(--sub);margin-bottom:4px">'+(a?'🎯 '+a.text:'⏳ 等待分析')+'</div>'+(a&&a.fullReport?'<div class="rpt" style="padding:0">'+decodeURIComponent(a.fullReport)+'</div>':'')+'</div></div>');
  }
  el.innerHTML=h;
}

// ===== FULL REPORT MODAL =====
function showFR(title,time,enc){
  const r=decodeURIComponent(enc);
  const modal=document.createElement('div');modal.className='modal';
  modal.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;overflow-y:auto;padding:15px 8px';
  modal.innerHTML=`<div style="max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:16px;position:relative">
    <button style="position:absolute;top:10px;right:12px;background:rgba(255,255,255,.05);border:none;color:var(--sub);font-size:14px;cursor:pointer;width:24px;height:24px;border-radius:50%" onclick="this.closest('.modal').remove()">✕</button>
    <div style="font-size:14px;font-weight:700;margin-bottom:8px;padding-right:24px;color:var(--gold)">${title} · ${time}</div>
    <div style="font-size:11px;line-height:1.7;color:var(--text)">${r}</div>
  </div>`;
  document.body.appendChild(modal);
  modal.onclick=function(e){if(e.target===this)this.remove()};
}

// ===== UTILS =====
function togM(id){const b=document.getElementById('bd'+id);if(!b)return;const a=document.getElementById('ar'+id);b.classList.toggle('open');a.classList.toggle('open');b.previousElementSibling.classList.toggle('ex')}
function togJC(btn){const p=btn.nextElementSibling;p.classList.toggle('open');btn.textContent=p.classList.contains('open')?'⬆️ 收起竞彩':'⬇️ 展开竞彩全玩法'}
function togStrat(){document.getElementById('stratDd').classList.toggle('open')}
function selStrat(s,btn){
  curStrat=s;
  const n={'conservative':'🛡️ 保守','balanced':'⚡ 均衡','aggressive':'🔥 激进'};
  document.getElementById('stratBtn').textContent=n[s];
  document.querySelectorAll('.strat-opt').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');else document.querySelector(`.strat-opt[data-s="${s}"]`).classList.add('active');
  document.getElementById('stratDd').classList.remove('open');
  ren();
}
document.addEventListener('click',function(e){if(!e.target.closest('.strat-dd')&&!e.target.closest('.strat-btn'))document.getElementById('stratDd').classList.remove('open')});

function swView(v,btn){
  curView=v;
  document.querySelectorAll('.top-nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.getElementById('viewPredict').classList.toggle('hide',v!=='predict');
  document.getElementById('viewAnalysis').classList.toggle('hide',v!=='analysis');
  ren();
}
function filMatch(f,btn){
  curFil=f;
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  ren();
}
function swAnaView(v,btn){
  curAv=v;
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  ren();
}
function getT(){const d=new Date();return (d.getMonth()+1)+'/'+d.getDate()}
function tt(){document.body.classList.toggle('light');const l=document.body.classList.contains('light');localStorage.setItem('wcT',l?'l':'d')}
if(localStorage.getItem('wcT')==='l')document.body.classList.add('light');

// ===== INIT =====
function uNx(){
  const n=new Date(),h=n.getHours();const nx=new Date(n);
  nx.setHours(Math.floor(h/8)*8+8,0,0,0);
  document.getElementById('nxUp').textContent=nx.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}
uNx();setInterval(uNx,60000);
ld();
</script>
