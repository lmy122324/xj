<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给徐静 💀</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');
body {
  min-height: 100vh;
  background: linear-gradient(145deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%);
  font-family: 'Noto Serif SC', 'PingFang SC', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
  cursor: default;
}

/* Stars background */
#stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

/* Moon */
.moon {
  position: fixed; top: 6%; right: 8%; width: 80px; height: 80px;
  background: radial-gradient(circle at 35% 35%, #fce9b6, #f5d78a);
  border-radius: 50%; box-shadow: 0 0 60px rgba(245, 215, 138, 0.3), 0 0 120px rgba(245, 215, 138, 0.1);
  z-index: 1; pointer-events: none; opacity: 0.8;
}
.moon::after {
  content: ''; position: absolute; top: 8px; left: 12px;
  width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, rgba(245,215,138,0.15), transparent);
}

/* Main container */
.container {
  position: relative; z-index: 10; text-align: center;
  padding: 20px; width: 100%; max-width: 420px;
}

/* Opening screen */
#opening {
  display: flex; flex-direction: column; align-items: center;
  opacity: 1; transition: opacity 0.8s ease;
}
#opening h1 {
  color: #fce9b6; font-size: 22px; font-weight: 900;
  letter-spacing: 2px; line-height: 1.6; margin-bottom: 12px;
  text-shadow: 0 0 30px rgba(245, 215, 138, 0.3);
}
#opening .sub {
  color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 30px;
}
.start-btn {
  background: linear-gradient(135deg, #ff6b8a, #ff4777); color: #fff;
  border: none; padding: 14px 48px; border-radius: 50px;
  font-size: 17px; font-family: inherit; font-weight: 700;
  cursor: pointer; transition: all 0.3s ease;
  box-shadow: 0 4px 25px rgba(255, 71, 119, 0.4);
  letter-spacing: 2px;
}
.start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 35px rgba(255, 71, 119, 0.6); }
.start-btn:active { transform: scale(0.97); }

/* Game screen */
#game {
  display: none; position: relative;
}
#game .title {
  color: rgba(255,255,255,0.6); font-size: 13px; margin-bottom: 8px; letter-spacing: 1px;
}
#game .counter {
  color: #fce9b6; font-size: 16px; font-weight: 700; margin-bottom: 20px;
}
.progress-bar {
  width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 25px;
  overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #ff6b8a, #fce9b6);
  border-radius: 2px; transition: width 0.5s ease; width: 0%;
}

/* Heart grid */
.heart-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 0 auto;
  max-width: 320px; position: relative;
}
.heart-cell {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04); border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.06);
  cursor: pointer; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative; font-size: 28px;
}
.heart-cell:hover { border-color: rgba(255, 107, 138, 0.3); transform: scale(1.03); }
.heart-cell.found {
  background: rgba(255, 107, 138, 0.15); border-color: #ff6b8a;
  cursor: default; pointer-events: none; animation: heartFound 0.6s ease;
}
.heart-cell.found .heart-icon { opacity: 1; }
.heart-cell .heart-icon { opacity: 0.3; transition: opacity 0.3s; }
.heart-cell .found-mark { display: none; color: #ff6b8a; font-size: 16px; }
.heart-cell.found .found-mark { display: block; }
.heart-cell.found .heart-icon { display: none; }

@keyframes heartFound {
  0% { transform: scale(1); }
  30% { transform: scale(1.3); }
  60% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* Floating particles (hearts/stars) */
.floating-particle {
  position: fixed; pointer-events: none; z-index: 5;
  font-size: 14px; animation: floatUp ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  100% { opacity: 0; transform: translateY(-120px) scale(0.3) rotate(180deg); }
}

/* Message overlay */
#message-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
  z-index: 100; justify-content: center; align-items: center;
  padding: 30px;
}
#message-overlay.show { display: flex; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.message-card {
  background: linear-gradient(160deg, rgba(30,20,50,0.95), rgba(20,10,40,0.95));
  border: 1px solid rgba(255,107,138,0.3); border-radius: 20px;
  padding: 35px 28px; max-width: 380px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); text-align: center;
  animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes cardIn { from { opacity: 0; transform: scale(0.8) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.message-card .heart-big { font-size: 40px; margin-bottom: 15px; }
.message-card .msg-text {
  color: rgba(255,255,255,0.9); font-size: 16px; line-height: 1.9;
  text-align: left; margin-bottom: 20px; letter-spacing: 0.5px;
}
.message-card .msg-text .highlight { color: #ff6b8a; font-weight: 700; }
.message-card .close-btn {
  background: linear-gradient(135deg, #ff6b8a, #ff4777); color: #fff;
  border: none; padding: 10px 36px; border-radius: 50px;
  font-size: 14px; font-family: inherit; font-weight: 700;
  cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
}
.message-card .close-btn:hover { transform: scale(1.05); }

/* Final screen */
#final-screen {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, rgba(30,10,40,0.98), rgba(5,5,20,0.99));
  z-index: 200; justify-content: center; align-items: center; flex-direction: column;
  padding: 30px; text-align: center;
}
#final-screen.show { display: flex; animation: fadeIn 1s ease; }
#final-screen .big-heart { font-size: 60px; margin-bottom: 15px; animation: pulse 1.5s ease infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
#final-screen h1 {
  color: #fce9b6; font-size: 22px; font-weight: 900; line-height: 1.6; margin-bottom: 8px;
}
#final-screen .message {
  color: rgba(255,255,255,0.8); font-size: 15px; line-height: 2; margin: 10px 0 25px;
  max-width: 340px; letter-spacing: 0.5px;
}
#final-screen .message .name { color: #ff6b8a; font-weight: 700; }
.final-btn {
  background: linear-gradient(135deg, #ff6b8a, #ff4777); color: #fff;
  border: none; padding: 16px 50px; border-radius: 50px;
  font-size: 18px; font-family: inherit; font-weight: 700;
  cursor: pointer; transition: all 0.3s; letter-spacing: 2px;
  box-shadow: 0 4px 30px rgba(255, 71, 119, 0.5);
}
.final-btn:hover { transform: scale(1.05); box-shadow: 0 8px 40px rgba(255, 71, 119, 0.6); }
.final-btn:active { transform: scale(0.97); }
.final-sub { color: rgba(255,255,255,0.3); font-size: 12px; margin-top: 15px; }

/* Confetti canvas */
#confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 300; pointer-events: none; }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div class="moon"></div>

<div class="container" id="app">
  <!-- Opening -->
  <div id="opening">
    <h1>🌙<br>有一份礼物<br>想送给你</h1>
    <p class="sub">点开看看</p>
    <button class="start-btn" onclick="startGame()">打开 💌</button>
  </div>

  <!-- Game -->
  <div id="game">
    <p class="title">💫 找到藏在星星里的心</p>
    <div class="counter" id="counter">0 / 9</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="heart-grid" id="heart-grid"></div>
  </div>
</div>

<!-- Message overlay -->
<div id="message-overlay">
  <div class="message-card">
    <div class="heart-big" id="msg-emoji">💕</div>
    <div class="msg-text" id="msg-text"></div>
    <button class="close-btn" onclick="closeMessage()">好的 ❤️</button>
  </div>
</div>

<!-- Final screen -->
<div id="final-screen">
  <div class="big-heart">💖</div>
  <h1>全部找到了</h1>
  <div class="message" id="final-message"></div>
  <button class="final-btn" onclick="finalClick()" id="final-btn">我愿意 ❤️</button>
  <p class="final-sub" id="final-sub"></p>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
// ── Stars Background ──
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
}
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
    r: Math.random() * 1.5 + 0.3, a: Math.random(), s: Math.random() * 0.008 + 0.003
  });
}
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.s;
    const alpha = (Math.sin(s.a) + 1) / 2 * 0.7 + 0.3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}
drawStars();

// ── Messages ──
const messages = [
  { emoji: '🌙', text: '点击这里，发现我的心 💕' },
  { emoji: '✨', text: '从 <span class="highlight">5月16日</span> 认识你那天起，我就觉得——这个女孩真特别' },
  { emoji: '🌊', text: '我看起来可能大大咧咧的，但其实我<span class="highlight">内心很脆弱</span>' },
  { emoji: '💭', text: '有时候你不回消息，我会胡思乱想一整天' },
  { emoji: '🛡️', text: '别人面前我装得很坚强，但在你面前，我<span class="highlight">愿意卸下所有防备</span>' },
  { emoji: '📱', text: '<span class="highlight">徐静</span>，你知道吗？你是我每天最期待的消息' },
  { emoji: '🌏', text: '我不需要全世界，<span class="highlight">有你在就够了</span>' },
  { emoji: '🤫', text: '我嘴上不说，但我真的很需要你……' },
  { emoji: '💀', text: '最后一颗心了。<br><span class="highlight">你能陪陪我吗？</span>' }
];

const finalText = '从5.16到现在，我的心里一直住着一个人。<br>那个人是你。<br><br><span class="name">徐静</span>，愿意一直陪着我吗？<br><br><span style="color:rgba(255,255,255,0.4);font-size:13px;">—— 呆板大王 💀</span>';

let found = new Set();
let heartsContainer = document.getElementById('heart-grid');

function buildGrid() {
  heartsContainer.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const div = document.createElement('div');
    div.className = 'heart-cell';
    div.dataset.index = i;
    div.innerHTML = `<span class="heart-icon">💫</span><span class="found-mark">💕</span>`;
    div.addEventListener('click', () => clickHeart(i, div));
    heartsContainer.appendChild(div);
  }
}

function clickHeart(index, el) {
  if (found.has(index)) return;
  found.add(index);
  el.classList.add('found');
  document.getElementById('counter').textContent = `${found.size} / 9`;
  document.getElementById('progress-fill').style.width = `${(found.size / 9) * 100}%`;

  // Floating particles
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'floating-particle';
    p.textContent = ['💕','✨','💫','❤️','🌟','💖'][Math.floor(Math.random() * 6)];
    const rect = el.getBoundingClientRect();
    p.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 40) + 'px';
    p.style.top = (rect.top + rect.height / 2) + 'px';
    p.style.animationDuration = (Math.random() * 0.6 + 0.6) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }

  // Show message
  const msg = messages[index];
  document.getElementById('msg-emoji').textContent = msg.emoji;
  document.getElementById('msg-text').innerHTML = msg.text;
  document.getElementById('message-overlay').classList.add('show');

  // Check if all found
  if (found.size === 9) {
    setTimeout(() => showFinal(), 800);
  }
}

function closeMessage() {
  document.getElementById('message-overlay').classList.remove('show');
}

function startGame() {
  document.getElementById('opening').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  buildGrid();
}

function showFinal() {
  document.getElementById('message-overlay').classList.remove('show');
  setTimeout(() => {
    document.getElementById('final-message').innerHTML = finalText;
    document.getElementById('final-screen').classList.add('show');
    startConfetti();
  }, 500);
}

let confettiRunning = false;
function finalClick() {
  const btn = document.getElementById('final-btn');
  const sub = document.getElementById('final-sub');
  btn.textContent = '我会一直陪着你 ❤️';
  btn.style.background = 'linear-gradient(135deg, #fce9b6, #f5d78a)';
  sub.textContent = '💀 呆板大王';
  startConfetti();
}

// ── Confetti ──
const confettiCanvas = document.getElementById('confetti-canvas');
const cctx = confettiCanvas.getContext('2d');
confettiCanvas.width = window.innerWidth;
confettiCanvas.height = window.innerHeight;

const confettiPieces = [];
const colors = ['#ff6b8a', '#ff4777', '#fce9b6', '#ff9a9e', '#a18cd1', '#fbc2eb', '#fff', '#ffd700'];

function startConfetti() {
  if (confettiRunning) return;
  confettiRunning = true;
  for (let i = 0; i < 80; i++) {
    confettiPieces.push({
      x: Math.random() * confettiCanvas.width,
      y: Math.random() * confettiCanvas.height - confettiCanvas.height,
      w: Math.random() * 8 + 4,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 2,
      vy: Math.random() * 2 + 1,
      r: Math.random() * 360,
      rv: (Math.random() - 0.5) * 4
    });
  }
  animateConfetti();
}

function animateConfetti() {
  cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  let done = true;
  confettiPieces.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.r += p.rv;
    p.vy += 0.02;
    if (p.y < confettiCanvas.height + 20) done = false;
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.r * Math.PI / 180);
    cctx.fillStyle = p.color; cctx.globalAlpha = 0.8;
    cctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    cctx.restore();
  });
  if (!done) requestAnimationFrame(animateConfetti);
}

window.addEventListener('resize', () => {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
});
</script>
</body>
</html>
